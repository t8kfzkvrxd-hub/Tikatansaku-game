window.onload=async()=>{
 const f=document.querySelector('iframe'),w=f.contentWindow,d=w.document,s=w.__gameDebug.state,out=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)};
 try{
 w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.owned.elna=true;s.chapter.companion='elna';s.chapter.equipment.elna=w.emptyEquipmentSlots();s.screen='town';w.render();check(d.querySelectorAll('.party-lobby progress').length===4,'lobby Lv and EXP for both');

 const p=w.characterProgress('elna');p.level=9;p.exp=0;w.grantCharacterExperience('elna',w.characterExpRequired(9));check(d.querySelector('.level-up-toast.milestone')&&p.level===10,'milestone level up');
 p.level=50;w.openCharacterStatus('elna');check(d.querySelector('.character-growth').textContent.includes('MAX')&&d.querySelector('.character-growth').textContent.includes('さらなる成長'),'Lv50 cap');s.bossFirstKills[1000]=true;p.level=51;w.openCharacterStatus('elna');check(d.querySelector('.abyss-level'),'abyss level frame');delete s.bossFirstKills[1000];p.level=10;
 w.closeGenericModal();s.screen='door_select';s.floor=3;s.currentDoors=[];w.render();check(d.querySelector('.party-summary').textContent.includes('エルナ')&&d.querySelector('.level-risk'),'exploration vitals / recommended Lv');

 m.unit.hp=0;w.usePotion(0);check(!w.applyHealingTarget('elna')&&s.inventory.length===1,'normal potion cannot revive');w.closeGenericModal();
 s.screen='battle';s.hp=100;s.currentEnemy={hp:10000,maxHp:10000,atk:50,def:0,name:'敵',icon:'👹',actionType:'attack'};
 check(w.selectEnemyTarget(s.currentEnemy,()=>0)==='player','fainted Elna excluded');const before=s.currentEnemy.hp;w.companionTurn(s.currentEnemy);check(s.currentEnemy.hp===before&&s.hp>0,'fainted does not attack; player continues');
 w.healCompanionAtRest();check(m.unit.hp===Math.floor(m.stats.maxHp*.25),'rest revives 25 percent');check(w.selectEnemyTarget(s.currentEnemy,()=>0)==='elna'&&w.selectEnemyTarget(s.currentEnemy,()=>.99)==='player','both enemy targets');
 w.Math.random=()=>.99;const hp=m.unit.hp;w.companionReceiveAttack(s.currentEnemy,10);check(m.unit.hp<hp,'Elna receives damage');m.unit.hp=1;w.companionReceiveAttack(s.currentEnemy,100);w.render();check(d.querySelector('[data-combat-unit=elna]').textContent.includes('気絶'),'fainted UI');
 w.saveState();w.loadState();check(w.partyMember('elna').unit.hp===0&&w.characterProgress('elna').level===10,'HP0 / Lv preserved on load');w.restoreCompanionsAtTown();check(w.partyMember('elna').unit.hp===w.companionStats().maxHp,'town fully heals');
 for(const [width,height]of [[1366,768],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(80);w.openCharacterStatus('elna');let r=d.querySelector('.update-notes-card').getBoundingClientRect();check(r.top>=0&&r.bottom<=height&&d.querySelector('.update-notes-body').scrollWidth<=d.querySelector('.update-notes-body').clientWidth+1,width+' status fits');w.closeGenericModal();s.screen='door_select';s.currentEnemy=null;w.partyMember('elna').unit.hp=10;w.usePotion(0);r=d.querySelector('.healing-targets button').getBoundingClientRect();check(r.height>=44&&r.width>=44,width+' healing tap target');w.closeGenericModal();}
 w.closeGenericModal();w.partyMember('elna').unit.hp=0;w.saveState();await new Promise(resolve=>{f.onload=resolve;w.location.reload()});check(w.partyMember('elna').unit.hp===0,'real reload preserves fainted HP');

 out.push('ALL TESTS PASSED');
 }catch(e){out.push('FAIL: '+e.stack)}d.defaultView;document.getElementById('results').textContent=out.join('\n');
};</script>
