<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:740px;height:360px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,d=w.document,s=w.__gameDebug.state,out=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},act=async fn=>{w.eval('summonLastAction=0');return await fn();};try{
w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.screen='town';s.bossFirstKills[20]=true;s.deepestFloorReached=20;s.vaultGold=10000;s.summonSystem=null;w.saveState();w.openSummons();check(d.body.textContent.includes('はじめての召喚'),'tutorial intro');const before=s.vaultGold;await act(()=>w.summonGacha(1));check(s.vaultGold===before,'no gacha before tutorial');await act(()=>w.summonTutorialNext());check(s.summonSystem.tutorial==='gift','gift step');await act(()=>w.summonFree());check(s.summonSystem.tutorial==='dispatch','free slime');
await act(()=>w.startSummonDispatch('mini-slime',1,10,true));let job=s.summonSystem.jobs[0];check(job&&job.range.max===9&&job.fee===0&&Object.values(job.rewards).reduce((a,b)=>a+b,0)>=1,'tutorial dispatch reward guaranteed');const stored=JSON.stringify(job);w.loadState();check(JSON.stringify(s.summonSystem.jobs[0])===stored,'offline job reload');job=s.summonSystem.jobs[0];job.start-=600001;job.end-=600001;w.saveState();await act(()=>w.claimSummonDispatch(job.id));check(s.summonSystem.tutorial==='gachaIntro','gacha introduction after reward');await act(()=>w.summonTutorialNext());check(s.summonSystem.tutorial==='done','tutorial completed');await act(()=>w.startSummonDispatch('mini-slime',1,10,true));check(!s.summonSystem.jobs.length,'tutorial reward cannot repeat');
const o=s.summonSystem.owned['mini-slime'];o.stones=12;for(let level=2;level<=5;level++){await act(()=>w.summonUpgrade('mini-slime'));check(s.summonSystem.owned['mini-slime'].contractLevel===level,'level '+level);}check(o.stones===1,'11 stones spent');await act(()=>w.summonUpgrade('mini-slime'));check(o.contractLevel===5&&o.stones===1,'MAX guarded');await act(()=>w.summonConvert('mini-slime'));check(o.stones===0&&s.summonSystem.universalStones===1,'surplus conversion');
s.summonSystem.owned['moss-rat']={stones:0};w.summonState();check(s.summonSystem.owned['moss-rat'].contractLevel===1,'legacy contract Lv1');s.summonSystem.universalStones=2;await act(()=>w.summonUpgrade('moss-rat'));check(s.summonSystem.universalStones===0&&s.summonSystem.owned['moss-rat'].contractLevel===2,'universal 2 to 1');check(Math.abs(w.summonSpecialtyPoints(w.eval('SUMMONS["mini-slime"]'))-.15)<1e-8,'specialty +5pt');
for(const [tier,count]of [[2,49],[3,99],[4,199],[5,299],[5,350]]){const data={owned:{},pity:{2:0,3:0,4:0,5:0}};data.pity[tier]=count;const r=w.summonDraw(data,()=>0);check(w.eval('SUMMONS')[r.id].tier===tier,'pity '+tier+'/'+count);}s.summonSystem.pity[5]=350;w.summonState();check(s.summonSystem.pity[5]===350,'old pity not clipped');
for(const minutes of [10,30,60,180,360]){const gold=s.vaultGold;await act(()=>w.startSummonDispatch('mini-slime',1,minutes));const j=s.summonSystem.jobs[0];check(j&&j.end-j.start===minutes*60000*.95,'duration -5% '+minutes);check(gold-s.vaultGold===({10:0,30:0,60:0,180:1000,360:3000})[minutes],'fee '+minutes);s.summonSystem.jobs=[];w.saveState();}
s.vaultGold=0;await act(()=>w.startSummonDispatch('mini-slime',1,180));check(!s.summonSystem.jobs.length&&s.vaultGold===0&&d.body.textContent.includes('Gが不足'),'insufficient G');s.vaultGold=10000;
for(const summon of w.eval('Object.values(SUMMONS).filter(s=>!s.preserveNominalRewards)')){s.summonSystem.owned[summon.id]={contractLevel:5,stones:0};const plans=w.summonPlans(summon,w.summonRanges()[0],60);for(const kind of ['normal','rare']){const n=plans.filter(p=>p.kind===kind).reduce((a,p)=>a+p.attempts*p.rate,0),rates=w.materialDropPlan({source:'enemy'}).after,cap=w.eval('SUMMON_CONFIG.caps')[kind],baseline=60*.95*(kind==='normal'?rates[0]:rates.slice(1).reduce((a,b)=>a+b,0))*cap;check(n<=baseline+1e-8,'real-time cap '+summon.id+kind);}}
await act(()=>w.summonFocus('mini-slime',1,'area_1_enemy_0'));const plans=w.summonPlans(w.eval('SUMMONS["mini-slime"]'),w.summonRanges()[0],60);check(plans.filter(p=>p.kind==='normal').map(p=>p.attempts).join(',')==='30,15,15','focus weights');
for(const [width,height]of [[740,360],[844,390],[932,430],[1366,768],[1920,1080]]){f.style.width=width+'px';f.style.height=height+'px';await wait(100);for(const open of [()=>w.openSummons('gacha'),()=>w.openSummonContract('mini-slime'),()=>w.openSummons('dispatch'),()=>w.confirmSummonDispatch('mini-slime',1,180),()=>{s.summonSystem.tutorial='intro';w.openSummons();}]){open();const body=d.querySelector('.update-notes-body'),rect=d.querySelector('.update-notes-actions').getBoundingClientRect();check(body.scrollWidth<=body.clientWidth+1&&rect.bottom<=height,'layout '+width);check([...d.querySelectorAll('#modal-layer button')].every(b=>b.getBoundingClientRect().height>=44),'44px');w.closeGenericModal();}s.summonSystem.tutorial='done';out.push('SIZE PASSED '+width+'x'+height);}
w.saveState();const saved=JSON.stringify(s.summonSystem);await new Promise(resolve=>{f.onload=resolve;f.contentWindow.location.reload()});f.contentWindow.enterGameFromHome();check(JSON.stringify(f.contentWindow.__gameDebug.state.summonSystem)===saved,'real reload');out.push('ALL TESTS PASSED');
}catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n');};</script>
