<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.mode='skip';s.chapter.complete=true;s.chapter.owned.elna=true;s.chapter.companion='elna';s.hp=99999;
const areas=w.eval('explorationAreas');let draws=0;const positions=new Set();
for(const a of areas){for(let i=0;i<20;i++){s.floor=a.floorMin;w.generateDoorsForFloor();const ds=s.currentDoors;check(ds.length===3&&ds.some(d=>['battle_normal','elite_battle'].includes(d.type)),'combat '+s.floor);positions.add(ds.findIndex(d=>['battle_normal','elite_battle'].includes(d.type)));check(ds.every(d=>d.type&&d.desc&&d.sign&&w.eval('EXPLORATION_ROUTES')[d.type]),'registered routes');const root=w.document.getElementById('exploration-screen');check(!root.textContent.includes('undefined')&&root.querySelectorAll('.exploration-route').length===3,'cards');draws++;}
for(const floor of [a.floorMin,a.floorMax]){s.floor=floor;w.generateDoorsForFloor();check(w.explorationArea()===a,'boundary '+floor);if(floor===a.floorMax){check(s.screen==='battle'&&s.currentEnemy.name===w.getCurrentArea().boss.name&&w.document.getElementById('exploration-screen').hidden,'boss '+floor);}else{await w.document.querySelector('.exploration-background').decode();check(w.document.querySelectorAll('.exploration-effects i').length===a.effects.length,'effects');w.startNormalBattle(false);check(!!s.currentEnemy.name&&w.dropMonsterMaterials(s.currentEnemy,()=>.5).every(k=>w.eval('MATERIALS')[k]),'enemy/material');}}
}
check(draws===400&&positions.size===3,'400 draws all positions');
for(let floor=10;floor<=200;floor+=10){s.chapter.read[floor]=true;s.floor=floor;s.hp=99999;s.camp.vaultSize=100000;w.generateDoorsForFloor();s.currentEnemy.hp=0;w.onEnemyKilled();const kills=s.runKills;w.onEnemyKilled();check(s.runKills===kills&&s.bossFirstKills[floor],'boss reward once '+floor);check(floor===200?s.screen==='town':s.floor===floor+1,'boss next '+floor);w.saveState();w.loadState();check(s.bossFirstKills[floor],'boss saved '+floor);}
for(const [width,height]of [[1366,768],[1920,1080],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(80);for(const a of areas){s.floor=a.floorMin;w.generateDoorsForFloor();const root=w.document.getElementById('exploration-screen');check(root.scrollWidth<=root.clientWidth&&root.scrollHeight<=root.clientHeight,width+' '+a.name+' fits');for(const b of root.querySelectorAll('button')){const r=b.getBoundingClientRect();check(r.top>=0&&r.bottom<=height&&r.height>=44,'tap target');}for(const e of root.querySelectorAll('.exploration-effects i'))check(w.getComputedStyle(e).animationName!=='none'&&w.getComputedStyle(e).display!=='none','animated effect');check(w.getComputedStyle(root.querySelector('img')).transform==='none','fixed background');}}
s.returnResolved=false;s.floor=199;w.generateDoorsForFloor();s.floor=200;w.generateDoorsForFloor();s.currentEnemy.hp=0;w.onEnemyKilled();check(s.floor<=200&&s.screen==='town','200 safe stop');s.bossFirstKills={100:true};s.deepestFloorReached=100;check(w.canWarpTo(101)&&!w.canWarpTo(111)&&!w.canWarpTo(201),'warp');w.afterChapterBoss(100);check(s.floor===101&&w.explorationArea().floorMin===101,'100 to 101');out.push('ALL TESTS PASSED');
}catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n')};
</script>
