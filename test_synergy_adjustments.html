<!doctype html><meta charset="utf-8"><iframe src="index.html#game"></iframe><pre id="results">RUNNING</pre><script>
window.onload=()=>{const w=document.querySelector('iframe').contentWindow,s=w.__gameDebug.state,log=[],check=(v,n)=>{if(!v)throw Error(n);log.push('PASS '+n)};try{
w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.owned.elna=true;s.chapter.companion='elna';w.partyMember('elna');s.screen='battle';s.floor=100;
const builds=w.eval('COMPLETED_BUILDS');
const maintained={dismantler:[['part','heavy','partPower',20],['attack','broken','power',10]],untouched:[['attack','unhurt','power',12],['dodge','always','nextPower',15]],bloodFury:[['attack','low','crit',10],['leech','low','leech',2]],deepHunter:[['part','deepBoss','partPower',20],['attack','deepBoss','power',10]],embers:[['hit','third','fire',1],['attack','status','power',8]],avenger:[['reflect','always','reflect',8],['attack','hurt','power',10]],execution:[['attack','heavyThird','power',18],['attack','armored','pierce',10]],spellCycle:[['hit','skill','nextPower',15],['attack','normal','power',8]],chainHunter:[['kill','mob','heal',2],['kill','always','nextPower',15]],caravan:[['incoming','always','reduction',4],['effects','always','chestQuality',8]],prospector:[['effects','always','rareMaterial',2],['part','always','partPower',10]],endurance:[['attack','long','power',12],['incoming','firstIncoming','shield',3]]};
for(const[id,rules]of Object.entries(maintained))check(JSON.stringify(builds.find(b=>b.id===id).rules.map(r=>[r.trigger,r.condition,r.stat,r.value]))===JSON.stringify(rules),'unchanged '+id);
function equip(id,actor='player'){const b=builds.find(b=>b.id===id),eq=w.emptyEquipmentSlots();['weapon','armor','accessory'].forEach((slot,i)=>eq[slot]={id:actor+slot,key:'test',type:slot==='armor'?'armor':slot,primaryBuildTag:b.requiredTags[i]});if(actor==='player')s.equipped=eq;else s.chapter.equipment[actor]=eq;return eq;}
const enemy=()=>({hp:100000,maxHp:100000,def:80,atk:50,turnCount:0,synergyRound:0,buildStatuses:{},gearPoison:0});let e=enemy();s.currentEnemy=e;s.hp=80;s.buildRuntime={hits:0,hurt:0,shield:0,charge:0};
let eq=equip('bloodPact');e.buildStatuses.bleed=1;w.rememberSynergyStatuses(e,eq,{});e.buildStatuses.bleed=0;e.synergyRound=1;
check(w.evaluateSynergies(eq,'attack',{enemy:e,unit:s}).values.power===10,'blood recent turn');e.synergyRound=2;check(!w.evaluateSynergies(eq,'attack',{enemy:e,unit:s}).values.power,'blood memory expires');
eq=equip('iceTomb');e=enemy();s.currentEnemy=e;e.buildStatuses.freeze=1;w.rememberSynergyStatuses(e,eq,{});e.buildStatuses.freeze=0;const before=JSON.stringify(s.buildRuntime);w.buildAttack({atk:100,crit:0,maxHp:100},e,'attack',eq,80,{...s.buildRuntime});check(w.synergyMemory(e,s).freezeReady,'preview keeps freeze');let st={atk:100,crit:0,maxHp:100};w.buildAttack(st,e,'attack',eq,80);check(st.crit===27,'freeze remembered +12 with native crit15');check(!w.synergyMemory(e,s).freezeReady,'freeze consumed on attack');
const elna=equip('iceTomb','elna');check(!w.evaluateSynergies(elna,'attack',{enemy:e,unit:w.partyMember('elna').unit}).values.crit,'memory actor isolation');
eq=equip('thunderChain');e=enemy();s.currentEnemy=e;e.buildStatuses.shock=1;w.rememberSynergyStatuses(e,eq,{});e.buildStatuses.shock=0;s.buildRuntime.hits=1;check(w.evaluateSynergies(eq,'hit',{enemy:e,unit:s}).values.extra===12,'shock remembered');w.synergyHit(e,'attack',false,eq,s,{atk:100,maxHp:100});check(!w.synergyMemory(e,s).shockReady,'shock consumed');
eq=equip('hexJudge');e=enemy();s.currentEnemy=e;e.buildStatuses.curse=1;w.rememberSynergyStatuses(e,eq,{});e.buildStatuses.curse=0;e.synergyRound=1;check(w.evaluateSynergies(eq,'attack',{enemy:e,unit:s}).values.power===12,'curse recent');s.buildRuntime.hits=3;check(w.evaluateSynergies(eq,'hit',{enemy:e,unit:s}).values.defDown===2,'DEF cap2');
for(const [id,expected]of [['bastion',5],['shelter',3]]){eq=equip(id);s.buildRuntime={hits:0,hurt:0,shield:0,charge:0};e=enemy();s.currentEnemy=e;check(w.evaluateSynergies(eq,'incoming',{enemy:e,unit:s,maxHp:100}).values.shield===expected,id+' first shield');w.buildIncomingDamage(0,e,eq,s,100,true);check(s.buildRuntime.shield<=15,'shield cap');check(!w.evaluateSynergies(eq,'incoming',{enemy:e,unit:s,maxHp:100}).values.shield,'shield once');}
eq=equip('shadowArmy');s.buildRuntime.hits=3;check(w.evaluateSynergies(eq,'hit',{enemy:e,unit:s}).values.summon===20,'shadow third');
eq=equip('firstLight');e=enemy();s.currentEnemy=e;check(w.evaluateSynergies(eq,'attack',{enemy:e,unit:s}).values.dawnPierce===20,'opening pierce20');w.temporarySynergy(e,s,eq).actions=2;check(!w.evaluateSynergies(eq,'attack',{enemy:e,unit:s}).values.dawnPierce,'opening ends after two actor actions');
eq=equip('alchemist');e=enemy();s.currentEnemy=e;e.buildStatuses.fire=4;s.buildRuntime={hits:0,hurt:0,shield:0,charge:0};const random=w.Math.random;w.Math.random=()=>.99;w.buildHit(e,'attack',false,eq);w.Math.random=random;check(e.buildStatuses.fire===4&&e.buildStatuses.shock===1,'one consumed then completed fire+1');
eq=equip('plague');e=enemy();s.currentEnemy=e;e.buildStatuses.bleed=2;s.buildRuntime={hits:3,hurt:0,shield:0,charge:0};w.synergyHit(e,'attack',false,eq,s,{atk:100,maxHp:100});check(e.buildStatuses.fire===1&&!e.buildStatuses.freeze,'one missing status only');
eq=equip('windChase');s.buildRuntime.hits=2;check(w.evaluateSynergies(eq,'hit',{enemy:e,unit:s}).values.extra===8,'wind8');
eq=equip('abyssCovenant');let b=w.completedBuildState(eq).find(b=>b.id==='abyssCovenant');check(b.configured&&b.locked&&!b.active,'abyss locked100');w.openCompletedBuilds('player','abyssCovenant');check(w.document.body.textContent.includes('構成完成 / 主効果未解禁'),'locked UI');s.floor=500;check(w.completedBuildState(eq).find(b=>b.id==='abyssCovenant').active,'abyss500');
for(const [boss,hp,expected]of [[true,100000,40],[true,4000,20],[false,4000,60]]){e={hp,maxHp:hp,isBoss:boss,gearPoison:1};w.equipmentPoisonTick(e);check(hp-e.hp===expected,'poison '+boss+' '+hp);}
eq=equip('bastion');eq.weapon.secondaryBuildTags=['normalAttack','boss','deep','longFight','lowHp','onHurt'];e=enemy();e.isBoss=true;e.turnCount=8;s.currentEnemy=e;s.hp=10;s.buildRuntime={hits:0,hurt:1,shield:0,charge:1};w.syncSynergyRuntime(s,eq);s.buildRuntime.synergyNext=20;const messages=[],add=w.addLog;w.addLog=msg=>messages.push(msg);w.buildAttack({atk:100,crit:0,maxHp:100},e,'attack',eq,10);w.addLog=add;check(messages.some(m=>m.includes('実適用 +0%')),'UI reports cap-clipped next value');
check(!JSON.stringify(s.equipped).includes('Ready'),'no memory on saved gear');log.push('ALL TESTS PASSED');
}catch(e){log.push('FAIL: '+e.stack)}document.getElementById('results').textContent=log.join('\n');};</script>
