<!doctype html><meta charset="utf-8"><title>装備シナジー監査</title><iframe src="index.html#game" hidden></iframe><button id="download" disabled>全装備の監査JSONを保存</button><pre id="results">RUNNING</pre><script>
window.onload=()=>{const w=document.querySelector('iframe').contentWindow,catalog=w.eval('EQUIPMENT_CATALOG'),groups=new Map();const rows=Object.entries(catalog).map(([id,r])=>{const spec=w.itemSynergy(r),tags=[...w.buildTags({r})],signature=JSON.stringify([r.primaryBuildTag,r.secondaryBuildTags,r.effects]);if(!groups.has(signature))groups.set(signature,[]);groups.get(signature).push(id);return {id,name:r.name,slot:w.equipmentSlot(r),rarity:r.rarity,weaponType:r.weaponType||null,primaryBuildTag:r.primaryBuildTag,secondaryBuildTags:r.secondaryBuildTags||[],effects:r.effects||{},parent:r.parent||null,children:Object.keys(catalog).filter(k=>catalog[k].parent===id),awakening:!!r.awakening,existingDescription:r.desc||'',nativeKernelDescriptions:tags.map(t=>w.eval('BUILD_RULE_TEXT')[t]),synergy:spec,synergyDescriptions:spec?.rules.map(w.synergyRuleText)||[],flags:{unassigned:!r.primaryBuildTag,emptyNumericEffects:!Object.keys(r.effects||{}).length,noNativeKernel:!tags.length,noSynergy:!spec?.rules.length}};});
const report={total:rows.length,synergy:rows.filter(r=>!r.flags.noSynergy).length,missing:rows.filter(r=>r.flags.noSynergy).length,duplicateExistingEffectGroups:[...groups.values()].filter(g=>g.length>1),distribution:Object.fromEntries(Object.keys(w.eval('BUILD_CATALOG')).map(t=>[t,rows.filter(r=>r.primaryBuildTag===t).length])),rows};window.auditReport=report;document.getElementById('results').textContent=JSON.stringify({...report,rows:undefined,duplicateExistingEffectGroups:report.duplicateExistingEffectGroups.length},null,2);const b=document.getElementById('download');b.disabled=false;b.onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='equipment-synergy-audit.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};};</script>
