<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.mode='skip';s.chapter.owned.elna=true;s.chapter.companion='elna';s.hp=9999;
 for(let floor=1;floor<=10;floor++){s.floor=floor;w.generateDoorsForFloor();check(s.screen===(floor===10?'battle':floor===5?'safe_point':'door_select'),floor+' correct screen');if(floor!==5&&floor!==10)check(!w.document.getElementById('exploration-screen').hidden,'new UI');}
 const positions=new Set();let failures=0;for(let i=0;i<100;i++){s.floor=1;w.generateDoorsForFloor();const at=s.currentDoors.findIndex(d=>['battle_normal','elite_battle'].includes(d.type));if(at<0||s.currentDoors.filter(d=>["battle_normal","elite_battle"].includes(d.type)).length!==1)failures++;positions.add(at)}check(failures===0&&positions.size===3,'100 generations zero missing combat / all positions');
 s.floor=2;w.generateDoorsForFloor();w.companionCombatUnit().hp=0;w.render();check(w.document.getElementById('exploration-screen').textContent.includes('気絶'),'Elna faint HUD');
 for(const [width,height]of [[1920,1080],[1366,768],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(100);w.render();const root=w.document.getElementById('exploration-screen');check(root.scrollWidth<=root.clientWidth&&root.scrollHeight<=root.clientHeight,width+' no overflow');for(const b of root.querySelectorAll('button')){const r=b.getBoundingClientRect();check(r.top>=0&&r.bottom<=height&&r.left>=0&&r.right<=width&&r.height>=44,width+' button fits');}check(root.querySelectorAll('.exploration-effects i').length===3,'effects exist');}
 const before=JSON.stringify({floor:s.floor,hp:s.hp,inventory:s.inventory});w.saveState();w.loadState();check(JSON.stringify({floor:s.floor,hp:s.hp,inventory:s.inventory})===before,'save unchanged');
 s.floor=1;w.generateDoorsForFloor();await wait(450);const index=s.currentDoors.findIndex(d=>['battle_normal','elite_battle'].includes(d.type));for(let i=0;i<20;i++)w.selectExplorationRoute(index);await wait(200);check(s.screen==='battle','route connects battle once');check(w.document.getElementById('exploration-screen').hidden,'leaving hides UI');
 for(const type of ['chest_normal','cursed_chest','heal_spring','mystery_wanderer']){s.screen='door_select';s.currentDoors=[{type,sign:'試験',icon:'◇',desc:'既存イベント'}];w.render();await wait(450);w.selectExplorationRoute(0);await wait(200);check(type==='cursed_chest'?s.currentDoors.chestClaimed:s.screen==='event'&&s.currentEvent,type+' existing event connected');await wait(600);}
 s.screen='door_select';s.floor=2;s.currentDoors=[{type:'battle_normal',sign:'試験',icon:'⚔️',desc:'試験'}];w.render();const visual=w.eval('ExplorationScreen.visual');visual.line='試験台詞';w.companionCombatUnit().hp=10;w.render();check(w.document.querySelector('.exploration-line')?.textContent.includes('試験台詞'),'dialogue visible when conscious');
 const image=w.document.querySelector('.exploration-background');check(image.complete&&image.naturalWidth>0,'background loaded');const effects=[...w.document.querySelectorAll('.exploration-effects i')],beforeEffects=effects.map(e=>w.getComputedStyle(e).transform+w.getComputedStyle(e).opacity);await wait(500);check(effects.some((e,i)=>w.getComputedStyle(e).transform+w.getComputedStyle(e).opacity!==beforeEffects[i]),'effects change over time');
 out.push('ALL TESTS PASSED');
 }catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n')};
</script>
