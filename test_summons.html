<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:740px;height:360px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,d=w.document,s=w.__gameDebug.state,out=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},unlock=()=>w.eval('summonLastAction=0');try{
w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.screen='town';const existing=JSON.stringify([s.equipped,s.storage,s.vaultGold,s.chapter]);check(!w.summonsUnlocked(),'locked new game');w.summonState();check(existing===JSON.stringify([s.equipped,s.storage,s.vaultGold,s.chapter]),'old save initialization preserves data');
const catalog=w.eval('Object.values(SUMMONS)'),config=w.eval('SUMMON_CONFIG');check(catalog.length===30,'30 summons');check(JSON.stringify(config.rarities.map(r=>catalog.filter(s=>s.rarity===r).length))==='[8,7,6,4,3,2]','rarity counts');
let seed=81231;const rng=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296},counts=Array(6).fill(0),actual=Array(6).fill(0),sample={owned:{},pity:{2:0,3:0,4:0,5:0}};
for(let i=0;i<100000;i++){counts[w.summonTier(rng)]++;const r=w.summonDraw(sample,rng);actual[w.eval('SUMMONS')[r.id].tier]++;}counts.forEach((n,i)=>check(Math.abs(n/100000-config.rates[i])<.004,'base frequency '+config.rarities[i]+' '+n/1000+'%'));out.push('PITY-INCLUSIVE '+actual.map(n=>n/1000+'%').join(' / '));
for(const [tier,cap]of Object.entries(config.pity)){const p={owned:{},pity:{2:0,3:0,4:0,5:0}};p.pity[tier]=cap-1;const r=w.summonDraw(p,()=>0);check(w.eval('SUMMONS')[r.id].tier===Number(tier)&&p.pity[tier]===0,'pity '+tier);}
s.bossFirstKills[20]=true;s.deepestFloorReached=20;s.vaultGold=100000;w.saveState();unlock();await w.summonFree();check(!!s.summonSystem.owned['mini-slime'],'free summon');unlock();const gold=s.vaultGold;await w.summonGacha(1);check(s.vaultGold===gold-5000,'single cost');unlock();await w.summonGacha(10);check(s.vaultGold===gold-50000,'ten cost');check(s.summonSystem.history.length===10,'ten results');
const p={owned:{},pity:{2:0,3:0,4:0,5:0}};w.summonDraw(p,()=>0);w.summonDraw(p,()=>0);check(p.owned['moss-rat'].stones===1,'duplicate stone');
for(const summon of catalog)for(const kind of ['normal','rare','boss'])check(w.summonEff(summon,kind,Object.keys(w.eval('SUMMON_SPECIALTIES')))<=config.caps[kind],'cap '+summon.id+' '+kind);
check(Math.abs(w.summonEff(w.eval('SUMMONS["moss-rat"]'),'normal',['plant'])-.3)<1e-8,'additive specialty');
check(w.summonEff(w.eval('SUMMONS["mine-bat"]'),'normal',['ore'])>w.summonEff(w.eval('SUMMONS["jade-wolf"]'),'normal',['ore']),'Common ore specialist beats Rare generalist');
const range=w.summonRanges()[0],plans=w.summonPlans(w.eval('SUMMONS["mini-slime"]'),range,60);check(!plans.some(p=>p.kind==='boss'),'uncleared boss excluded');check(!plans.some(p=>['Legendary','Mythic','Abyssal'].includes(w.eval('MATERIALS')[p.key].rarity)),'rarity gates');
s.bossFirstKills[10]=true;const bossPlans=w.summonPlans(w.eval('SUMMONS["mini-slime"]'),range,60).filter(p=>p.kind==='boss');check(bossPlans.length>0&&bossPlans.every(p=>p.attempts===2),'boss independent 30 min cadence');
const expectation=plans.reduce((n,p)=>n+p.attempts*p.rate,0);let total=0;for(let i=0;i<10000;i++)total+=Object.values(w.rollSummonPlans(plans,rng)).reduce((a,b)=>a+b,0);check(Math.abs(total/10000-expectation)<.12,'material expectation '+expectation.toFixed(3)+' measured '+(total/10000).toFixed(3));
unlock();await w.startSummonDispatch('mini-slime',3,10);check(s.summonSystem.jobs.length===0,'unreached range rejected');unlock();await w.startSummonDispatch('mini-slime',1,10);check(s.summonSystem.jobs.length===1,'dispatch');const job=JSON.parse(JSON.stringify(s.summonSystem.jobs[0]));unlock();await w.claimSummonDispatch(job.id);check(s.summonSystem.jobs.length===1,'early claim rejected');w.loadState();check(JSON.stringify(s.summonSystem.jobs[0])===JSON.stringify(job),'job reload exact');
const current=s.summonSystem.jobs[0];current.start-=600001;current.end-=600001;current.rewards={'area_1_enemy_0_common':2};w.saveState();const before=s.storage.length;unlock();await Promise.all(Array.from({length:20},()=>w.claimSummonDispatch(job.id)));check(s.storage.length===before+2&&s.summonSystem.jobs.length===0,'20 claims only one reward');w.loadState();check(s.storage.length===before+2,'reward saved');
let blocked=false;try{w.summonClock({lastClock:Date.now()+120000})}catch(e){blocked=true}check(blocked,'backwards clock rejected');
unlock();await w.summonFavorite('mini-slime');w.loadState();check(s.summonSystem.owned['mini-slime'].favorite,'favorite persisted');
w.summonFilter('name','ミニスライム');check(d.querySelectorAll('.summon-grid article').length===1&&d.querySelector('.summon-grid').textContent.includes('ミニスライム'),'name filter');w.summonFilter('name','');w.summonFilter('rarity','Abyssal');check(d.querySelectorAll('.summon-grid article').length===2,'rarity filter');w.summonFilter('rarity','');w.summonFilter('specialty','aquatic');check(d.querySelectorAll('.summon-grid article').length===1,'specialty filter');w.summonFilter('specialty','');
const originalSave=w.saveState,previousGold=s.vaultGold;w.saveState=()=>false;unlock();await w.summonGacha(1);check(s.vaultGold===previousGold,'save failure rolls back G');w.saveState=originalSave;w.closeGenericModal();
for(const [width,height]of [[740,360],[844,390],[932,430],[1366,768],[1920,1080]]){
for(let cycle=0;cycle<3;cycle++){f.style.width=height+'px';f.style.height=width+'px';await wait(40);f.style.width=width+'px';f.style.height=height+'px';await wait(80);w.render();
for(const tab of ['gacha','dispatch','codex']){w.openSummons(tab);await wait(30);const body=d.querySelector('.update-notes-body'),footer=d.querySelector('.update-notes-actions').getBoundingClientRect();check(body.scrollWidth<=body.clientWidth+1&&footer.bottom<=height,'UI '+width+' '+tab);for(const b of body.querySelectorAll('button,select,input')){const r=b.getBoundingClientRect();check(r.height>=44&&r.width>=44,'tap');}w.closeGenericModal();}
w.openSummonResults(s.summonSystem.history,true);check(d.querySelector('.update-notes-actions').getBoundingClientRect().bottom<=height,'result footer');w.closeGenericModal();w.showHomeScreen();w.enterGameFromHome();}
out.push('SIZE PASSED '+width+'x'+height);
}
const saved=JSON.stringify(s.summonSystem);await new Promise(resolve=>{f.onload=resolve;f.contentWindow.location.reload()});const fresh=f.contentWindow;fresh.enterGameFromHome();check(JSON.stringify(fresh.__gameDebug.state.summonSystem)===saved,'real page reload preserves summons');
out.push('ALL TESTS PASSED');}catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n');};</script>
