<!doctype html><meta charset="utf-8"><title>47 build audit</title><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const w=document.querySelector('iframe').contentWindow,s=w.__gameDebug.state,rows=[],checks=[],random=w.Math.random;const assert=(v,n)=>{if(!v)throw Error(n);checks.push(n)},record=(tag,value)=>rows.push({tag,name:w.eval('BUILD_CATALOG')[tag],description:w.eval('BUILD_OLD_DESCRIPTIONS')[tag],condition:w.eval('BUILD_AUDIT_RULES')[tag][0],effect:w.eval('BUILD_AUDIT_RULES')[tag][1],code:w.eval('BUILD_AUDIT_RULES')[tag][2],grade:tag==='abyssal'?'B':'A',result:value});
try{w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.owned.elna=true;s.chapter.companion='elna';s.chapter.equipment.elna=w.emptyEquipmentSlots();s.screen='town';w.saveState=()=>{};w.showItemToast=()=>{};
const gear=(tag,effects={})=>({id:'audit-'+tag,type:'weapon',slot:'weapon',baseAtk:100,primaryBuildTag:tag,secondaryBuildTags:[],tags:tag?[tag]:[],effects});
function setup(tag){s.equipped=w.emptyEquipmentSlots();s.equipped.weapon=gear(tag);s.hp=50;s.floor=100;s.buildRuntime={hits:0,hurt:0,kills:0,shield:0,charge:0};s.currentEnemy={hp:10000,maxHp:10000,atk:100,def:100,turnCount:0,isBoss:false,buildStatuses:{},actionType:'heavy'};w.Math.random=()=>.99;return s.currentEnemy;}
function atk(tag,{action='attack',hp=100,turn=0,boss=false,hurt=0,kills=0,charge=0,poison=0,floor=100}={}){const e=setup(tag);e.turnCount=turn;e.isBoss=boss;e.gearPoison=poison;s.buildRuntime.hurt=hurt;s.buildRuntime.kills=kills;s.buildRuntime.charge=charge;s.floor=floor;const st={atk:100,crit:0,maxHp:100};w.buildAttack(st,e,action,s.equipped,hp);return st;}
for(const [tag,yes,no,expected]of [
 ['lowHp',{hp:34},{hp:35},120],['highHp',{hp:90},{hp:89},120],['normalAttack',{action:'attack'},{action:'heavy'},130],['heavyAttack',{action:'heavy'},{action:'attack'},130],['skillPower',{action:'skill'},{action:'attack'},120],['singleStrike',{action:'heavy'},{action:'attack'},150],['boss',{boss:true},{boss:false},120],['mob',{boss:false},{boss:true},120],['statusHunter',{poison:3},{poison:0},120],['longFight',{turn:4},{turn:3},120],['burst',{turn:1},{turn:2},120],['onHurt',{hurt:1},{hurt:0},120],['unhurt',{hurt:0},{hurt:1},120],['counter',{charge:1},{charge:0},120],['deep',{floor:61},{floor:60},120],['abyssal',{floor:500},{floor:200},120]]){const a=atk(tag,yes).atk,b=atk(tag,no).atk;assert(a===expected&&b===100,tag+' boundary');record(tag,`${b}→${a} ATK（条件なし→あり）`);}
assert(atk('pierce').atk===135,'pierce');record('pierce','DEF100: ATK100→135');assert(atk('crit').crit===15,'crit');let critical=0;for(let i=0;i<1000;i++)if(i/1000*100<15)critical++;assert(critical===150,'crit 1000');record('crit','会心+15pt、等間隔1000抽選150回');
for(const tag of ['bleed','poison','fire','freeze','shock','curse','status']){let count=0;for(let i=0;i<1000;i++){const e=setup(tag);w.Math.random=()=>i/1000;w.buildHit(e,'attack',false,s.equipped);if(tag==='poison'||tag==='status'?e.gearPoison>0:e.buildStatuses[tag]>0)count++;}assert(count===(tag==='status'?550:300),tag+' probability');record(tag,`${count}/1000付与（等間隔乱数）。`);}
for(const tag of ['bleed','fire']){const e=setup(tag);e.maxHp=1000;e.buildStatuses[tag]=2;w.buildStatusTick(e);assert(e.hp===9990,'DOT '+tag);}let frozen=0;for(let i=0;i<1000;i++){const e=setup('freeze');e.buildStatuses.freeze=1;w.Math.random=()=>i/1000;w.buildStatusTick(e);if(e.stunned)frozen++;}assert(frozen===250,'freeze 250/1000');
for(const [tag,period,mult]of [['multiHit',3,.2],['speed',2,.1],['summon',4,.35]]){const e=setup(tag),base=w.getPlayerStats().atk;for(let i=1;i<period;i++)w.buildHit(e,'attack',false,s.equipped);assert(e.hp===10000,tag+' early');w.buildHit(e,'attack',false,s.equipped);assert(10000-e.hp===Math.round(base*mult),tag+' damage');record(tag,`${period}命中目にATK${mult*100}%=${10000-e.hp}`);}
let extra=0;for(let i=0;i<1000;i++){const e=setup('extraAttack');w.Math.random=()=>i/1000;w.buildHit(e,'attack',false,s.equipped);if(e.hp<10000)extra++;}assert(extra===250,'extra 1000');record('extraAttack','250/1000追加ヒット');
let e=setup('followUp');e.gearPoison=3;const base=w.getPlayerStats().atk;w.buildHit(e,'attack',false,s.equipped);assert(e.hp===10000,'follow queued');w.buildStatusTick(e);assert(e.hp===10000-Math.round(base*.2),'follow applied');record('followUp',`予約→敵行動前${Math.round(base*.2)}ダメージ`);
e=setup('conversion');w.buildHit(e,'attack',false,s.equipped);assert(!e.buildStatuses.shock,'no invented fire');e.buildStatuses.fire=3;w.buildHit(e,'attack',false,s.equipped);assert(e.buildStatuses.fire===0&&e.buildStatuses.shock===3,'conversion');record('conversion','炎なし0 / 炎3→感電3');
e=setup('hybrid');const hybridBase=w.getPlayerStats().atk;w.buildHit(e,'attack',false,s.equipped);assert(10000-e.hp===Math.round(hybridBase*.05),'hybrid');record('hybrid',`異常0種：${Math.round(hybridBase*.05)}ダメージ`);
e=setup('defDown');w.buildHit(e,'attack',false,s.equipped);assert(e.def===99,'defDown');record('defDown','DEF100→99');
e=setup('lifesteal');s.hp=0;assert(w.healFromWeaponDamage(s,{maxHp:100,vamp:0},e,100,s.equipped)===4,'leech 4');record('lifesteal','100ダメージ→4HP / 上限・ボス補正は共通計算');
e=setup('overheal');s.hp=99;w.healFromWeaponDamage(s,{maxHp:100,vamp:10},e,100,s.equipped);assert(s.hp===100&&s.buildRuntime.shield===7,'overheal');record('overheal','HP99→100、回復8の余剰7→障壁');
for(const [tag,guard,expected]of [['shield',false,95],['safe',false,95],['guard',true,90]]){e=setup(tag);const d=w.buildIncomingDamage(100,e,s.equipped,s,100,guard);assert(d===expected,tag);record(tag,`100→${d}ダメージ`);}
e=setup('reflect');w.buildIncomingDamage(100,e,s.equipped,s,100);assert(e.hp===9985,'reflect');record('reflect','被ダメ100→敵へ15反射');
e=setup('dodge');assert(w.equipmentEffects().dodge===8,'dodge');record('dodge','固定回避+8pt（共通集計）');e=setup('justGuard');assert(w.equipmentEffects().justAttack===30,'just');record('justGuard','JUST後次撃補正30%（実被弾接続は既存戦闘回帰テスト）');e=setup('skillHaste');assert(w.equipmentEffects().skillHaste===1,'haste');record('skillHaste','CT短縮1T（主人公2→1 / エルナ3→2）');
e=setup('onKill');s.hp=50;w.buildKill(s,s.equipped,100);assert(s.hp===53&&s.buildRuntime.kills===1,'kill');record('onKill','HP50→53、撃破数0→1');
e=setup(null);const plain=w.partBreakPower(100,s.equipped,'attack');s.equipped.weapon=gear('break');const power=w.partBreakPower(100,s.equipped,'attack');assert(plain===55&&power===72,'break');record('break',`耐久ダメージ55→72。部位報酬8%→22%は既存専用テスト`);
const source=w.__gameDebug.AREAS[0].enemies[0].materialSource;
function drops(tag){setup(tag);s.chapter.companion=null;let count=0,epic=0;for(let i=0;i<1000;i++){s.inventory=[];const keys=w.dropMonsterMaterials({materialSource:source,parts:[]},()=>i/1000);count+=keys.length;epic+=keys.filter(k=>w.eval('MATERIALS')[k].rarity==='Epic').length;}return {count,epic};}
const baseline=drops(null),farm=drops('farming'),rare=drops('rareMaterial');assert(farm.count-baseline.count===80&&rare.epic-baseline.epic===80,'material simulations');record('farming',JSON.stringify({baseline,farm}));record('rareMaterial',JSON.stringify({baseline,rare}));
function chests(tag){setup(tag);s.chapter.companion=null;s.bossFirstKills[100]=true;let high=0;for(let i=0;i<1000;i++){const item=w.createMaterialReward('chest',100,null,()=>i/1000);if(item.rarity==='Legendary')high++;}return high;}const cb=chests(null),ct=chests('chest');assert(Math.abs(ct-cb-100)<=1,'chests');record('chest',`1000箱 Legendary ${cb}→${ct}`);
setup('lifesteal');s.equipped.weapon.effects={lifestealRate:2};s.equipped.head=gear('lifesteal',{lifestealRate:3});s.equipped.armor=gear('lifesteal');const rates=w.buildLifestealValues(s,{maxHp:100,vamp:0},s.currentEnemy,s.equipped);assert(rates.base===4&&rates.equipment===5,'set once effects summed');s.chapter.companion='elna';s.chapter.equipment.elna.weapon=gear('crit');assert(!w.buildTags(s.chapter.equipment.elna).has('lifesteal')&&!w.buildTags(s.equipped).has('crit'),'independent');
for(const tag of ['bleed','poison','fire','freeze','shock','curse','status','extraAttack']){let seed=271828,count=0;const rng=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};for(let i=0;i<1000;i++){const e=setup(tag);w.Math.random=rng;w.buildHit(e,'attack',false,s.equipped);if(tag==='extraAttack'?e.hp<10000:tag==='poison'||tag==='status'?e.gearPoison>0:e.buildStatuses[tag]>0)count++;}const expected=tag==='status'?550:tag==='extraAttack'?250:300;assert(Math.abs(count-expected)<80,tag+' seeded 1000');rows.find(r=>r.tag===tag).result+=` / 固定seed独立抽選 ${count}/1000`;}
assert(rows.length===47&&new Set(rows.map(r=>r.tag)).size===47,'47 distinct cases');w.Math.random=random;document.getElementById('results').textContent='ALL TESTS PASSED\n'+JSON.stringify({rows,checks},null,2);
}catch(err){w.Math.random=random;document.getElementById('results').textContent='FAIL: '+err.stack+'\n'+JSON.stringify({rows,checks});}
};</script>
