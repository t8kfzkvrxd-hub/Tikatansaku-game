<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.owned.elna=true;s.chapter.companion='elna';s.equipped=w.emptyEquipmentSlots();s.chapter.equipment.elna=w.emptyEquipmentSlots();s.equipped.weapon={id:'audit-p',type:'weapon',primaryBuildTag:'lowHp',secondaryBuildTags:['summon'],baseAtk:100};s.chapter.equipment.elna.weapon={id:'audit-e',type:'weapon',primaryBuildTag:'justGuard',baseAtk:100};s.floor=1;w.startNormalBattle();s.hp=w.getPlayerStats().maxHp*.2;
const enemy=s.currentEnemy,unit=w.companionCombatUnit();enemy.actionType='heavy';unit.defending=true;w.Math.random=()=>.99;w.companionReceiveAttack(enemy,100);check(unit.attackBuff===1.3,'Elna JUST actual buff 30%');check(!w.equipmentEffects().justAttack,'no player leakage');
s.chapter.equipment.elna.weapon={id:'dodge-audit',type:'weapon',primaryBuildTag:'dodge'};unit.defending=false;s.screen="town";let dodged=0;for(let i=0;i<1000;i++){unit.hp=w.companionStats('elna').maxHp;const before=unit.hp;w.Math.random=()=>i/1000;w.companionReceiveAttack(enemy,100);if(unit.hp===before)dodged++;}s.screen="battle";check(dodged===80,'Elna real dodge 80/1000');
s.chapter.equipment.elna.weapon={id:'haste-audit',type:'weapon',primaryBuildTag:'skillHaste',baseAtk:1};unit.hp=w.companionStats('elna').maxHp;unit.cooldown=0;enemy.hp=100000;enemy.maxHp=100000;w.Math.random=()=>.99;s.lastPlayerAction='skill';w.companionTurn(enemy);check(unit.cooldown===2,'Elna actual skill CD 3 to 2');
s.chapter.equipment.elna.weapon={id:'audit-e',type:'weapon',primaryBuildTag:'justGuard',baseAtk:100};
s.buildRuntime.hurt=3;s.buildRuntime.shieldGranted=true;unit.buildRuntime.hurt=2;w.startNormalBattle();check(s.buildRuntime.hurt===0&&!s.buildRuntime.shieldGranted&&unit.buildRuntime.hurt===0,'battle resets both runtimes');
for(const [width,height]of [[1366,768],[1920,1080],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(80);w.render();const p=w.document.querySelector('[data-combat-unit="player"]');check(p.querySelector('.build-state.active')?.textContent.includes('背水'),'conditional glow');p.querySelector('.build-mini').click();const modal=w.document.getElementById('modal-layer');check(modal.textContent.includes('ビルド詳細')&&modal.textContent.includes('上限25%'),'detail real UI');const btn=modal.querySelector('button[onclick="closeGenericModal()"]'),rect=btn.getBoundingClientRect();check(rect.top>=0&&rect.bottom<=height,'detail close '+width);btn.click();w.openCharacterStatus('elna');check(w.document.querySelector('button[onclick="openBuildDetails(\'elna\')"]'),'status entry');w.closeGenericModal();}
const live=s.currentEnemy;s.buildRuntime.hits=3;s.hp=w.getPlayerStats().maxHp;s.screen='battle';w.buildHit(live,'attack',false,s.equipped);await wait(20);check(w.document.querySelector('.combat-float.summon'),'summon visual');check(w.eval('combatFeedback.events').some(e=>e.label.includes('SUMMON')),'summon log');
const serialized=w.localStorage.getItem(w.eval('SAVE_KEY'));w.openBuildDetails('elna');w.closeGenericModal();check(w.localStorage.getItem(w.eval('SAVE_KEY'))===serialized,'view does not save');out.push('ALL TESTS PASSED');
}catch(e){out.push('FAIL: '+e.stack)}w.Math.random=Math.random;document.getElementById('results').textContent=out.join('\n')};
</script>
