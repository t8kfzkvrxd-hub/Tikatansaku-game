<!doctype html><meta charset="utf-8"><iframe src="index.html" style="border:0;width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre>
<script>
window.onload=async()=>{
 const frame=document.querySelector('iframe'),w=frame.contentWindow,d=w.document,out=[];
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const check=(ok,label)=>{if(!ok)throw Error(label);out.push('PASS '+label)};
 try{
  await d.querySelector('.home-background').decode();await wait(100);
  const saved=w.localStorage.getItem('ABYSS_ROGUE_SAVED_V2');
  const layouts=new Map();
  for(let round=0;round<3;round++)for(const [width,height] of [[360,740],[740,360],[740,320],[740,360],[390,844],[844,390],[844,350],[844,390],[430,932],[932,430]]){
   frame.style.width=width+'px';frame.style.height=height+'px';w.dispatchEvent(new Event('orientationchange'));await wait(300);
   if(width<height)continue;
   w.document.documentElement.style.setProperty('--game-viewport-height','900px');
   if(round===1){w.showHomeScreen();await wait(300)}
   const root=d.getElementById('home-screen'),art=d.querySelector('.home-background').getBoundingClientRect();
   check(Math.abs(root.getBoundingClientRect().height-height)<1&&art.top<=0&&art.bottom>=height,'rotation/toolbar cover '+round+' '+width+'x'+height);
   const layout=[...d.querySelectorAll('.home-button,.home-sub-actions button')].map(b=>{const r=b.getBoundingClientRect();return [r.x,r.y,r.width,r.height].map(n=>Math.round(n*10)/10)});
   const key=width+'x'+height;
   if(layouts.has(key))check(JSON.stringify(layout)===layouts.get(key),'repeat identical '+round+' '+key);else layouts.set(key,JSON.stringify(layout));
  }
  for(const [width,height] of [[1920,1080],[1366,768],[844,390],[932,430],[740,360]]){
   frame.style.width=width+'px';frame.style.height=height+'px';await wait(150);
   const scene=d.querySelector('.home-scene').getBoundingClientRect(),base=d.querySelector('.home-background').getBoundingClientRect();
   check(Math.abs(scene.width-base.width)<1&&Math.abs(scene.height-base.height)<1,'art and effects aligned '+width+'x'+height);
   check(d.getElementById('home-screen').scrollWidth<=width+1,'no horizontal overflow '+width+'x'+height);
   for(const node of [d.documentElement,d.body,d.getElementById('home-screen')])check(node.scrollHeight<=height+1&&node.scrollWidth<=width+1,'no page scroll '+node.tagName+' '+width+'x'+height);
   for(const b of d.querySelectorAll('.home-button,.home-sub-actions button')){
    const r=b.getBoundingClientRect();check(r.top>=0&&r.bottom<=height&&r.left>=0&&r.right<=width,'button visible without scroll '+b.textContent.trim()+' '+width+'x'+height);
   }
   for(const extra of ['', 'セーブを読み取れません。データは削除していません。']){
    const warning=d.createElement('p');warning.className='home-warning';warning.textContent=extra;d.querySelector('.home-main-actions').after(warning);
    const r=d.querySelector('.home-version').getBoundingClientRect();check(r.bottom<=height,'version and warning fit '+width+'x'+height);warning.remove();
   }
  }
  const selectors=['.home-mist','.home-mist-second','.home-particles i','.home-blue','.home-red','.home-lantern','.home-distant-light'];
  check(!d.querySelector('.home-local-patch,.home-breath-patch,.home-character-atmosphere'),'no character animation layers');
  check(d.querySelectorAll('#home-screen img').length===2&&d.querySelector('.home-background').src===d.querySelector('.home-character-still').src,'same unchanged source for static foreground');
  const reduced=w.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduced)check(d.getElementById('home-screen').getAnimations({subtree:true}).length===0,'reduced also stops pseudo-elements');
  const samples=[];
  for(let i=0;i<=4;i++){
   samples.push(selectors.map(s=>{const c=w.getComputedStyle(d.querySelector(s));return c.transform+' '+c.opacity}));
   for(const selector of ['.home-background','.home-scene']){const c=w.getComputedStyle(d.querySelector(selector));check(c.transform==='none'&&c.animationName==='none','fixed image '+selector);}
   if(i<4)await wait(1250);
  }
  for(let i=0;i<selectors.length;i++)check(reduced?new Set(samples.map(s=>s[i])).size===1:new Set(samples.map(s=>s[i])).size>1,'5 second motion / reduced '+selectors[i]);
  check(w.getComputedStyle(d.querySelector('.home-background')).transform==='none','base image and feet remain stationary');
  check(!d.querySelector('#home-screen canvas,#home-screen video'),'no canvas or video');
  check(d.querySelectorAll('.home-particles i').length===10,'bounded particles');
  check(w.localStorage.getItem('ABYSS_ROGUE_SAVED_V2')===saved,'save untouched');
  d.body.classList.add('home-reduced');
  check(w.getComputedStyle(d.querySelector('.home-particles')).display==='none','manual reduced hides particles');
  check(d.getElementById('home-screen').getAnimations({subtree:true}).length===0,'manual reduced stops all animations');
  out.push('ALL TESTS PASSED');
 }catch(e){out.push('FAIL: '+e.stack)}
 document.getElementById('results').textContent=out.join('\n');
};
</script>
