<!doctype html><meta charset="utf-8"><iframe src="index.html#game"></iframe><pre id="results">RUNNING</pre><script>
window.onload=()=>{const w=document.querySelector('iframe').contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},total=id=>{const p=w.characterProgress(id);let n=p.exp;for(let l=1;l<p.level;l++)n+=w.characterExpRequired(l);return n;};try{
w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.owned.elna=true;s.chapter.companion='elna';for(const id of ['player','elna'])Object.assign(w.characterProgress(id),{level:1,exp:0});
for(const [kind,count]of [['normal',10],['elite',10],['boss',3]])for(let i=0;i<count;i++){s.hp=1000;w.partyMember('elna').unit.hp=1000;s.floor=kind==='boss'?(i+1)*10:11;if(kind==='boss')w.startBossBattle(w.getCurrentArea().boss);else w.startNormalBattle(kind==='elite');const e=s.currentEnemy,before=['player','elna'].map(total),expected=w.battleExperience(e);if(i%2===0)w.companionCombatUnit().hp=0;w.awardBattleExperience(e);const gains=['player','elna'].map((id,j)=>total(id)-before[j]);check(gains.every(n=>n===expected),kind+' '+i+' equal '+gains);check(w.characterProgress('player').level===w.characterProgress('elna').level,'same level');w.awardBattleExperience(e);check(total('player')===before[0]+expected,'once');}
Object.assign(w.characterProgress('player'),{level:20,exp:17});Object.assign(w.characterProgress('elna'),{level:25,exp:23});w.saveState();w.loadState();check(w.characterProgress('player').level===20&&w.characterProgress('player').exp===17&&w.characterProgress('elna').level===25&&w.characterProgress('elna').exp===23,'existing progress unchanged');s.hp=1000;w.partyMember('elna').unit.hp=1000;w.startNormalBattle();const e=s.currentEnemy;s.chapter.companion=null;const a=total('elna');w.awardBattleExperience(e);check(total('elna')-a===w.battleExperience(e),'participants fixed at start');out.push('ALL TESTS PASSED');
}catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n')};
</script>
