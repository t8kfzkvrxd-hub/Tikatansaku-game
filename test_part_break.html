<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.mode='skip';s.floor=1;s.hp=1000;
 const defs=w.eval('ENEMY_PART_DEFINITIONS');check(Object.keys(defs).length===100,'100 enemy definitions');
 for(const area of w.__gameDebug.AREAS)for(const [i,base]of [...area.enemies,area.elite,area.boss].entries()){const e={...base,maxHp:base.hp};const p=w.ensureEnemyParts(e);check(p.length===(i<3?2:3),base.name+' parts');check(new Set(p.map(x=>x.id)).size===p.length,'unique parts');}
 w.startNormalBattle(false);let e=s.currentEnemy;w.render();check(e.partTarget==='body','default body');w.selectEnemyPart(e.parts[0].id);check(e.partTarget===e.parts[0].id,'target selection');
 const plain={weapon:{weaponType:'dagger',tags:[]}},breaker={weapon:{weaponType:'greathammer',tags:['break'],effects:{breakPower:5}}};check(w.partBreakPower(100,breaker,'heavy')>w.partBreakPower(100,plain,'attack'),'weapon and break power');
 const before=e.hp,part=e.parts[0];w.equipmentAttackStats({atk:100,crit:0,maxHp:100},e,'attack');e.hp-=5;w.equipmentHit(e,'attack');check(e.hp<before&&part.hp<part.maxHp,'body and part damage');
 e.partHitStart.player=e.hp;e.hp-=100;w.hitEnemyPart(e,'heavy',s.equipped);check(part.broken&&part.hp===0,'part breaks');const rates=rate=>w.materialDropPlan({source:'enemy',parts:[{tier:0,rate}]}).after[0];check(rates(.22)>rates(.08)&&rates(.22)<1,'part contribution merged, not guaranteed');
 s.floor=10;w.startBossBattle(w.__gameDebug.AREAS[0].boss);e=s.currentEnemy;w.render();const arm=e.parts.find(p=>p.id==='arm'),atk=e.atk;e.partTarget='arm';s.equipped=breaker;e.partHitStart={player:e.hp};e.hp-=arm.maxHp*3;w.hitEnemyPart(e,'heavy',breaker);check(arm.broken&&e.atk<atk,'boss arm weakens ATK');w.render();check(w.document.querySelector('.enemy-parts').textContent.includes('BROKEN'),'broken UI');
 for(const [width,height]of [[1366,768],[1920,1080],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(100);w.render();for(const b of w.document.querySelectorAll('.enemy-parts button')){const r=b.getBoundingClientRect();check(r.width>=44&&r.height>=44,width+' tap size');}const panel=w.document.querySelector('.enemy-parts');check(panel.scrollWidth<=panel.clientWidth,width+' no part overflow');}
 const key=w.partMaterialKey(e,arm);s.craftProgress.materials[key]=true;s.codex.enemies[e.name]=1;check(w.materialSourceHtml(key).includes('部位寄与'),'material reverse lookup');
 s.floor=1;w.startNormalBattle(false);e=s.currentEnemy;w.render();w.document.querySelectorAll('.enemy-parts button')[1].click();const target=e.parts[0],durability=target.hp;e.hp=e.maxHp=10000;w.playerCombatAction('attack');check(target.hp<durability,'real combat action damages selected part');await wait(1000);out.push('ALL TESTS PASSED');
 }catch(err){out.push('FAIL: '+err.stack)}document.getElementById('results').textContent=out.join('\n')};
</script>
