<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.mode='skip';s.chapter.owned.elna=true;s.chapter.companion='elna';s.chapter.complete=true;s.hp=99999;
 check(w.__gameDebug.AREAS.length===20,'20 areas');s.bossFirstKills={};s.deepestFloorReached=0;check(!w.canWarpTo(101),'new save no 101 warp');s.bossFirstKills[100]=true;w.afterChapterBoss(100);check(s.floor===101&&s.screen==='door_select','100 to 101');check(w.canWarpTo(101)&&!w.canWarpTo(111),'warp only unlocked');
 const areas=w.eval('EXTENDED_AREAS');for(const area of areas){s.floor=area.min;w.generateDoorsForFloor();check(w.explorationArea().floorMin===area.min&&!w.document.getElementById('exploration-screen').hidden,area.min+' UI');await w.document.querySelector('.exploration-background').decode();
 const elite=w.scaledEnemyStats(area.elite,area,area.max,'elite'),boss=w.scaledEnemyStats(area.boss,area,area.max,'boss',{labLevel:5});for(const n of area.enemies){const normal=w.scaledEnemyStats(n,area,area.max);check(['hp','atk','def'].every(k=>normal[k]<elite[k]&&elite[k]<boss[k]),area.tag+' hierarchy');}
 w.startNormalBattle(false);check(w.dropMonsterMaterials(s.currentEnemy,()=>.5).every(k=>w.eval('MATERIALS')[k]),'normal materials');w.startNormalBattle(true);check(!!s.currentEnemy.trait,'elite special');check(w.dropMonsterMaterials(s.currentEnemy,()=>.02).some(k=>w.eval('MATERIALS')[k].rarity==='Legendary'),'elite legendary');
 for(const source of ['chest','cursed_chest','gather']){const item=w.createMaterialReward(source,area.min,null,()=>.01);check(item.type==='material'&&item.rarity==='Legendary',source+' material');check(w.materialSources(item.key).some(r=>r.area.id===area.id),'source lookup');}
 w.startExtendedResourceEvent();const before=s.inventory.length;s.currentEvent.choices[0].action();check(s.inventory.length===before+1,'gather action');
 s.floor=area.max;w.generateDoorsForFloor();check(s.screen==='battle'&&s.currentEnemy.isBoss&&!!s.currentEnemy.gimmick,'boss progression');s.currentEnemy.hp=0;s.inventory=[];w.onEnemyKilled();check(s.bossFirstKills[area.max]&&!s.chapter.pending,'boss clear no story');if(area.max<200)check(s.floor===area.max+1&&s.screen==='door_select','next floor');
 }
 let missing=0;const positions=new Set();for(let i=0;i<100;i++){s.floor=areas[i%10].min;w.generateDoorsForFloor();const n=s.currentDoors.findIndex(d=>['battle_normal','elite_battle'].includes(d.type));if(n<0)missing++;positions.add(n);}check(missing===0&&positions.size===3,'100 draws no missing combat');
 for(const [width,height]of [[1366,768],[1920,1080],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(70);for(const a of areas){s.floor=a.min;w.generateDoorsForFloor();const root=w.document.getElementById('exploration-screen');check(root.scrollWidth<=root.clientWidth&&root.scrollHeight<=root.clientHeight,width+' '+a.tag+' fits');for(const b of root.querySelectorAll('button')){const r=b.getBoundingClientRect();check(r.top>=0&&r.bottom<=height&&r.height>=44,'button visible');}}}
 s.screen='town';s.vaultGold=99999;s.camp.vaultSize=10000;s.storage=[];const recipe=w.eval('CRAFT_RECIPES.deep_11_weapon');for(const [key,n]of Object.entries(recipe.materials))for(let i=0;i<n;i++)s.storage.push({...w.eval('MATERIALS')[key],key,type:'material',id:crypto.randomUUID()});check(w.craftEquipment('deep_11_weapon'),'new materials craft');
 w.saveState();const key=w.eval('SAVE_KEY'),saved=w.localStorage.getItem(key);w.loadState();check(w.localStorage.getItem(key)===saved&&s.storage.some(i=>i.key==='deep_11_weapon'),'save preserved');w.openMemoryArchive();check(!w.document.getElementById('modal-layer').textContent.includes('undefined'),'archive without new stories');out.push('ALL TESTS PASSED');
 }catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n')};
</script>
