<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>新エルナ 静止プレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172132;color:#e5ebf2;font:14px system-ui}main{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 220px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:12px}#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse,#374556,#1b2839 70%);border-radius:8px}#character{position:absolute;transform-origin:0 0}#character img{position:absolute;pointer-events:none}aside{overflow:auto;overflow-wrap:anywhere}h1{font-size:18px}button,label{display:block;min-height:44px;padding:8px;margin:8px 0;width:100%;font-size:14px;color:inherit;background:#26374b;border:1px solid #61718a;border-radius:6px;touch-action:manipulation}#parts{font-size:12px}#stage.checker{background:repeating-conic-gradient(#aaa 0% 25%,#ddd 0% 50%) 0/20px 20px}@media(orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 230px}}
</style>
<main><section id="stage" aria-label="分離PNGによる新エルナ"><div id="character"></div></section><aside><h1>新エルナ 静止プレビュー</h1><p id="status" role="status">読込中</p><p>既存素材の合成のみ。旧全身画像・生成画像・アニメーションは使用しません。</p><button id="checker">背景を切替</button><label><input id="zoom" type="checkbox">顔・上半身を拡大</label><details><summary>使用パーツ</summary><ul id="parts"></ul></details></aside></main>
<script src="elna-official.js"></script></html>
