window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,d=w.document,s=w.__gameDebug.state,out=[],check=(ok,n)=>{if(!ok)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.owned.elna=true;s.chapter.companion='elna';s.screen='town';w.partyMember('elna');

const solo=w.emptyEquipmentSlots();solo.weapon={type:'weapon',primaryBuildTag:'lifesteal',secondaryBuildTags:['bleed','lowHp']};check(!w.completedBuildState(solo).some(b=>b.active),'weapon alone cannot complete');

check(w.evaluateSynergies(s.equipped,'leech',{unit:s,maxHp:100,hp:20,enemy}).values.leech>0,'low HP leech');check(!w.evaluateSynergies(s.chapter.equipment.elna,'leech',{unit:w.partyMember('elna').unit,maxHp:100,hp:20,enemy}).values.leech,'no player bonus on Elna');
for(const [tag,core]of Object.entries(cores)){
 const row=rows.find(([,r])=>r.type==='weapon'&&r.primaryBuildTag===tag),slots=w.emptyEquipmentSlots();slots.weapon=gear(row[0]);enemy.isBoss=tag==='boss';
 const c={unit:s,enemy,stats:{atk:100,maxHp:100},maxHp:100,hp:tag==='highHp'?100:20,action:['skillPower','skillHaste'].includes(tag)?'skill':['singleStrike','heavyAttack','break'].includes(tag)?'heavy':'attack',crit:true,guard:true,overflow:10,runtime:{hits:tag==='extraAttack'||tag==='summon'?4:tag==='speed'?2:3,hurt:tag==='unhurt'?0:1,charge:1,shield:0}};
 s.floor=tag==='abyssal'?500:80;
 check(w.evaluateSynergies(slots,core[0],c).matched.some(r=>r.origin===row[0]&&r.stat===core[2]),tag+' base rule reachable');
}
s.floor=80;
const bleedBase=rows.find(([,r])=>r.type==='weapon'&&r.primaryBuildTag==='bleed');s.chapter.equipment.elna=w.emptyEquipmentSlots();s.chapter.equipment.elna.weapon=gear(bleedBase[0],'elna-bleed');enemy.buildStatuses.bleed=10;const random=w.Math.random;w.Math.random=()=>0;w.buildHit(enemy,'attack',false,s.chapter.equipment.elna);w.Math.random=random;check(enemy.buildStatuses.bleed===10,'lower-cap ally does not erase existing stacks');
const hpBeforeLoop=enemy.hp;s.buildRuntime.synergyResolving=true;w.synergyHit(enemy,'attack',true,s.equipped,s,{atk:100,maxHp:100});check(enemy.hp===hpBeforeLoop,'reentrant additional attack blocked');s.buildRuntime.synergyResolving=false;
for(const boss of [false,true]){s.equipped=loadout(builds[0]);s.hp=1;const stats={atk:100,maxHp:100,vamp:999};enemy.isBoss=boss;enemy.turnCount=0;const rate=w.buildLifestealValues(s,stats,enemy,s.equipped);check(rate.rate<=(boss?12.5:25),'lifesteal cap');const healed=w.healFromWeaponDamage(s,stats,enemy,99999,s.equipped);check(healed<=8,'heal max HP 8%');}
const previewSlots=loadout(builds[0]);s.equipped=previewSlots;const original=JSON.stringify(s.buildRuntime);w.buildAttack({atk:100,crit:0,maxHp:100},enemy,'attack',previewSlots,20,{...s.buildRuntime});check(JSON.stringify(s.buildRuntime)===original,'stat preview no state mutation');
const snapshot=JSON.stringify(s.equipped);w.saveState();w.loadState();check(JSON.stringify(s.equipped)===snapshot,'save preserves full equipment fields');check(!JSON.stringify(s.equipped).includes('synergyLoadout'),'no derived synergy data in equipment save');

const dodgeLeg=rows.find(([,r])=>r.slot==='legs');s.equipped.legs=gear(dodgeLeg[0]);w.synergyDodge(s.equipped,s,{maxHp:100},enemy);check(s.buildRuntime.synergyNext>0,'dodge arms next attack');s.equipped.legs=null;s.equipped.weapon=null;w.buildAttack({atk:100,crit:0,maxHp:100},enemy,'attack',s.equipped,100);check(s.buildRuntime.synergyNext===0,'removed equipment cancels stored synergy');
for(const [width,height]of [[740,360],[844,390],[932,430],[1366,768],[1920,1080]]){f.style.width=width+'px';f.style.height=height+'px';await wait(100);w.openCompletedBuilds('player');check(d.querySelectorAll('.completed-build-list section').length===25,'list '+width);d.querySelector('.completed-build-list button').click();check(d.querySelectorAll('.completed-build-list section').length===1,'detail '+width);const footer=d.querySelector('.update-notes-actions').getBoundingClientRect();check(footer.top>=0&&footer.bottom<=height,'footer visible '+width);check([...d.querySelectorAll('.completed-build-list button')].every(b=>b.getBoundingClientRect().height>=44),'tap '+width);w.closeGenericModal();}
out.push('ALL TESTS PASSED');
}catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n');};</script>
