<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.mode='skip';s.chapter.owned.elna=true;s.chapter.companion='elna';s.hp=9999;
 const areas=w.eval('explorationAreas.slice(0,10)');check(areas.length===10&&areas.every(a=>a.enabled),'10 enabled areas');
 for(const area of areas){const image=new w.Image();image.src=area.backgrounds[0].src;await image.decode();check(image.naturalWidth>0,area.name+' asset');for(const floor of [area.floorMin,area.floorMax]){s.floor=floor;w.generateDoorsForFloor();check(w.explorationArea()===area,floor+' mapping');if(floor%10===0)check(s.screen==='battle'&&s.currentEnemy.isBoss&&w.document.getElementById('exploration-screen').hidden,floor+' boss priority');else check(!w.document.getElementById('exploration-screen').hidden&&w.document.querySelector('.exploration-background').getAttribute('src')===area.backgrounds[0].src,floor+' background UI');}}
 let missing=0;const positions=new Set();for(let i=0;i<100;i++){s.floor=areas[i%10].floorMin;w.generateDoorsForFloor();const index=s.currentDoors.findIndex(d=>['battle_normal','elite_battle'].includes(d.type));if(index<0)missing++;positions.add(index);}check(missing===0&&positions.size===3,'100 draws: no missing combat, all positions');
 for(const [width,height]of [[1366,768],[1920,1080],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(80);for(const area of areas){s.floor=area.floorMin;w.generateDoorsForFloor();w.eval('ExplorationScreen.visual.line=explorationArea().lines[0]');w.render();const root=w.document.getElementById('exploration-screen');check(root.scrollWidth<=root.clientWidth&&root.scrollHeight<=root.clientHeight,width+' '+area.name+' no overflow');for(const button of root.querySelectorAll('button')){const r=button.getBoundingClientRect();check(r.top>=0&&r.bottom<=height&&r.left>=0&&r.right<=width&&r.height>=44,'tap target fits');}for(const effect of root.querySelectorAll('.exploration-effects i'))check(w.getComputedStyle(effect).animationName!=='none','effect animation');}}
 for(let floor=5;floor<100;floor+=10){s.floor=floor;w.generateDoorsForFloor();check(s.screen==='safe_point',floor+' safe point preserved');}
 out.push('ALL TESTS PASSED');
 }catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n')};
</script>
