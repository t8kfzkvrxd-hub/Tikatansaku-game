<!doctype html><meta charset="utf-8"><iframe src="index.html#game" style="width:1366px;height:768px"></iframe><pre id="results">RUNNING</pre><script>
window.onload=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,s=w.__gameDebug.state,out=[],check=(v,n)=>{if(!v)throw Error(n);out.push('PASS '+n)},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 w.enterGameFromHome();w.closeGenericModal();s.chapter.pending=null;s.chapter.mode='skip';s.chapter.owned.elna=true;s.chapter.companion='elna';s.floor=1;s.hp=w.getPlayerStats().maxHp;w.generateDoorsForFloor();const elna=w.partyMember('elna');elna.unit.hp=elna.stats.maxHp;w.render();
 check(w.characterVisualState('player')==='normal'&&w.characterVisualState('elna')==='normal','both normal');
 const images=[...w.document.querySelectorAll('.character-portrait img')];await Promise.all(images.map(i=>i.decode()));check(images.length===7&&images.every(i=>i.naturalWidth===1024),'seven state assets load');
 s.hp-=5;w.render();check(w.characterVisualState('player')==='hit','HP loss hit');check(w.document.querySelector('.player .character-damage').textContent==='−5','damage number');await wait(800);check(w.characterVisualState('player')==='normal'&&w.document.querySelector('.player').dataset.visualState==='normal','hit expires without input');
 s.hp=w.getPlayerStats().maxHp*.25;w.render();check(w.characterVisualState('player')==='hit','hit overrides critical');await wait(800);check(w.characterVisualState('player')==='critical','25% critical');s.hp=w.getPlayerStats().maxHp;w.render();check(w.characterVisualState('player')==='normal','healing normal');
 elna.unit.hp=elna.stats.maxHp*.25;w.render();check(w.characterVisualState('elna')==='hit','Elna hit');await wait(800);check(w.characterVisualState('elna')==='critical','Elna critical');elna.unit.hp=0;w.render();check(w.characterVisualState('elna')==='fainted','faint wins hit');check(w.document.querySelector('.elna [role=progressbar]').getAttribute('aria-valuenow')==='0','faint zero HP');w.markCharacterVisualHit('elna',3);check(w.characterVisualState('elna')==='fainted','faint cannot become hit');
 const enemy={hp:999,def:0};for(const a of ['attack','heavy','skill']){s.lastPlayerAction=a;w.companionTurn(enemy);}check(enemy.hp===999,'fainted no attack skill followup');w.healCompanionAtRest();w.render();check(['normal','critical'].includes(w.characterVisualState('elna')),'revive resets hit');
 for(const [width,height]of [[1920,1080],[1366,768],[740,360],[844,390],[932,430]]){f.style.width=width+'px';f.style.height=height+'px';await wait(100);w.render();const root=w.document.getElementById('exploration-screen');check(root.scrollWidth<=root.clientWidth&&root.scrollHeight<=root.clientHeight,width+' no overflow');const hud=[...root.querySelectorAll('.exploration-hud')].map(e=>e.getBoundingClientRect());for(const r of hud)check(r.left>=0&&r.right<=width&&r.top>=0&&r.bottom<=height,width+' HUD fits');check(hud[0].right<hud[1].left,width+' characters separate');for(const card of root.querySelectorAll('.exploration-route')){const r=card.getBoundingClientRect();check(r.bottom<=Math.min(...hud.map(h=>h.top)),width+' cards not covered');}}
 s.floor=1;w.startNormalBattle(false);w.render();s.hp-=1;w.render();check(w.document.querySelector('[data-combat-unit=player]').dataset.visualState==='hit','shared battle visual state');
 const saveBefore=w.localStorage.getItem(w.eval('SAVE_KEY'));w.characterVisualState('elna');check(w.localStorage.getItem(w.eval('SAVE_KEY'))===saveBefore,'visual state no storage writes');
 out.push('ALL TESTS PASSED');
 }catch(e){out.push('FAIL: '+e.stack)}document.getElementById('results').textContent=out.join('\n')};
</script>
