    function recordCodex(type, obj) {
      if (!obj) return;
      if (type === 'item') {
        state.codex.items[obj.name] = { name: obj.name, icon: obj.icon, rarity: obj.rarity, desc: obj.desc || '装備品' };
      } else if (type === 'enemy') {
        state.codex.enemies[obj.name] = {
          name: obj.name, icon: obj.icon, isBoss: obj.isBoss || false,
          maxHp: obj.maxHp, atk: obj.atk, def: obj.def,
          traitName: obj.traitName, hint: obj.hint
        };
      } else if (type === 'lore') {
        state.codex.lore[obj.id] = { title: obj.title, text: obj.text };
      }
      saveState();
    }

    /* ==========================================================================
       STATS & SYNERGIES CALCULATION
       ========================================================================== */
    function getSynergyBreakdown() {
      const pieces = { blood: 0, gold: 0, curse: 0, titan: 0 };
      Object.keys(state.equipped).forEach(slot => {
        const it = state.equipped[slot];
        if (it) {
          if (it.setTag && pieces[it.setTag] !== undefined) pieces[it.setTag]++;
          if (it.isCurse) pieces.curse++;
        }
      });

      return SYNERGIES.map(syn => {
        const count = pieces[syn.setTag] || 0;
        const activeLevel = syn.reqLevels.filter(req => count >= req).length;
        const nextReq = syn.reqLevels.find(req => count < req);
        const needed = nextReq ? (nextReq - count) : 0;
        return {
          ...syn,
          count,
          activeLevel,
          isActive: activeLevel > 0,
          needed,
          nextReq
        };
      });
    }

    function getActiveSynergies() {
      return getSynergyBreakdown().filter(s => s.isActive);
    }

    function getPlayerStats() {
      let maxHp = 100 + (state.talents.hpLv * 15);
      let atk = 10 + (state.talents.atkLv * 3);
      let def = 2 + (state.talents.defLv * 2);
      let crit = 5;
      let vamp = 0;
      let rareRate = state.talents.luckLv * 6;
      let goldRate = 0;
      let perFloorDrain = 0;
      let demeritDamage = 0;

      // Equipment stats
      Object.keys(state.equipped).forEach(k => {
        const item = state.equipped[k];
        if (item) {
          if (item.baseAtk) atk += item.baseAtk;
          if (item.baseDef) def += item.baseDef;
          if (item.hp) maxHp += item.hp;
          if (item.crit) crit += item.crit;
          if (item.vamp) vamp += item.vamp;
          if (item.rareRate) rareRate += item.rareRate;
          if (item.goldRate) goldRate += item.goldRate;
          if (item.curseHpDrain) perFloorDrain += item.curseHpDrain;
          if (item.demeritDamageTaken) demeritDamage += item.demeritDamageTaken;
          if (item.affix === 'critical') crit += 8;
          if (item.affix === 'lifesteal') vamp += 3;
          if (item.affix === 'max_hp') maxHp += 25;
          if (item.affix === 'damage_reduction') demeritDamage -= 10;
          if (item.affix === 'low_hp_def' && state.hp <= maxHp * 0.4) def += 8;
        }
      });

      // Synergy effects
      const synList = getSynergyBreakdown();
      synList.forEach(s => {
        if (s.id === 'syn_curse' && s.count >= 2) {
          atk += 25; crit += 15; perFloorDrain += 2;
          if (s.count >= 3) { atk += 35; crit += 15; maxHp = Math.floor(maxHp * 0.85); }
        }
        if (s.id === 'syn_titan' && s.count >= 2) {
          def += 8; maxHp += 40;
          if (s.count >= 3) { def += 14; maxHp += 60; }
        }
        if (s.id === 'syn_gold' && s.count >= 2) {
          goldRate += 100;
          if (s.count >= 3) { goldRate += 150; }
        }
        if (s.id === 'syn_blood' && s.count >= 2) {
          vamp += 4;
          if (s.count >= 3) { vamp += 6; }
        }
      });

      // Extreme Archetype Scaling (尖ったビルドの特化効果)
      // 1. 🩸 血鬼ビルド: 低HP時に圧倒的な火力と吸収
      const bloodCount = synList.find(s => s.id === 'syn_blood')?.count || 0;
      if (bloodCount >= 1 && state.hp <= (maxHp * 0.5)) {
        atk = Math.round(atk * 1.35);
        vamp += 4;
        if (state.hp <= (maxHp * 0.25)) {
          atk = Math.round(atk * 1.35); // Compounding up to ~1.8x
          vamp += 8;
        }
      }

      // 2. 👑 強欲王ビルド: 所持ゴールドが力になる
      const goldCount = synList.find(s => s.id === 'syn_gold')?.count || 0;
      if (goldCount >= 1 && state.floor > 0) {
        const goldStacks = Math.floor(state.dungeonGold / 100);
        atk += goldStacks * 2;
        def += goldStacks;
      }

      // 3. 👁️ 呪王ビルド: 呪い装備1つごとに超攻撃補正
      let curseCount = 0;
      Object.keys(state.equipped).forEach(k => {
        if (state.equipped[k]?.isCurse) curseCount++;
      });
      if (curseCount > 0) {
        atk += curseCount * 14;
        crit += curseCount * 8;
      }

      // Berserk item check (狂戦士の指輪: HP50%以下で攻撃2倍)
      if (equippedAccessories().some(i=>i.isBerserk) && state.hp <= (maxHp * 0.5)) {
        atk *= 2;
      }
      if (state.equipped.weapon?.key === 'abyssal_devourer' || equippedAccessories().some(i=>i.key==='living_core_relic')) atk += (state.abyssGrowth || 0);
      if(state.statusEffects.weakened>0)atk=Math.round(atk*.8);

      // GREED Modifiers (リスク＆リターン)
      if (state.greedLevel > 0) {
        const mults = {
          1: { gold: 50, rare: 20 },
          2: { gold: 110, rare: 45 },
          3: { gold: 220, rare: 80 }
        };
        const gInfo = mults[state.greedLevel] || mults[3];
        goldRate += gInfo.gold;
        rareRate += gInfo.rare;
      }

      // Modifiers from events
      if (state.modifiers.chestRareBonus) rareRate += state.modifiers.chestRareBonus;
      if (state.modifiers.nextChestDebuff) rareRate -= state.modifiers.nextChestDebuff;
      if (state.modifiers.goldenStairTurns > 0) goldRate += 200;
      if (state.usedVoidCloak) maxHp = Math.max(1, Math.floor(maxHp / 2));

      const activeSyn = synList.filter(s => s.isActive);
      return { maxHp, atk, def, crit, vamp, rareRate: Math.max(0, rareRate), goldRate, perFloorDrain, demeritDamage: Math.max(-40, demeritDamage), synList, activeSyn };
    }

    function addLog(msg, type = 'normal') {
      state.logs.unshift({ msg, type, time: new Date().toLocaleTimeString() });
      if (state.logs.length > 40) state.logs.pop();
    }

    /* ==========================================================================
       START RUN & TOWN FLOW
       ========================================================================== */
    function startDungeonRun() {
      initAudio();
      playSound('click');
      const stats = getPlayerStats();
      state.floor = Math.min(state.selectedStartFloor || 1, state.maxUnlockedFloor || 30);
      state.hp = stats.maxHp;
      state.maxHp = stats.maxHp;
      state.dungeonGold = 0;
      state.logs = [];
      state.runKills = 0;
      state.greedLevel = 0;
      state.rerollUsed = false;
      state.playerExposed = false;
      state.playerAttackBuff = 1.0;
      state.skillCooldown = 0;
      state.usedSecondChance = false;
      state.usedVoidCloak = false;
      state.thunderCharges = 0;
      state.abyssGrowth = 0;
      state.statusEffects = { poison:0, bleed:0, paralysis:0, bind:0, weakened:0 };
      state.lastPlayerAction = null;
      state.pendingEnemyPulse=0;clearPlayerStatuses();
      state.effectSeal=null;state.lastDefeatedEnemy=null;
      state.guardFatigue = 0;
      state.guardStamina = 100;
      state.guardBroken = false;
      state.modifiers = { goldMult: 1.0, enemyAtkMult: 1.0, chestRareBonus: 0, nextChestDebuff: 0, goldenStairTurns: 0 };

      // Prepared items brought from town
      if (state.preparedItems && state.preparedItems.length > 0) {
        state.inventory = [...state.preparedItems];
        state.preparedItems = [];
      } else {
        state.inventory = [];
      }

      // Prepared buffs
      if (state.preparedBuffs) {
        state.modifiers.chestRareBonus += (state.preparedBuffs.chestRareBonus || 0);
        state.modifiers.goldMult *= (state.preparedBuffs.goldMult || 1.0);
        state.preparedBuffs = { chestRareBonus: 0, goldMult: 1.0 };
      }

      // Expedition policy application
      const policy = state.expeditionPolicy || 'normal';
      if (policy === 'mining') {
        state.modifiers.goldMult *= 1.4;
        state.modifiers.dropPenalty = 0.15;
        addLog('⛏️ 採掘方針発動: 獲得ゴールド+40%！(アイテム出現率微減)', 'gold');
      } else if (policy === 'bounty') {
        state.modifiers.eliteRateBonus = 0.35;
        state.modifiers.bountyBonus = 1.5;
        addLog('⚔️ 討伐方針発動: エリート魔物出現率+35% / 討伐依頼報酬+50%！', 'danger');
      } else if (policy === 'excavate') {
        state.modifiers.eventRateBonus = 0.45;
        state.modifiers.chestRareBonus += 15;
        addLog('📜 発掘方針発動: 祭壇・謎イベント率+45% / 宝箱レア率+15%！', 'gold');
      } else {
        addLog('🧭 通常方針: 均整の取れた探索を開始します。', 'normal');
      }

      // Check Nameless Portrait for Second Chance
      const hasPortrait = state.storage.some(i => i.key === 'nameless_portrait') || Object.values(state.equipped).some(i => i?.key === 'nameless_portrait');
      state.mystery.hasSecondChance = hasPortrait;

      // Leon's soup requires both the upgraded tavern and an actual rescue.
      if (state.camp.tavern >= 3 && state.camp.rescuedAdventurer === true) {
        state.hp += 20;
        state.maxHp += 20;
        addLog('🧝 救助した冒険者レオンの特製スープを飲み干した！ 最大HP+20', 'heal');
      }

      // Starter Perk if chosen
      if (state.starterPerk === 'potion') {
        state.inventory.push({ id: 'pot_sp', name: '特製薬酒', icon: '🧪', type: 'potion', heal: 60, rarity: 'Rare', desc: 'HP60回復' });
      } else if (state.starterPerk === 'smoke') {
        state.inventory.push({ id: 'smoke_sp', name: '忍びの煙玉', icon: '💨', type: 'escape_item', rarity: 'Rare', desc: '戦闘から1回即離脱' });
      } else if (state.starterPerk === 'luck') {
        state.modifiers.chestRareBonus += 25;
      }

      state.starterPerk = null;

      saveState();
      addLog('深淵の地下迷宮へと足を踏み入れた。生還は5階ごとの転移門のみ！', 'gold');
      generateDoorsForFloor();
    }

    function returnToTown(safeReturn = true) {
      if (safeReturn) {
        const freeSlots = state.camp.vaultSize - state.storage.length;
        if (state.inventory.length > freeSlots && freeSlots >= 0) {
          // Warehouse overflow! Prevent item loss by letting player manage items
          openWarehouseOverflowModal(freeSlots);
          return;
        }

        finalizeSafeReturn();
      } else {
        // Death occurred
        if (state.talents.keepItemLv > 0 && state.inventory.length > 0) {
          openDeathProtectModal();
          return;
        }

        finalizeDeath();
      }
    }

    function finalizeSafeReturn() {
      playSound('escape');
      state.vaultGold += state.dungeonGold;
      
      // Move inventory into storage
      const savedItems = [...state.inventory];
      state.inventory.forEach(item => {
        if (state.storage.length < state.camp.vaultSize) {
          state.storage.push(item);
        }
      });
      state.inventory = [];

      // Check Black Egg Incubation (深淵の黒卵の孵化進捗)
      let eggHatched = false;
      state.storage.forEach(item => {
        if (item && item.key === 'black_egg') {
          item.progress = (item.progress || 0) + 1;
          state.mystery.eggReturns = Math.max(state.mystery.eggReturns || 0, item.progress);
          item.desc = `生還3回で孵化する謎の卵 (進捗: ${item.progress}/3)`;
          if (item.progress >= 3 && !eggHatched) {
            eggHatched = true;
            state.mystery.eggHatched = true;
            item.key = 'dragon_hatchling';
            item.name = '🐉 深淵の幼竜';
            item.icon = '🐉';
            item.rarity = 'Legendary';
            item.type = 'relic';
            item.desc = '【孵化した幼竜】毎ターンHP+3自動回復 ＆ 攻撃時火炎追撃(+8ダメージ)';
            playSound('legendary');
            spawnFloatingFx('🐉 黒卵が孵化した！', 'crit');
            addLog('🥚 深淵の黒卵に亀裂が走り、【深淵の幼竜】が誕生した！', 'gold');
          }
        }
      });
      if (eggHatched) state.mystery.eggReturns = Math.max(3, state.mystery.eggReturns || 0);

      // Update Tavern Quests
      state.camp.questKills = (state.camp.questKills || 0) + (state.runKills || 0);

      showResultModal({
        title: '🏰 地上への安全帰還 達成！',
        subtitle: `地下 ${state.floor} 階の転移門から無事生還しました。全ての戦利品を安全に保管しました。`,
        gold: state.dungeonGold,
        cores: state.dungeonGold >= 200 ? 1 : 0,
        items: savedItems,
        isDeath: false
      });

      state.greedLevel = 0;
      saveState();
      state.screen = 'town';
      state.floor = 0;
      if(state.chapter?.pending?.kind==='return'){state.chapter.pending=null;state.chapter.checkpoint=null;saveState();}
      updateHeader();
      render();
    }

    function finalizeDeath(customKeptItems = null, customLostItems = null) {
      playSound('gameover');
      let keptItems = customKeptItems;
      let lostItems = customLostItems;

      if (!keptItems) {
        const retainCount = state.talents.keepItemLv || 0;
        keptItems = state.inventory.slice(0, retainCount);
        lostItems = state.inventory.slice(retainCount);
      }

      keptItems.forEach(i => {
        if (state.storage.length < state.camp.vaultSize) state.storage.push(i);
      });
      state.inventory = [];

      // Lost 80% gold
      const keptGold = Math.floor(state.dungeonGold * 0.2);
      const lostGold = state.dungeonGold - keptGold;
      state.vaultGold += keptGold;

      showResultModal({
        title: '💀 探索失敗... 深淵で力尽きた',
        subtitle: `地下 ${state.floor} 階の闇に呑まれた。未保管の戦利品と大部分のゴールドを失った。`,
        lostItems: lostItems,
        keptItems: keptItems,
        lostGold: lostGold,
        keptGold: keptGold,
        items: keptItems,
        isDeath: true
      });

      state.greedLevel = 0;
      saveState();
      state.screen = 'town';
      state.floor = 0;
      updateHeader();
      render();
    }

    function openWarehouseOverflowModal(freeSlots) {
      const m = document.getElementById('modal-layer');
      m.style.display = 'flex';
      m.className = 'legendary-modal';

      renderWarehouseOverflowContent();
    }

    function renderWarehouseOverflowContent() {
      const m = document.getElementById('modal-layer');
      const freeSlots = state.camp.vaultSize - state.storage.length;
      const upgradeCost = getVaultUpgradeCost(state.camp.vaultLevel);
      const canUpgrade = state.vaultGold >= upgradeCost;

      const itemsHtml = state.inventory.map((it, idx) => `
        <div class="item-row r-${it.rarity}" style="margin-bottom:4px;">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:16px;">${it.icon}</span>
            <div>
              <div class="item-name">${it.name} <span style="font-size:10px;">[${it.rarity}]</span></div>
              <div class="item-stats">${getItemStatSummary(it)}</div>
            </div>
          </div>
          <button class="btn btn-gold btn-xs" ${it.locked ? 'disabled' : ''} onclick="sellOverflowItem(${idx})">
            ${it.locked ? '🔒 保護中' : `💰 売却 (+${getItemSellPrice(it)}G)`}
          </button>
        </div>
      `).join('');

      m.innerHTML = `
        <div class="card" style="max-width:460px; width:100%; border:2px solid #f59e0b; text-align:center; padding:18px; max-height:85vh; overflow-y:auto;">
          <div style="font-size:32px; margin-bottom:4px;">⚠️📦</div>
          <h2 style="font-size:18px; font-weight:900; color:#fff;">倉庫の保管枠が不足しています！</h2>
          <p style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">
            持ち帰った戦利品 <b style="color:#fbbf24;">${state.inventory.length}個</b> に対し、現在の倉庫空き枠は <b style="color:${freeSlots <= 0 ? '#ef4444' : '#4ade80'};">${freeSlots}枠</b> です。<br>
            不要なアイテムを売却するか、倉庫を拡張してすべてのアイテムを安全に収めてください。
          </p>

          <div style="background:rgba(0,0,0,0.4); padding:10px; border-radius:6px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
            <div style="text-align:left;">
              <div style="font-size:12px; font-weight:bold; color:#fff;">倉庫拡張 (Lv.${state.camp.vaultLevel} → ${state.camp.vaultLevel + 1})</div>
              <div style="font-size:11px; color:#94a3b8;">容量 +10枠 (現在: ${state.camp.vaultSize}枠)</div>
            </div>
            <button class="btn ${canUpgrade ? 'btn-gold' : 'btn-sub'} btn-xs" ${canUpgrade ? '' : 'disabled'} onclick="upgradeVaultInOverflow()">
              🔨 即座に拡張 (${upgradeCost}G)
            </button>
          </div>

          <div style="text-align:left; font-size:12px; font-weight:bold; color:var(--gold); margin-bottom:6px;">
            戦利品一覧 (売却して空き枠を確保):
          </div>
          <div style="max-height:180px; overflow-y:auto; margin-bottom:12px;">
            ${itemsHtml}
          </div>

          <details style="text-align:left;margin-bottom:10px;">
            <summary style="font-size:11px;color:#7dd3fc;cursor:pointer;">📦 倉庫の既存品を整理・売却</summary>
            <div style="max-height:140px;overflow:auto;margin-top:5px;">${state.storage.map((it, idx) => `<div class="item-row r-${it.rarity}" style="margin-bottom:3px;"><span>${it.icon} ${it.name}</span><button class="btn btn-sub btn-xs" ${it.locked ? 'disabled' : ''} onclick="sellOverflowStorageItem(${idx})">売却 +${getItemSellPrice(it)}G</button></div>`).join('') || '<div style="color:#64748b;">倉庫は空です</div>'}</div>
          </details>

          <div style="display:flex; gap:8px;">
            <button class="btn btn-sub" style="flex:1;" onclick="bulkSellInventoryOverflow()">
              💰 Common品を全売却
            </button>
            <button class="btn btn-gold" style="flex:1;" ${state.inventory.length <= freeSlots ? '' : 'disabled'} onclick="confirmWarehouseStorage()">
              ${state.inventory.length <= freeSlots ? '✔ 倉庫へ収めて帰還' : `あと${state.inventory.length - freeSlots}個整理が必要`}
            </button>
          </div>
        </div>
      `;
    }

    function sellOverflowItem(idx) {
      initAudio();
      const item = state.inventory[idx];
      if (!canSellStoredItem(item)) return;
      if (['Legendary','Mythic','Abyssal'].includes(item.rarity) && !window.confirm(`【${item.name}】を売却しますか？ この操作は取り消せません。`)) return;
      const price = getItemSellPrice(item);
      state.dungeonGold += price;
      state.inventory.splice(idx, 1);
      playSound('gold');
      spawnFloatingFx(`+${price}G`, 'gold');
      renderWarehouseOverflowContent();
    }

    function sellOverflowStorageItem(idx) {
      const item = state.storage[idx];
      if (!canSellStoredItem(item)) return;
      if (['Legendary','Mythic','Abyssal'].includes(item.rarity) && !window.confirm(`【${item.name}】を売却しますか？ この操作は取り消せません。`)) return;
      const price = getItemSellPrice(item);
      state.storage.splice(idx, 1);
      state.vaultGold += price;
      playSound('gold');
      saveState();
      renderWarehouseOverflowContent();
    }

    function bulkSellInventoryOverflow() {
      initAudio();
      let earned = 0;
      for (let i = state.inventory.length - 1; i >= 0; i--) {
        if (state.inventory[i].rarity === 'Common' && canSellStoredItem(state.inventory[i])) {
          earned += getItemSellPrice(state.inventory[i]);
          state.inventory.splice(i, 1);
        }
      }
      state.dungeonGold += earned;
      playSound('gold');
      spawnFloatingFx(`💰 +${earned}G`, 'gold');
      renderWarehouseOverflowContent();
    }

    function upgradeVaultInOverflow() {
      initAudio();
      const cost = getVaultUpgradeCost(state.camp.vaultLevel);
      if (state.vaultGold < cost) return;
      state.vaultGold -= cost;
      state.camp.vaultLevel = (state.camp.vaultLevel || 1) + 1;
      state.camp.vaultSize = 20 + (state.camp.vaultLevel - 1) * 10;
      playSound('heal');
      saveState();
      renderWarehouseOverflowContent();
    }

    function confirmWarehouseStorage() {
      initAudio();
      playSound('click');
      document.getElementById('modal-layer').style.display = 'none';
      finalizeSafeReturn();
    }

    function openDeathProtectModal() {
      const m = document.getElementById('modal-layer');
      m.style.display = 'flex';
      m.className = 'legendary-modal';

      const keepCount = state.talents.keepItemLv;
      // Pre-select top items by rarity
      const sortedIndexes = state.inventory.map((it, idx) => ({ it, idx })).sort((a, b) => {
        const rRank = { Abyssal: 6, Mythic: 5, Legendary: 4, Epic: 3, Rare: 2, Common: 1 };
        return (rRank[b.it.rarity] || 0) - (rRank[a.it.rarity] || 0);
      });

      const selectedSet = new Set(sortedIndexes.slice(0, keepCount).map(o => o.idx));

      renderDeathProtectContent(selectedSet, keepCount);
    }

    function renderDeathProtectContent(selectedSet, keepCount) {
      const m = document.getElementById('modal-layer');
      const itemsHtml = state.inventory.map((it, idx) => {
        const isSelected = selectedSet.has(idx);
        return `
          <div class="item-row r-${it.rarity}" style="margin-bottom:4px; cursor:pointer; border:${isSelected ? '2px solid #4ade80' : '1px solid rgba(255,255,255,0.1)'};" onclick="toggleDeathProtectItem(${idx}, ${keepCount})">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:18px;">${isSelected ? '🛡️' : '⚪'}</span>
              <span style="font-size:16px;">${it.icon}</span>
              <div>
                <div class="item-name">${it.name} <span style="font-size:10px;">[${it.rarity}]</span></div>
                <div class="item-stats">${getItemStatSummary(it)}</div>
              </div>
            </div>
            <span style="font-size:11px; font-weight:bold; color:${isSelected ? '#4ade80' : '#94a3b8'};">
              ${isSelected ? '保護する' : '喪失'}
            </span>
          </div>
        `;
      }).join('');

      m.innerHTML = `
        <div class="card" style="max-width:440px; width:100%; border:2px solid #38bdf8; text-align:center; padding:18px; max-height:85vh; overflow-y:auto;">
          <div style="font-size:32px; margin-bottom:4px;">🛡️✨</div>
          <h2 style="font-size:18px; font-weight:900; color:#fff;">【遺品守護符】の発動</h2>
          <p style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">
            神殿の加護により、未保管の戦利品から最大 <b style="color:#38bdf8;">${keepCount}個</b> を選択して地上へ持ち帰ることができます。<br>
            （現在選択中: <b style="color:#4ade80;">${selectedSet.size} / ${keepCount}個</b>）
          </p>

          <div style="max-height:220px; overflow-y:auto; margin-bottom:14px; text-align:left;">
            ${itemsHtml}
          </div>

          <button class="btn btn-gold" onclick="confirmDeathProtection()">
            選んだ遺品を抱えて地上へ戻る
          </button>
        </div>
      `;

      window._deathProtectSelected = selectedSet;
      window._deathProtectKeepCount = keepCount;
    }

    window.toggleDeathProtectItem = function(idx, keepCount) {
      initAudio();
      playSound('click');
      const set = window._deathProtectSelected;
      if (set.has(idx)) {
        set.delete(idx);
      } else {
        if (set.size < keepCount) {
          set.add(idx);
        } else {
          addLog(`保護できるアイテムは最大${keepCount}個までです！`, 'info');
        }
      }
      renderDeathProtectContent(set, keepCount);
    };

    window.confirmDeathProtection = function() {
      initAudio();
      playSound('click');
      document.getElementById('modal-layer').style.display = 'none';

      const set = window._deathProtectSelected || new Set();
      const kept = [];
      const lost = [];
      state.inventory.forEach((it, idx) => {
        if (set.has(idx)) kept.push(it);
        else lost.push(it);
      });

      finalizeDeath(kept, lost);
    };

    function emergencyEscape() {
      initAudio();
      playSound('escape');
      const keepCount = Math.ceil(state.inventory.length / 2);
      state.pendingEmergencySelection = [];
      renderEmergencySelection(keepCount);
    }

    function renderEmergencySelection(keepCount) {
      const selected = new Set(state.pendingEmergencySelection || []);
      const m = document.getElementById('modal-layer');
      m.style.display = 'flex';
      m.className = 'legendary-modal';
      m.innerHTML = `
        <div class="card" style="max-width:460px;width:100%;border:2px solid #a855f7;padding:18px;max-height:88vh;overflow:auto;">
          <h2 style="font-size:18px;color:#fff;text-align:center;">🌀 緊急帰還：戦利品を選択</h2>
          <p style="font-size:12px;color:#cbd5e1;text-align:center;">持ち帰れるのは半分です。最大 <b>${keepCount}個</b> を選んでください（${selected.size}/${keepCount}）。</p>
          <div style="display:flex;flex-direction:column;gap:5px;margin:12px 0;">
            ${state.inventory.map((it, idx) => `<button class="btn ${selected.has(idx) ? 'btn-gold' : 'btn-sub'}" style="justify-content:flex-start;text-align:left;" onclick="toggleEmergencyLoot(${idx},${keepCount})">${selected.has(idx) ? '✔' : '○'} ${it.icon} ${it.name} [${it.rarity}]</button>`).join('') || '<div style="text-align:center;color:#94a3b8;">戦利品なし</div>'}
          </div>
          <button class="btn btn-purple" style="width:100%;" ${selected.size === keepCount ? '' : 'disabled'} onclick="confirmEmergencyEscape(${keepCount})">${selected.size === keepCount ? '選択した戦利品で帰還する' : `あと${keepCount - selected.size}個選択`}</button>
        </div>`;
    }

    function toggleEmergencyLoot(idx, keepCount) {
      const selected = new Set(state.pendingEmergencySelection || []);
      if (selected.has(idx)) selected.delete(idx);
      else if (selected.size < keepCount) selected.add(idx);
      state.pendingEmergencySelection = [...selected];
      renderEmergencySelection(keepCount);
    }

    function confirmEmergencyEscape(keepCount) {
      const selected = new Set(state.pendingEmergencySelection || []);
      const keptItems = state.inventory.filter((_, idx) => selected.has(idx));
      const lostItems = state.inventory.filter((_, idx) => !selected.has(idx));

      if (keptItems.length > state.camp.vaultSize - state.storage.length) {
        addLog('⚠️ 倉庫容量不足です。地上倉庫を整理してから帰還してください。', 'danger');
        document.getElementById('modal-layer').style.display = 'none';
        state.inventory = keptItems;
        openWarehouseOverflowModal(state.camp.vaultSize - state.storage.length);
        return;
      }

      keptItems.forEach(i => {
        state.storage.push(i);
      });

      const keptGold = Math.floor(state.dungeonGold * 0.6);
      state.vaultGold += keptGold;

      showResultModal({
        title: '🌀 緊急脱出ポータルで強行生還！',
        subtitle: `不安定な歪みを通って帰還した！戦利品の半分とゴールドの一部を代償として失った。`,
        lostItems: lostItems,
        keptItems: keptItems,
        lostGold: state.dungeonGold - keptGold,
        keptGold: keptGold,
        isDeath: false
      });

      state.greedLevel = 0;
      state.inventory = [];
      state.pendingEmergencySelection = [];
      saveState();
      state.screen = 'town';
      state.floor = 0;
      updateHeader();
      render();
    }

    /* ==========================================================================
       ROOM GENERATION (毎階の2〜3個の選択肢)
       ========================================================================== */
    function getCurrentArea() {
      return AREAS.find(area => state.floor >= area.min && state.floor <= area.max) || AREAS[AREAS.length - 1];
    }

    function generateDoorsForFloor() {
      state.floor=Math.min(MAX_DUNGEON_FLOOR,state.floor);
      const bossFloor = isBossFloor(state.floor);
      const isSafePortalFloor = isSafeReturnFloor(state.floor);
      state.deepestFloorReached = Math.max(state.deepestFloorReached || 0, state.floor);
      state.runRecords.highestGreed = Math.max(state.runRecords.highestGreed || 0, state.greedLevel || 0);
      saveState();

      // Turn effects check (Curse damage)
      const stats = getPlayerStats();
      if (stats.perFloorDrain > 0) {
        state.hp -= stats.perFloorDrain;
        addLog(`呪いの装備が体力を蝕む... HP -${stats.perFloorDrain}`, 'danger');
        if (state.hp <= 0) {
          state.hp = 0;
          returnToTown(false);
          return;
        }
      }

      if (state.modifiers.goldenStairTurns > 0) {
        state.modifiers.goldenStairTurns--;
      }

      // Check Boss Encounter
      if (bossFloor) {
        state.screen = 'battle';
        startBossBattle(getCurrentArea().boss);
        return;
      }

      // If safe portal floor (5, 15, 25)
      if (isSafePortalFloor) {
        state.screen = 'safe_point';
        playSound('safe_point');
        addLog(`【安全帰還門 到達】地下${state.floor}階で安全転移門を発見！`, 'gold');
        updateHeader();
        render();
        return;
      }

      // Normal floors: Generate 2 to 3 distinct room options
      const doorPool = [
        {
          type: 'battle_normal',
          icon: '⚔️',
          sign: '敵の気配',
          desc: '通常の魔物が徘徊している。討伐でゴールドと装備獲得。',
          risk: 'mid', riskText: '中危険'
        },
        {
          type: 'chest_normal',
          icon: '🎁',
          sign: '金色の光',
          desc: '施錠されていない宝箱の気配。レア装備やゴールドの期待。',
          risk: 'low', riskText: '低危険'
        },
        {
          type: 'blood_altar',
          icon: '🩸',
          sign: '血の跡と邪神像',
          desc: '【血の祭壇】HP30を捧げ、強力な永続バフや攻撃力を獲得。',
          risk: 'curse', riskText: '代償大'
        },
        {
          type: 'cursed_chest',
          icon: '👁️',
          sign: '呪われた黒櫃',
          desc: '【呪い宝箱】Epic以上の強力装備確定。代わりに最大HP減少。',
          risk: 'curse', riskText: 'ハイリスク'
        },
        {
          type: 'heal_spring',
          icon: '💧',
          sign: '聖なる滴りの音',
          desc: '澄んだ泉。HPを大幅に回復するか、神秘の力を得る。',
          risk: 'safe', riskText: '安全回復'
        },
        {
          type: 'merchant',
          icon: '🛒',
          sign: '怪しい商人',
          desc: '探索中に拾ったゴールドで回復薬や限定装備を売買できる。',
          risk: 'low', riskText: '取引'
        },
        {
          type: 'golden_stairs',
          icon: '✨',
          sign: '黄金の階段',
          desc: '【欲深き契約】次の敵が大幅強化される代わりに獲得ゴールド3倍。',
          risk: 'high', riskText: '超リターン'
        },
        {
          type: 'elite_battle',
          icon: '💀',
          sign: '重い唸り声 (エリート)',
          desc: '凶悪な強敵が潜む。勝てばレアアイテム確定＆大量ゴールド。',
          risk: 'high', riskText: '超危険'
        },
        {
          type: 'mystery_wanderer',
          icon: '🧙‍♂️',
          sign: '謎の遭遇',
          desc: '傷ついた冒険者や不気味な黒卵など、予期せぬ出来事。',
          risk: 'mid', riskText: '謎'
        }
      ];
      if (state.floor >= 31) {
        const deepSigns = {
          4:['🍄 喋る菌糸','菌糸ネットワークが取引か警告を持ちかける。'],
          5:['🫧 空気の残る部屋','沈没都市に残された空気室と宝物庫。'],
          6:['🫀 脈打つ祭壇','肉壁があなた自身の声で選択を迫る。']
        };
        const deep = deepSigns[getCurrentArea().id] || ['📖 記憶の残響',getCurrentArea().rule];
        doorPool.push({type:'deep_area_event',icon:deep[0].slice(0,2),sign:deep[0],desc:deep[1],risk:'mid',riskText:'深層固有'});
      }

      // Research forecasts and GREED alter actual room composition.
      if (state.camp.lab >= 4) {
        doorPool.forEach(room => {
          room.desc += ` 【研究予測: ${room.riskText}】`;
        });
      }
      if (state.greedLevel >= 2 || (state.modifiers.eliteRateBonus || 0) > 0) {
        doorPool.push({ ...doorPool.find(d => d.type === 'elite_battle') });
      }
      if ((state.modifiers.eventRateBonus || 0) > 0) {
        doorPool.push({ ...doorPool.find(d => d.type === 'mystery_wanderer') });
        doorPool.push({ ...doorPool.find(d => d.type === 'blood_altar') });
      }
      if (state.greedLevel >= 3) {
        const healIndex = doorPool.findIndex(d => d.type === 'heal_spring');
        if (healIndex >= 0) doorPool.splice(healIndex, 1);
        doorPool.push({ ...doorPool.find(d => d.type === 'blood_altar') });
        doorPool.push({ ...doorPool.find(d => d.type === 'cursed_chest') });
      }

      const ownsAncientKey = state.mystery.keyOwned || state.inventory.some(i => i.key === 'ancient_key');
      if (ownsAncientKey && state.floor >= 11 && state.floor <= 20) {
        doorPool.push({
          type: 'sealed_vault', icon: '🔐', sign: '古代の封印宝物庫',
          desc: '錆びた古代鍵が反応している。鍵を使えば秘宝を回収できる。',
          risk: 'safe', riskText: '鍵で解放'
        });
      }

      // Emergency Portal Generation
      // Emerges at low chance, but jumps to 22% when HP < 25% or carrying Epic/Legendary item
      const isHpCritical = (state.hp / stats.maxHp) <= 0.25;
      const hasEpicOrLeg = state.inventory.some(i => ['Epic', 'Legendary'].includes(i.rarity));
      const emergencyChance = (isHpCritical || hasEpicOrLeg) ? 0.22 : 0.04;

      if (Math.random() < emergencyChance && state.floor > 2) {
        doorPool.push({
          type: 'emergency_portal',
          icon: '🌀',
          sign: '不安定な緊急ポータル',
          desc: '【即時生還】今すぐ生還可能だが、戦利品の半分を失う。(HP危機または高レア保持時に感知出現)',
          risk: 'safe', riskText: '半分ロスト脱出'
        });
      }

      // Pick 3 random distinct doors
      const shuffled = doorPool.sort(() => 0.5 - Math.random());
      const hasObserver = equippedAccessories().some(i=>i.key === 'abyssal_observer');
      state.currentDoors = shuffled.slice(0, hasObserver ? 4 : 3);
      if(state.chapter?.contract&&!state.chapter.read[10]&&state.chapter.mode!=='skip'&&TUTORIAL_STEPS[state.floor]){
        const training=doorPool.find(d=>d.type===TUTORIAL_STEPS[state.floor][2]);
        if(training)state.currentDoors=[{...training,sign:'🌻 '+training.sign}];
      }
      if (hasObserver && state.currentDoors[3]) {
        state.currentDoors[3].sign = `👁️ 隠された道：${state.currentDoors[3].sign}`;
        state.currentDoors[3].desc += ' 【観測済み：表示どおりの危険度と報酬】';
      }

      state.screen = 'door_select';
      updateHeader();
      render();
    }

    function rerollDoors() {
      if (state.rerollUsed || (state.talents.fateRerollLv || 0) <= 0) return;
      initAudio();
      playSound('reroll');
      state.rerollUsed = true;
      spawnFloatingFx('🎲 運命の導き！再抽選', 'crit');
      addLog('神殿の加護【運命の導き】により、部屋の分岐を再抽選した！', 'gold');
      generateDoorsForFloor();
    }

    function selectDoor(index) {
      initAudio();
      playSound('click');
      const door = state.currentDoors[index];
      if (!door) return;

      // Advance lore check (低確率で地下の謎を拾う)
      if (Math.random() < 0.22) {
        discoverLore();
      }

      if (door.type === 'portal_safe') {
        returnToTown(true);
      } else if (door.type === 'emergency_portal') {
        emergencyEscape();
      } else if (door.type === 'door_deeper') {
        addLog('帰還門を背にして、更なる闇へと踏み込んだ！', 'danger');
        state.modifiers.chestRareBonus = (state.modifiers.chestRareBonus || 0) + 15;
        state.floor++;
        generateDoorsForFloor();
      } else if (door.type === 'battle_normal') {
        startNormalBattle(false);
      } else if (door.type === 'elite_battle') {
        startNormalBattle(true);
      } else if (door.type === 'chest_normal') {
        openChestEvent(false);
      } else if (door.type === 'cursed_chest') {
        openChestEvent(true);
      } else if (door.type === 'blood_altar') {
        startBloodAltarEvent();
      } else if (door.type === 'heal_spring') {
        startHealSpringEvent();
      } else if (door.type === 'merchant') {
        startMerchantEvent();
      } else if (door.type === 'golden_stairs') {
        startGoldenStairsEvent();
      } else if (door.type === 'mystery_wanderer') {
        startMysteryEvent();
      } else if (door.type === 'sealed_vault') {
        openSealedVault();
      } else if (door.type === 'deep_area_event') {
        startDeepAreaEvent();
      }
    }

    function discoverLore() {
      const unread = LORE_RECORDS.filter(l => !state.codex.lore[l.id]);
      if (unread.length > 0) {
        const picked = unread[Math.floor(Math.random() * unread.length)];
        recordCodex('lore', picked);
        addLog(`📜 古代の記録【${picked.title}】を発見した！（図鑑に登録）`, 'gold');
      }
    }

    /* ==========================================================================
       BATTLE ENGINE & INTENT SYSTEM (戦闘行動予測・深化した戦術)
       ========================================================================== */
    function startNormalBattle(isElite = false) {
      const area = getCurrentArea();
      let enemyTemplate = isElite ? area.elite : area.enemies[Math.floor(Math.random() * area.enemies.length)];
      
      const scale = isElite || state.floor>=61 ? 1 + (state.floor - area.min) * 0.015 : 1 + (state.floor * 0.08);
      const eliteScale = 1.0;
      const greedAtkMult = [1, 1.10, 1.25, 1.45][Math.min(3, state.greedLevel || 0)];
      state.currentEnemy = {
        name: enemyTemplate.name,
        icon: enemyTemplate.icon,
        maxHp: Math.round(enemyTemplate.hp * scale * eliteScale),
        hp: Math.round(enemyTemplate.hp * scale * eliteScale),
        atk: Math.round(enemyTemplate.atk * scale * (state.modifiers.enemyAtkMult || 1.0) * greedAtkMult * (isElite ? 0.8 : 1.0)),
        def: Math.round(enemyTemplate.def * scale),
        isBoss: false,
        isElite: isElite,
        trait: enemyTemplate.trait,
        materialSource: enemyTemplate.materialSource,
        traitName: enemyTemplate.traitName,
        hint: enemyTemplate.hint,
        turnCount: 0
        ,obscured: area.id===9&&Math.random()<.3
      };

      recordCodex('enemy', state.currentEnemy);
      state.screen = 'battle';
      applyEnemyPulse(state.currentEnemy);
      if(state.chapter?.contract&&!state.chapter.read[10]&&state.floor===7&&state.chapter.mode!=='skip'){state.statusEffects.poison=2;addLog('🌻 エルナ：毒を受けたらバッグの万能解毒薬を使おう。','info');}
      state.playerExposed = false;
      state.playerAttackBuff = 1.0;
      state.guardFatigue = 0; state.guardStamina = 100; state.guardBroken = false;
      decideEnemyIntent();
      addLog(`${state.currentEnemy.name} が立ちはだかった！`, isElite ? 'danger' : 'normal');
      updateHeader();
      render();
    }

    function startBossBattle(bossTemplate) {
      playSound('hit');
      const labHpMult = state.camp.lab >= 3 ? 0.85 : 1;
      const greedAtkMult = [1, 1.10, 1.25, 1.45][Math.min(3, state.greedLevel || 0)];
      state.currentEnemy = {
        name: bossTemplate.name,
        icon: bossTemplate.icon,
        maxHp: Math.round(bossTemplate.hp * labHpMult),
        hp: Math.round(bossTemplate.hp * labHpMult),
        atk: Math.round(bossTemplate.atk * greedAtkMult),
        def: bossTemplate.def,
        isBoss: true,
        gimmick: bossTemplate.gimmick
        ,materialSource: bossTemplate.materialSource
      };
      state.bossTurnCount = 0;
      state.bossBarrier = ['shield_barrier','mother_tree'].includes(bossTemplate.gimmick);
      state.bossMutated = false;
      state.bossAdds = bossTemplate.gimmick === 'mother_tree' ? 2 : 0;
      state.waterLevel = 0;
      applyEnemyPulse(state.currentEnemy);
      state.playerExposed = false;
      state.playerAttackBuff = 1.0;
      state.guardFatigue = 0; state.guardStamina = 100; state.guardBroken = false;

      recordCodex('enemy', state.currentEnemy);
      state.screen = 'battle';
      decideEnemyIntent();
      addLog(`階層の守護ボス【${state.currentEnemy.name}】が降臨した！`, 'danger');
      updateHeader();
      render();
    }

    function decideEnemyIntent() {
      if (!state.currentEnemy) return;
      const e = state.currentEnemy;
      const stats = getPlayerStats();

      if (e.isBoss) {
        state.bossTurnCount++;
        if (e.gimmick === 'heavy_charge') {
          // 10F 坑道の巨人: 3ターンごとに「地響き大粉砕」
          if (state.bossTurnCount % 3 === 0) {
            e.actionType = 'critical_smash';
            e.pendingAction = '⚠️【地響き大粉砕】溜め強撃！(防御推奨)';
            e.nextMult = 2.4;
          } else {
            e.actionType = 'normal';
            e.pendingAction = '通常打撃の構え';
            e.nextMult = 1.0;
          }
        } else if (e.gimmick === 'shield_barrier') {
          // 20F 古代の守護者: バリア中は防御超UP
          if (state.bossBarrier) {
            e.actionType = 'buff';
            e.pendingAction = '🛡️【古代障壁】防御力3倍＆魔力充填中！';
            e.nextMult = 0.9;
          } else {
            e.actionType = 'normal';
            e.pendingAction = '⚡【雷撃の矢】激しい攻撃！';
            e.nextMult = 1.4;
          }
        } else if (e.gimmick === 'mutate_form') {
          // 30F 失敗作EX-03: HP50%以下で変異
          if (!state.bossMutated && e.hp <= (e.maxHp * 0.5)) {
            state.bossMutated = true;
            e.name = '【暴走被験体EX-03: 完全体】';
            e.atk = Math.round(e.atk * 1.4);
            e.icon = '🐉';
            addLog('EX-03の細胞が激しく変異！完全体へと形態変化した！', 'danger');
          }
          e.actionType = state.bossMutated ? 'critical_smash' : 'normal';
          e.pendingAction = state.bossMutated ? '☣️【変異暴走連撃】苛烈な連続打撃！' : '触手なぎ払い';
          e.nextMult = state.bossMutated ? 1.6 : 1.1;
        } else if (e.gimmick === 'mother_tree') {
          e.actionType = state.bossTurnCount % 3 === 0 ? 'heal_roots' : 'heavy';
          e.pendingAction = state.bossAdds > 0 ? `🌿 根${state.bossAdds}体が本体を防護中` : (e.actionType === 'heal_roots' ? '🌱 根の再生を開始' : '⚠️ 巨根なぎ払い');
          e.nextMult = e.actionType === 'heavy' ? 1.45 : .8;
        } else if (e.gimmick === 'rising_water') {
          e.actionType = state.waterLevel >= 70 ? 'critical_smash' : 'normal';
          e.pendingAction = `🌊 水位 ${state.waterLevel}% ${state.waterLevel >= 70 ? '溺圧大波！排水推奨' : '上昇中'}`;
          e.nextMult = 1 + state.waterLevel / 100;
        } else if (e.gimmick === 'three_phase_core') {
          const ratio=e.hp/e.maxHp; e.phase=ratio>.66?1:(ratio>.33?2:3);
          e.actionType=e.phase===1?'normal':(e.phase===2?'heavy':'critical_smash');
          e.pendingAction=`❤️ Phase ${e.phase}：${e.phase===1?'外殻収縮':e.phase===2?'脈動連撃':'暴走・全器官攻撃'}`;
          e.nextMult=[0,1.0,1.45,1.85][e.phase];
        }
      } else {
        const r = Math.random();
        if (e.trait === 'counter_heavy' && r < 0.55) {
          e.actionType = 'counter_stance';
          e.pendingAction = `⚔️ ${e.traitName} (強攻撃厳禁)`;
          e.nextMult = 0.8;
        } else if (e.trait === 'grab_attack' && r < 0.55) {
          e.actionType = 'grab_prep';
          e.pendingAction = `⚠️ ${e.traitName}の溜め (攻撃・スキルで中断)`;
          e.nextMult = 1.6;
        } else if (e.trait === 'speed' && r < 0.55) {
          e.actionType = 'heavy';
          e.pendingAction = '⚡ 俊敏な連撃 (防御推奨)';
          e.nextMult = 1.35;
        } else if (e.trait === 'exposed_weakpoint' && (e.turnCount || 0) % 3 === 2) {
          e.actionType = 'falter';
          e.pendingAction = '🎯 冷却弱点が露出 (強攻撃の好機)';
          e.nextMult = 0.5;
        } else if (r < 0.35) {
          e.actionType = 'normal';
          e.pendingAction = '通常攻撃の構え';
          e.nextMult = 1.0;
        } else if (r < 0.60) {
          e.actionType = 'heavy';
          e.pendingAction = '⚠️ 渾身の強撃 (防御推奨)';
          e.nextMult = 1.55;
        } else if (r < 0.75) {
          e.actionType = 'counter_stance';
          e.pendingAction = '⚔️ 迎撃の構え (強撃で手痛い反撃！ 通常攻撃か防御が安全)';
          e.nextMult = 0.8;
        } else if (r < 0.88) {
          e.actionType = 'grab_prep';
          e.pendingAction = '⚠️ 拘束突進の溜め (防御無効！ 攻撃やスキルで中断可能)';
          e.nextMult = 1.6;
        } else {
          e.actionType = 'falter';
          e.pendingAction = '💫 体勢を大きく崩している (強撃の絶好の好機！)';
          e.nextMult = 0.5;
        }
      }

      // Calculate Expected Damages for player HUD
      deepEnemyIntent(e);
      let rawEnemyAtk = e.atk * e.nextMult;
      if (state.playerExposed) rawEnemyAtk *= 1.35; // Player exposed penalty
      e.expectedDmg = Math.max(1, Math.round(rawEnemyAtk - stats.def));
      const defendDef = stats.def * 3.5 + 8;
      e.expectedDefendDmg = Math.max(1, Math.round(rawEnemyAtk - defendDef));
    }

    function getEquippedSkillInfo() {
      const w = state.equipped.weapon;
      const archetype = w?.archetype || 'sword';

      const skills = {
        dagger: { name: '影縫い連撃', cost: 'CD: 2T', desc: '急所を突く3連撃(計2.0倍撃) & 敵防御-4' },
        greatsword: { name: '天輪巨絶断', cost: 'CD: 2T', desc: '防御50%無視の超破壊打撃(2.5倍撃)' },
        cursed_staff: { name: '深淵血脈解放', cost: 'HP10消費', desc: 'HPを代償に3.2倍の暗黒魔術撃' },
        thunder: { name: '天雷招来', cost: 'CD: 2T', desc: '打撃 + 22の固定雷撃放電' },
        blood: { name: '鮮血の飢渇', cost: 'CD: 2T', desc: '1.5倍撃 & 与ダメージの60%をHP吸収' },
        sword: { name: '集中気勢斬り', cost: 'CD: 2T', desc: '1.4倍撃 & 次ターン確定会心' }
      };

      return skills[archetype] || skills.sword;
    }

    function addThunderCharge(enemy, source) {
      const hasThunderGear = Object.values(state.equipped).some(i => i?.archetype === 'thunder');
      if (!hasThunderGear || !enemy) return;
      state.thunderCharges = (state.thunderCharges || 0) + 1;
      addLog(`⚡ ${source}で雷チャージ ${state.thunderCharges}/3`, 'gold');
      if (state.thunderCharges >= 3) {
        state.thunderCharges = 0;
        enemy.hp -= 30;
        enemy.stunned = true;
        spawnFloatingFx('⚡ 天雷招来 -30 & スタン！', 'crit');
        addLog(`⚡ 雷チャージが弾け、${enemy.name}に30固定ダメージ＆スタン！`, 'gold');
      }
    }

    function processPlayerStatuses() {
      let damage=0;
      if (state.statusEffects.poison>0) { damage+=3+state.statusEffects.poison; state.statusEffects.poison--; }
      if (state.statusEffects.bleed>0) { damage+=Math.max(3,Math.round(state.maxHp*.04)); state.statusEffects.bleed--; }
      if (state.statusEffects.bind>0) state.statusEffects.bind--;
      if (state.statusEffects.paralysis>0) state.statusEffects.paralysis--;
      if (state.statusEffects.weakened>0) state.statusEffects.weakened--;
      if(state.statusEffects.curse>0){damage+=4;state.statusEffects.curse--;}
      if (damage>0) { state.hp-=damage;addLog(`状態異常によりHP-${damage}`,'danger');spawnFloatingFx(`-${damage}`,'damage'); }
      return damage;
    }

    function playerCombatAction(action) {
      if (!state.currentEnemy || state.hp <= 0) return;
      initAudio();

      const stats = getPlayerStats();
      const enemy = state.currentEnemy;
      const weapon = state.equipped.weapon;
      const enemyHpBeforeAction=enemy.hp;
      const archetype = weapon?.archetype || 'sword';
      equipmentAttackStats(stats,enemy,action);
      recordDepthAction(enemy,action,stats);
      if (weapon?.craftEffect === 'elite_hunter' && enemy.isElite) stats.atk = Math.round(stats.atk * 2.5);
      if (weapon?.craftEffect === 'desperate' && state.hp <= stats.maxHp * 0.35) stats.atk = Math.round(stats.atk * 2);
      if (action === 'skill' && state.statusEffects.paralysis > 0) {
        state.statusEffects.paralysis--;
        addLog('⚡ 麻痺により武器スキルを使用できない！','danger'); render(); return;
      }
      const statusDamage = processPlayerStatuses();
      if (statusDamage && state.hp <= 0) { returnToTown(false); return; }
      if (enemy.trait === 'action_memory' && state.lastPlayerAction === action) {
        const memoryDmg=Math.max(8,Math.round(enemy.atk*.45)); state.hp-=memoryDmg;
        addLog(`🧠 同じ行動「${action}」を読まれ、${memoryDmg}の記憶反撃！`,'danger');
        if(state.hp<=0){returnToTown(false);return;}
      }
      if (equippedAccessories().some(i=>i.key === 'living_core_relic') && state.lastPlayerAction && state.lastPlayerAction !== action) {
        state.abyssGrowth=(state.abyssGrowth||0)+1;
        addLog('🫀 異なる行動の連鎖で攻撃力+1','gold');
      }
      state.lastPlayerAction=action;

      // The hatchling's regeneration is a real once-per-player-turn effect.
      const hasDragon = state.mystery.eggHatched || state.storage.some(i => i.key === 'dragon_hatchling') || state.inventory.some(i => i.key === 'dragon_hatchling');
      if (hasDragon && state.hp < stats.maxHp) {
        const regen = Math.min(3, stats.maxHp - state.hp);
        state.hp += regen;
        addLog(`🐉 深淵の幼竜の加護でHPが${regen}回復した。`, 'heal');
        spawnFloatingFx(`🐉 +${regen}HP`, 'heal');
      }
      const heartRegen = equippedAccessories().reduce((sum,i)=>sum+(i.turnRegen||0),0);
      if (heartRegen > 0 && state.hp < stats.maxHp) {
        const regen = Math.min(heartRegen, stats.maxHp - state.hp);
        state.hp += regen;
        addLog(`🌱 母樹の心核がHPを${regen}回復した。`, 'heal');
        spawnFloatingFx(`🌱 +${regen}HP`, 'heal');
      }

      if (action === 'attack' || action === 'heavy' || action === 'skill') {
        state.guardFatigue = 0;
        state.guardStamina = Math.min(100, (state.guardStamina || 0) + 20);
        state.guardBroken = false;
      }

      // Cooldown tick
      if (state.skillCooldown > 0 && action !== 'skill') {
        state.skillCooldown--;
      }

      // Interruption check: Grab prep interrupted by direct attack or skill
      let interruptedGrab = false;
      if (enemy.actionType === 'grab_prep' && (action === 'attack' || action === 'skill')) {
        interruptedGrab = true;
        enemy.actionType = 'falter';
        enemy.pendingAction = '💫 突進を阻止され怯んでいる！';
        enemy.nextMult = 0.5;
        playSound('crit');
        spawnFloatingFx('⚡ 突進中断成功！', 'crit');
        addLog(`痛烈な一撃で ${enemy.name} の拘束突進を打ち砕き、体勢を崩させた！`, 'gold');
      }

      // 1. NORMAL ATTACK
      if (action === 'attack') {
        let isCrit = Math.random() * 100 < stats.crit;
        if (state.guaranteedCrit) { isCrit = true; state.guaranteedCrit = false; }

        let baseDmg = stats.atk * (isCrit ? 1.8 + Math.min(150,equipmentEffects().critDamage||0)/100 : 1.0) * (state.playerAttackBuff || 1.0);
        let targetDef = (enemy.gimmick==='shield_barrier' && state.bossBarrier) ? enemy.def * 3 : enemy.def;
        let dmg = Math.max(1, Math.round(baseDmg - targetDef + (Math.random() * 4 - 2)));

        state.playerAttackBuff = 1.0; // Consumed

        // Dagger Dual Strike archetype check
        if (archetype === 'dagger' || weapon?.name?.includes('短剣') || weapon?.name?.includes('ダガー')) {
          const dmg1 = Math.max(1, Math.round(dmg * 0.65));
          const dmg2 = Math.max(1, Math.round(dmg * 0.65));
          enemy.hp -= (dmg1 + dmg2);
          playSound('hit');
          spawnFloatingFx(`🗡️ 2連撃 -${dmg1} -${dmg2}`, isCrit ? 'crit' : 'damage');
          addLog(`ダガーの二刀連撃！ ${enemy.name} に ${dmg1} ＋ ${dmg2} の連続ダメージ！`, 'normal');
        } else {
          enemy.hp -= dmg;
          if (isCrit) {
            playSound('crit');
            spawnFloatingFx(`💥 会心 -${dmg}`, 'crit');
            addLog(`急所を撃ち抜く会心の一撃！ ${enemy.name} に ${dmg} の痛撃！`, 'gold');
          } else {
            playSound('hit');
            spawnFloatingFx(`-${dmg}`, 'damage');
            addLog(`${enemy.name} に ${dmg} のダメージ！`, 'normal');
          }
        }

        // Thunder Bonus
        if (archetype === 'thunder') {
          const shock = 14;
          enemy.hp -= shock;
          playSound('crit');
          spawnFloatingFx(`⚡ 雷撃 -${shock}`, 'crit');
          addLog(`雷光が放電！ ${enemy.name} に ${shock} の追加雷撃！`, 'gold');
        }
        addThunderCharge(enemy, '攻撃');

        // Baby Dragon companion follow-up strike
        const hasDragon = state.mystery.eggHatched || state.storage.some(i => i.key === 'dragon_hatchling') || state.inventory.some(i => i.key === 'dragon_hatchling');
        if (hasDragon) {
          const flame = 8;
          enemy.hp -= flame;
          spawnFloatingFx(`🔥 幼竜の息吹 -${flame}`, 'crit');
          addLog(`幼竜が火炎を吐き、${enemy.name} に ${flame} の追撃！`, 'gold');
        }

        equipmentHit(enemy,action,isCrit);
        applyRootProtection(enemy,enemyHpBeforeAction);
        // Vampirism
        if (stats.vamp > 0) {
          const healed = Math.min(stats.maxHp - state.hp, stats.vamp);
          if (healed > 0) {
            state.hp += healed;
            spawnFloatingFx(`+${healed} HP`, 'heal');
            addLog(`吸血により HPが ${healed} 回復した。`, 'heal');
          }
        }

        if (enemy.hp <= 0) {
          enemy.hp = 0;
          onEnemyKilled();
          return;
        }

        setTimeout(() => enemyTurn(false), 250);
      } 
      // 2. STRONG ATTACK (強攻撃: 高威力 / 次ターン被ダメ+35%の隙 / 敵迎撃構え時はカウンター被弾)
      else if (action === 'heavy') {
        // Enemy Counter Stance check
        if (enemy.actionType === 'counter_stance') {
          playSound('player_hurt');
          const counterDmg = Math.max(6, Math.round(enemy.atk * 1.5 - stats.def));
          state.hp -= counterDmg;
          spawnFloatingFx(`💥 迎撃カウンター被弾 -${counterDmg}！`, 'damage');
          addLog(`⚠️ 敵の迎撃構えに大振りを合わせられた！ ${enemy.name} の痛烈なカウンターを受け ${counterDmg} のダメージ！`, 'danger');
          if (state.hp <= 0) {
            state.hp = 0;
            updateHeader();
            setTimeout(() => returnToTown(false), 500);
            return;
          }
          decideEnemyIntent();
          updateHeader();
          render();
          return;
        }

        playSound('heavy_attack');
        let mult = (archetype === 'greatsword') ? 2.5 : 1.9;
        if (enemy.actionType === 'falter') mult *= 1.4; // Falter bonus: +40% more damage!
        let baseDmg = stats.atk * mult * (state.playerAttackBuff || 1.0);
        let targetDef = (enemy.gimmick==='shield_barrier' && state.bossBarrier) ? enemy.def * 3 : enemy.def;
        let dmg = Math.max(1, Math.round(baseDmg - targetDef + (Math.random() * 6 - 3)));
        if (weapon?.affix === 'boss_slayer' && enemy.isBoss) dmg = Math.round(dmg * 1.25);
        if (weapon?.affix === 'elite_slayer' && enemy.isElite) dmg = Math.round(dmg * 1.30);

        state.playerAttackBuff = 1.0;
        state.playerExposed = true; // Demerit: +35% damage next enemy turn!

        enemy.hp -= dmg;
        addThunderCharge(enemy, '強攻撃');
        equipmentHit(enemy,action);
        if (hasDragon) {
          enemy.hp -= 8;
          spawnFloatingFx('🔥 幼竜の息吹 -8', 'crit');
          addLog(`幼竜の火炎追撃！ ${enemy.name}に8ダメージ。`, 'gold');
        }
        spawnFloatingFx(`💥 強撃 -${dmg}！ ${enemy.actionType === 'falter' ? '(隙特効!)' : '(隙あり被ダメ+35%)'}`, 'crit');
        addLog(`渾身の力で武器を叩きつけた！ ${enemy.name} に ${dmg} の強打！`, 'gold');
        applyRootProtection(enemy,enemyHpBeforeAction);

        if (enemy.hp <= 0) {
          enemy.hp = 0;
          onEnemyKilled();
          return;
        }

        setTimeout(() => enemyTurn(false), 250);
      }
      // 3. DEFEND (身を守る: ダメージ激減 & 次ターン攻撃力+35% & 盾反撃)
      else if (action === 'defend') {
        playSound('click');
        state.guardFatigue = (state.guardFatigue || 0) + 1;
        const intentCanJustGuard = ['heavy', 'critical_smash'].includes(enemy.actionType);
        const staminaCost = intentCanJustGuard ? 10 : 30;
        state.guardStamina = Math.max(0, (state.guardStamina || 0) - staminaCost);
        if (state.guardStamina <= 0 || state.guardFatigue >= 4) {
          state.guardBroken = true;
          spawnFloatingFx('⚠️ GUARD BREAK！', 'damage');
          addLog('⚠️ ガード疲労が限界に達し、構えを崩された！', 'danger');
        } else if (state.guardFatigue >= 2) {
          spawnFloatingFx(`⚠️ ガード疲労 ${state.guardFatigue}`, 'info');
          addLog(`⚠️ 連続防御でガード効率が低下している（${state.guardFatigue}連続）`, 'danger');
        }
        state.playerAttackBuff = 1.35; // Next attack buffed
        spawnFloatingFx(intentCanJustGuard && !state.guardBroken ? '✨ JUST GUARD！' : '🛡️ ガード', 'info');
        addLog(intentCanJustGuard && !state.guardBroken ? '✨ 敵の大技を読み切り、JUST GUARDを狙う！' : '盾を構えた。連続使用するとガード疲労が蓄積する。', 'normal');
        setTimeout(() => enemyTurn(true), 250);
      }
      // 4. WEAPON SKILL (装備固有スキル)
      else if (action === 'skill') {
        if (state.skillCooldown > 0) {
          addLog(`スキルはクールダウン中です（あと${state.skillCooldown}ターン）`, 'danger');
          render();
          return;
        }

        playSound('weapon_skill');
        let skillDmg = 0;

        if (archetype === 'dagger') {
          // 影縫い連撃
          skillDmg = Math.max(1, Math.round(stats.atk * 2.0 - enemy.def));
          enemy.def = Math.max(0, enemy.def - 4);
          enemy.hp -= skillDmg;
          spawnFloatingFx(`🗡️ 影縫い連撃 -${skillDmg} (敵DEF-4)`, 'crit');
          addLog(`【影縫い連撃】急所を刺突して ${skillDmg} ダメージ！ 敵の防御力を4削り取った！`, 'gold');
        } else if (archetype === 'greatsword') {
          // 天輪巨絶断
          skillDmg = Math.max(1, Math.round(stats.atk * 2.5 - (enemy.def * 0.5)));
          enemy.hp -= skillDmg;
          spawnFloatingFx(`⚔️ 天輪巨絶断 -${skillDmg} (防50%無視)`, 'crit');
          addLog(`【天輪巨絶断】装甲ごと叩き割る一撃！ ${skillDmg} の大ダメージ！`, 'gold');
        } else if (archetype === 'cursed_staff') {
          // 深淵血脈解放
          if (state.hp <= 10) {
            addLog('体力が足りず血脈解放を行えない！', 'danger');
            return;
          }
          state.hp -= 10;
          const bloodAwakened = weapon?.key === 'mythic_blood_scythe' && state.hp <= stats.maxHp * 0.25;
          skillDmg = Math.max(1, Math.round(stats.atk * (bloodAwakened ? 4.2 : 3.2)));
          enemy.hp -= skillDmg;
          spawnFloatingFx(`🩸 深淵血脈解放 -${skillDmg} (HP-10)`, 'crit');
          addLog(`【深淵血脈解放】HP10を捧げて深淵の黒炎を召喚！ ${skillDmg} の致命打！`, 'gold');
        } else if (archetype === 'thunder') {
          // 天雷招来
          skillDmg = Math.max(1, Math.round(stats.atk * 1.5 - enemy.def)) + 22;
          if (weapon?.key === 'mythic_thunder_blade' && state.thunderCharges > 0) {
            skillDmg += state.thunderCharges * 15;
            addLog(`⚡ 神雷剣が雷印${state.thunderCharges}個を一斉起爆！`, 'gold');
            state.thunderCharges = 0;
          }
          enemy.hp -= skillDmg;
          spawnFloatingFx(`⚡ 天雷招来 -${skillDmg}`, 'crit');
          addLog(`【天雷招来】稲妻が直撃！ ${skillDmg} の雷電ダメージ！`, 'gold');
        } else if (archetype === 'blood') {
          // 鮮血の飢渇
          skillDmg = Math.max(1, Math.round(stats.atk * 1.5 - enemy.def));
          enemy.hp -= skillDmg;
          const drain = Math.round(skillDmg * 0.6);
          state.hp = Math.min(stats.maxHp, state.hp + drain);
          spawnFloatingFx(`🩸 飢渇 -${skillDmg} / +${drain}HP`, 'heal');
          addLog(`【鮮血の飢渇】生命力を吸い取り ${skillDmg} ダメージ！ HPを ${drain} 回復！`, 'heal');
        } else {
          // Sword Focus
          skillDmg = Math.max(1, Math.round(stats.atk * 1.4 - enemy.def));
          enemy.hp -= skillDmg;
          state.guaranteedCrit = true;
          spawnFloatingFx(`⚔️ 気勢斬り -${skillDmg} (次回会心確定)`, 'crit');
          addLog(`【集中気勢斬り】研ぎ澄まされた刃で ${skillDmg} ダメージ！ 次の攻撃は会心確定！`, 'gold');
        }

        equipmentHit(enemy,action);
        state.skillCooldown = Math.max(1,2-(equipmentEffects().skillHaste||0))+(enemy.gimmick==='rising_water'&&state.waterLevel>=70?1:0);
        addThunderCharge(enemy, '武器スキル');

        if (hasDragon) {
          enemy.hp -= 8;
          spawnFloatingFx('🔥 幼竜の息吹 -8', 'crit');
          addLog(`幼竜の火炎追撃！ ${enemy.name}に8ダメージ。`, 'gold');
        }
        applyRootProtection(enemy,enemyHpBeforeAction);

        if (enemy.hp <= 0) {
          enemy.hp = 0;
          onEnemyKilled();
          return;
        }

        setTimeout(() => enemyTurn(false), 250);
      }
      // 5. DISRUPT BARRIER (20F Ancient Guardian gimmick)
      else if (action === 'disrupt_barrier') {
        if (enemy.isBoss && state.bossBarrier) {
          state.bossBarrier = false;
          playSound('crit');
          spawnFloatingFx('⚡ 障壁解除！好機！', 'crit');
          addLog('ルーン障壁を破壊した！古代の守護者が隙を晒した！', 'gold');
          setTimeout(() => enemyTurn(false), 300);
        }
      } else if (action === 'attack_roots' && enemy.gimmick === 'mother_tree' && state.bossAdds > 0) {
        state.bossAdds--;
        state.bossBarrier = state.bossAdds > 0;
        addLog(`🌿 守護根を破壊！ 残り${state.bossAdds}体`,'gold');
        setTimeout(()=>enemyTurn(false),250);
      } else if (action === 'drain_water' && enemy.gimmick === 'rising_water') {
        state.waterLevel=Math.max(0,state.waterLevel-35);
        addLog(`🚰 排水機構を作動！ 水位を${state.waterLevel}%へ低下`,'gold');
        setTimeout(()=>enemyTurn(false),250);
      }

      updateHeader();
      render();
    }

    function enemyTurn(isPlayerDefending = false) {
      if (!state.currentEnemy || state.hp <= 0) return;
      const stats = getPlayerStats();
      const enemy = state.currentEnemy;
      equipmentPoisonTick(enemy);
      if(enemy.hp<=0){onEnemyKilled();return;}
      const gearEffects=equipmentEffects();
      if(Math.random()*100<Math.max(0,Math.min(45,gearEffects.dodge||0)-(enemy.gimmick==='rising_water'&&state.waterLevel>=70?20:0))) {
        state.playerAttackBuff=Math.max(state.playerAttackBuff||1,1+Math.min(150,gearEffects.dodgeAttack||0)/100);
        addLog('💨 回避成功！'+(gearEffects.dodgeAttack?' 次の攻撃を強化':''),'gold');decideEnemyIntent();updateHeader();render();return;
      }
      if (enemy.gimmick === 'rising_water') state.waterLevel=Math.min(100,state.waterLevel+15);
      if (enemy.gimmick === 'mother_tree' && enemy.actionType === 'heal_roots') {
        const heal=Math.min(55,enemy.maxHp-enemy.hp); enemy.hp+=heal;
        if (state.bossAdds===0) {state.bossAdds=1;state.bossBarrier=true;}
        addLog(`🌱 母樹がHP${heal}回復し、守護根を再生した！`,'danger');
      }
      if (enemy.stunned) {
        enemy.stunned = false;
        addLog(`💫 ${enemy.name}はスタンして行動できない！`, 'gold');
        decideEnemyIntent(); updateHeader(); render(); return;
      }
      enemy.turnCount = (enemy.turnCount || 0) + 1;
      if(enemy.pulseTurns>0){enemy.pulseTurns--;const heal=Math.min(Math.round(enemy.maxHp*.06),enemy.maxHp-enemy.hp);enemy.hp+=heal;addLog(`🫀 肉塊の残響が敵を${heal}回復（残り${enemy.pulseTurns}T）`,'danger');}
      if(enemy.trait==='captain_phase'&&enemy.turnCount%2===0){enemy.summons=Math.min(2,(enemy.summons||0)+1);addLog(`⚓ 亡霊船員を召喚（${enemy.summons}/2）`,'danger');}

      let enemyAtk = enemy.atk * (enemy.nextMult || 1.0);
      deepEnemyTurn(enemy,isPlayerDefending);
      enemyAtk=enemy.atk*(enemy.nextMult||1);
      if(enemy.inheritTurns>0){enemyAtk+=enemy.inheritedAtk||0;enemy.inheritTurns--;}
      if(enemy.trait==='captain_phase'){enemyAtk*=enemy.hp<enemy.maxHp*.5?1.25:1;enemyAtk+=(enemy.summons||0)*3;}
      if (state.playerExposed) {
        enemyAtk *= 1.35; // Exposed penalty
        state.playerExposed = false; // reset
      }

      // Guard is tactical: big telegraphed attacks can be JUST GUARDED,
      // while repeated guards lose efficiency and grabs pierce it.
      let isGrab = (enemy.actionType === 'grab_prep');
      const isJustGuard = isPlayerDefending && !isGrab && !state.guardBroken && ['heavy', 'critical_smash'].includes(enemy.actionType);
      const baseDmg = Math.max(1, Math.round(enemyAtk - stats.def));
      let dmg = baseDmg;
      if (isPlayerDefending && !isGrab && !state.guardBroken) {
        const fatigueReductions = [0, 0.55, 0.45, 0.30];
        let reduction = isJustGuard ? 0.80 : (fatigueReductions[Math.min(3, state.guardFatigue)] || 0);
        if (state.equipped.armor?.key === 'guardian_aegis') reduction = Math.min(0.85, reduction + 0.15);
        if (equippedAccessories().some(i=>i.lowHpGuard) && state.hp <= stats.maxHp * 0.35) reduction = Math.min(0.90, reduction + 0.10);
        dmg = Math.max(Math.ceil(enemyAtk * (isJustGuard ? 0.10 : 0.18)), Math.round(baseDmg * (1 - reduction)));
      } else if (state.guardBroken) {
        dmg = Math.max(1, Math.round(baseDmg * 1.35));
      }

      // Apply demerit damages (e.g. Gold mask)
      if(enemy.trait==='captain_phase'&&enemy.hp<enemy.maxHp*.5){dmg*=2;addLog('⚓ 船長の二連撃！','danger');}
      if (stats.demeritDamage !== 0) {
        dmg = Math.round(dmg * (1 + stats.demeritDamage / 100));
      }

      state.hp -= dmg;
      if(state.hp>0&&isPlayerDefending&&!isGrab&&!state.guardBroken) {
        if(gearEffects.guardHeal){const heal=Math.max(0,Math.min(stats.maxHp-state.hp,gearEffects.guardHeal));state.hp+=heal;addLog(`🛡️ ガード回復 +${heal}HP`,'heal');}
        if(isJustGuard&&gearEffects.justAttack){state.playerAttackBuff=Math.max(state.playerAttackBuff||1,1+Math.min(150,gearEffects.justAttack)/100);addLog('🛡️ JUST GUARD連携：次撃強化','gold');}
      }
      if (state.equipped.armor?.archetype === 'thunder') addThunderCharge(enemy, '被弾');
      playSound('player_hurt');
      triggerShake();

      if (state.guardBroken) {
        spawnFloatingFx(`💥 GUARD BREAK -${dmg}`, 'damage');
        addLog(`⚠️ ガードが崩壊し、${enemy.name}の攻撃が直撃！ ${dmg}ダメージ！`, 'danger');
      } else if (isJustGuard) {
        spawnFloatingFx(`✨ JUST GUARD -${dmg}`, 'info');
        addLog(`✨ JUST GUARD成功！ ${enemy.name}の大技を読み切り、被害を${dmg}に抑えた！`, 'gold');
      } else if (isGrab && isPlayerDefending) {
        spawnFloatingFx(`💥 ガード貫通拘束 -${dmg}`, 'damage');
        addLog(`⚠️ ${enemy.name} の強烈な拘束突進は防御を突き破って直撃した！ ${dmg} の大打撃！`, 'danger');
      } else {
        spawnFloatingFx(isPlayerDefending ? `🛡️ ガード -${dmg}` : `-${dmg}`, 'damage');
        addLog(`${enemy.name} の反撃！ ${dmg} のダメージを受けた！`, 'danger');
      }


      if (enemy.trait === 'curse_poison') {
        state.playerPoisonTurns = 2;
        state.playerPoisonDmg = enemy.isElite ? 6 : 3;
        addLog(`☣️ ${enemy.name}の呪毒を受けた！`, 'danger');
      }
      if (enemy.trait === 'spore_poison') { state.statusEffects.poison=Math.min(6,state.statusEffects.poison+2); addLog('☠️ 胞子毒が蓄積した！','danger'); }
      if (enemy.trait === 'skill_bind') { state.skillCooldown+=1; state.statusEffects.bind=2; addLog('🕸️ 拘束されスキルCD+1','danger'); }
      if (enemy.trait === 'paralysis') { state.statusEffects.paralysis=1; addLog('⚡ 麻痺：次のスキル使用不可','danger'); }
      if (enemy.trait === 'ancient_growth') { enemy.atk=Math.round(enemy.atk*1.07);enemy.def+=2;addLog('🌳 捕食王が成長した','danger'); }
      if (enemy.trait === 'low_hp_frenzy' && enemy.hp<enemy.maxHp*.4) enemy.atk=Math.round(enemy.atk*1.08);
      if (enemy.trait === 'captain_phase' && enemy.hp<enemy.maxHp*.5 && !enemy.captainArmored) {enemy.captainArmored=true;enemy.def+=4;}
      if (enemy.trait === 'copy_buff' && state.playerAttackBuff>1) { enemy.atk=Math.round(enemy.atk*state.playerAttackBuff);addLog('👁️ 攻撃バフを模倣された！','danger'); }
      if (enemy.trait === 'rage_stack') {
        enemy.atk = Math.round(enemy.atk * 1.08);
        addLog(`🔥 ${enemy.name}の攻撃力が上昇した！`, 'danger');
      }
      if (isPlayerDefending && enemy.trait === 'guard_enrage') {
        enemy.atk = Math.round(enemy.atk * 1.15);
        addLog(`💢 ${enemy.name}は防御を見て激昂し、攻撃力を上げた！`, 'danger');
      }
      if (isPlayerDefending && enemy.trait === 'guard_breaker') {
        state.guardStamina = Math.max(0, state.guardStamina - 35);
        state.guardFatigue = Math.max(3, state.guardFatigue);
        addLog(`💥 ${enemy.name}がガードゲージを大きく破壊した！`, 'danger');
      }
      if (enemy.trait === 'regen_cell' && enemy.turnCount % 2 === 0) {
        const heal = Math.min(15, enemy.maxHp - enemy.hp);
        enemy.hp += heal;
        if (heal > 0) addLog(`🧬 ${enemy.name}の再生細胞がHPを${heal}回復！`, 'heal');
      }
      if (state.playerPoisonTurns > 0) {
        state.hp -= state.playerPoisonDmg;
        state.playerPoisonTurns--;
        addLog(`☣️ 呪毒によりHP-${state.playerPoisonDmg}`, 'danger');
      }

      // Shield / Titan counter parry
      const armor = state.equipped.armor;
      const titanActive = stats.synList.some(s => s.id === 'syn_titan' && s.count >= 3);
      const hasShield = armor?.archetype === 'shield' || titanActive;
      const parryChance = isJustGuard ? 1 : (titanActive ? 0.55 : 0.35);
      if (isPlayerDefending && !state.guardBroken && hasShield && Math.random() < parryChance) {
        let counterDmg = Math.max(4, Math.round(stats.atk * 0.5 + enemy.atk * 0.15));
        if (isJustGuard && armor?.key === 'guardian_aegis') counterDmg = Math.round(counterDmg * 1.5);
        enemy.hp -= counterDmg;
        playSound('parry');
        spawnFloatingFx(`🛡️ パリィ反撃 -${counterDmg}`, 'crit');
        addLog(`大盾で受け流してカウンター！ ${enemy.name} に ${counterDmg} の打撃を跳ね返した！`, 'gold');
        if (enemy.hp <= 0) {
          enemy.hp = 0;
          onEnemyKilled();
          return;
        }
      }
      state.guardStamina = Math.min(100, (state.guardStamina || 0) + 10);

      // Check fatal blow & Second Chance from Nameless Portrait
      if (state.hp <= 0) {
        if (state.equipped.armor?.key === 'abyssal_void_cloak' && !state.usedVoidCloak) {
          state.usedVoidCloak = true;
          state.maxHp = Math.max(1, Math.floor(state.maxHp / 2));
          state.hp = state.maxHp;
          spawnFloatingFx('🕳️ 虚無王の外套：死を無効化', 'crit');
          addLog('🕳️ 虚無が致命傷を呑み込んだ。代償として、この探索中の最大HPが半減！', 'gold');
          decideEnemyIntent(); updateHeader(); render(); return;
        }
        if (state.mystery.hasSecondChance && !state.usedSecondChance) {
          state.usedSecondChance = true;
          state.hp = 1;
          playSound('safe_point');
          spawnFloatingFx('✨ 名もなき肖像画の加護！HP1で耐えた！', 'crit');
          addLog('【奇跡】肖像画の神秘的な加護が致命傷を肩代わりし、HP1で踏みとどまった！', 'gold');
          decideEnemyIntent();
          updateHeader();
          render();
          return;
        }

        state.hp = 0;
        updateHeader();
        setTimeout(() => returnToTown(false), 500);
        return;
      }

      decideEnemyIntent();
      updateHeader();
      render();
    }

    function onEnemyKilled() {
      if(!state.currentEnemy)return;
      const enemy = state.currentEnemy;
      playSound(enemy.isBoss ? 'boss_kill' : 'kill');
      state.lastDefeatedEnemy={atk:enemy.atk,trait:enemy.trait};
      if(enemy.trait==='death_pulse'){state.pendingEnemyPulse=3;addLog('🫀 肉塊の治癒脈動が次の敵へ伝わった（3T・毎ターン最大HP6%回復）','danger');}
      if(enemy.gearPoison&&equipmentEffects().poisonHeal){const heal=equipmentEffects().poisonHeal;state.hp=Math.min(getPlayerStats().maxHp,state.hp+heal);addLog(`☠️ 毒敵撃破回復 +${heal}HP`,'heal');}
      dropMonsterMaterials(enemy);
      state.runKills++;
      if (state.equipped.weapon?.key === 'abyssal_devourer') {
        const growth = state.greedLevel > 0 ? 2 + state.greedLevel : 2;
        state.abyssGrowth = (state.abyssGrowth || 0) + growth;
        addLog(`🌌 深淵喰らいが成長：探索中攻撃力 +${state.abyssGrowth}`, 'gold');
      }

      if (state.camp.tavern >= 2 && state.bounty && !state.bounty.completed) {
        const killBonus = state.expeditionPolicy === 'bounty' ? 2 : 1;
        state.bounty.currentKills = (state.bounty.currentKills || 0) + killBonus;
        if (state.bounty.currentKills >= state.bounty.targetKills) {
          state.bounty.completed = true;
          addLog(`📜 酒場の討伐依頼【魔物${state.bounty.targetKills}体討伐】を達成！ 拠点帰還後に報酬 ${state.bounty.rewardGold}G を受取可能！`, 'gold');
          spawnFloatingFx('📜 討伐依頼達成！', 'gold');
        }
      }

      const stats = getPlayerStats();
      const baseGold = 12 + state.floor * 6;
      let earnedGold = Math.round(baseGold * (1 + stats.goldRate / 100));
      earnedGold = Math.round(earnedGold * (state.modifiers.goldMult || 1));
      if (state.expeditionPolicy === 'bounty') earnedGold = Math.round(earnedGold * 1.5);
      state.dungeonGold += earnedGold;
      state.runRecords.mostGold=Math.max(state.runRecords.mostGold||0,state.dungeonGold);
      state.runRecords.mostKills=Math.max(state.runRecords.mostKills||0,state.runKills);
      if(state.floor>=31&&Math.random()<0.12){state.deepCrystals++;addLog('🔷 深層結晶を発見！','gold');}

      spawnFloatingFx(`💀 討伐！ +${earnedGold}G`, 'gold');
      addLog(`討伐成功！ ${enemy.name} を撃破！ 金貨 +${earnedGold}G`, 'gold');

      if (enemy.isBoss) {
        state.bossFirstKills = state.bossFirstKills || {};
        const isFirstKill = !state.bossFirstKills[state.floor];

        if (isFirstKill) {
          state.bossFirstKills[state.floor] = true;
          saveState();

          let sigItem = null;
          let extraCores = 2;
          if (state.floor === 10) {
            sigItem = { ...UNIQUE_ITEMS.giant_ram, id: 'boss10_' + Date.now() };
          } else if (state.floor === 20) {
            sigItem = { ...UNIQUE_ITEMS.guardian_aegis, id: 'boss20_' + Date.now() };
          } else if (state.floor === 30) {
            sigItem = { ...UNIQUE_ITEMS.mutagen_core, id: 'boss30_' + Date.now() };
            extraCores = 3;
          } else if (state.floor === 40) {
            sigItem = { ...UNIQUE_ITEMS.mother_tree_heart, id:'boss40_'+Date.now() }; extraCores=3;
          } else if (state.floor === 50) {
            sigItem = { ...UNIQUE_ITEMS.nereus_crown, id:'boss50_'+Date.now() }; extraCores=4;
          } else if (state.floor === 60) {
            sigItem = { ...UNIQUE_ITEMS.living_core_relic, id:'boss60_'+Date.now() }; extraCores=5;
          } else {
            sigItem = generateItem(state.floor, 'Legendary');
          }

          state.abyssCores += extraCores;
          giveItemToBag(sigItem);
          playSound('legendary');
          spawnFloatingFx(`👑 ボス初討伐！ 固有秘宝GET！`, 'crit');
          addLog(`【初回撃破達成】守護ボスの固有秘宝【${sigItem.name}】と深淵の核×${extraCores}を獲得！`, 'gold');
          state.runRecords.bossesDefeated=Object.keys(state.bossFirstKills).length;
        } else {
          // Repeat bosses use the centralized table (Epic floor, Legendary ~7%).
          state.abyssCores += 1;
          if (Math.random() < 0.10) giveItemToBag(generateItem(state.floor, null, 'boss_repeat'));
          addLog('ボス周回撃破！ 固有素材と深淵の核を獲得！', 'gold');
        }

        // Check Broken Crown awakening
        [...state.inventory, ...state.storage, ...Object.values(state.equipped).filter(Boolean)].forEach(it => {
          if (it.key === 'broken_crown' && !it.awakened) {
            it.awakened = true;
            it.name = '👑 覚醒した深淵覇王冠';
            it.icon = '👑';
            it.rarity = 'Legendary';
            it.baseAtk = 16;
            it.baseDef = 12;
            it.hp = 60;
            it.goldRate = 80;
            it.desc = '【覚醒した王冠】階層ボスの血を吸い真の威光を取り戻した王の証 (攻+16/防+12/HP+60/金+80%)';
            state.mystery.crownAwakened = true;
            playSound('legendary');
            spawnFloatingFx('👑 王冠が覚醒した！', 'crit');
            addLog('👑 階層ボスの魂を吸収し、【壊れた王冠】が【覚醒した深淵覇王冠】へと真の覚醒を果たした！', 'gold');
          }
        });

        afterChapterBoss(state.floor);return;
      } else if (Math.random() < (enemy.isElite ? 0.08 : 0.03)) {
        // Elite or standard drop
        const item = generateItem(state.floor, enemy.isElite ? (Math.random()<0.3?'Epic':'Rare') : (Math.random()<0.2?'Rare':'Common'), 'monster');
        giveItemToBag(item);
      }

      state.currentEnemy = null;
      // Advance to next floor
      state.floor++;
      setTimeout(() => generateDoorsForFloor(), 400);
    }

      closeGenericModal();state.currentEnemy=null;
      if(floor===MAX_DUNGEON_FLOOR){returnToTown(true);return;}
      state.floor=floor+1;generateDoorsForFloor();
    }

      initAudio();
      playSound('escape');
      document.getElementById('modal-layer').style.display = 'none';
      returnToTown(true);
