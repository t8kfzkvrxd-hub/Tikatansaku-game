       ========================================================================== */
    function rollItemRarity({ floor = 1, source = 'normal', greed = 0, luck = 0, trackPity = true, rng = Math.random } = {}) {
      const progress = state.rarityProgress;
      if (trackPity) {
        progress.mythicPity++;
        progress.abyssalPity++;
      }

      if (source === 'boss_repeat') {
        const r = rng();
        if (floor >= 11 && ((trackPity && progress.abyssalPity >= 1500) || r < 0.0005)) return registerUpperRarity('Abyssal', trackPity);
        if ((trackPity && progress.mythicPity >= 250) || r < 0.0045) return registerUpperRarity('Mythic', trackPity);
        if (r < 0.0745) return 'Legendary';
        return 'Epic';
      }

      let abyssal = floor < 11 ? 0 : (floor < 21 ? 0.0002 : (floor < 51 ? 0.0006 : 0.0008));
      let mythic = floor < 11 ? 0.0015 : (floor < 21 ? 0.0040 : (floor < 31 ? 0.0050 : 0.0055));
      let legendary = 0.006 + (floor >= 21 ? 0.002 : (floor >= 11 ? 0.001 : 0));
      abyssal += Math.min(0.00015, luck * 0.000001) + greed * 0.00004;
      mythic += Math.min(0.0010, luck * 0.00001) + greed * 0.00012;
      legendary += Math.min(0.004, luck * 0.00004) + greed * 0.0008;
      if (floor < 11) abyssal = 0;

      if (source === 'elite') legendary = 0.04 + greed * 0.002;
      if (source === 'sealed_vault') legendary = 0.025;
      if (source === 'cursed_chest') legendary = 0.018;

      if (trackPity && progress.abyssalPity >= 800) abyssal += Math.min(0.0014, (progress.abyssalPity - 800) * 0.000002);
      if (trackPity && progress.mythicPity >= 100) mythic += Math.min(0.0045, (progress.mythicPity - 100) * 0.00003);

      const r = rng();
      if (floor >= 11 && ((trackPity && progress.abyssalPity >= 1500) || r < abyssal)) return registerUpperRarity('Abyssal', trackPity);
      if ((trackPity && progress.mythicPity >= 250) || r < abyssal + mythic) return registerUpperRarity('Mythic', trackPity);
      if (r < abyssal + mythic + legendary) return 'Legendary';

      if (source === 'elite') return r < abyssal + mythic + legendary + 0.28 ? 'Epic' : 'Rare';
      if (source === 'sealed_vault' || source === 'cursed_chest') return 'Epic';

      const epic = 0.075 + Math.min(0.13, luck * 0.0010) + greed * 0.018 + (floor>=31?Math.min(.04,Math.floor((floor-21)/10)*.01):0);
      const rare = 0.27 + Math.min(0.24, luck * 0.0020) + greed * 0.035;
      if (r < abyssal + mythic + legendary + epic) return 'Epic';
      if (r < abyssal + mythic + legendary + epic + rare) return 'Rare';
      return 'Common';
    }

    function registerUpperRarity(rarity, trackPity) {
      if (!trackPity) return rarity;
      if (rarity === 'Mythic') {
        state.rarityProgress.mythicPity = 0;
        state.rarityProgress.mythicTotalDrops++;
      } else {
        state.rarityProgress.abyssalPity = 0;
        state.rarityProgress.abyssalTotalDrops++;
      }
      saveState();
      return rarity;
    }

    function generateItem(floor, forcedRarity = null, source = 'normal') {
      const stats = getPlayerStats();
      let rarity = forcedRarity || rollItemRarity({ floor, source, greed: state.greedLevel, luck: stats.rareRate });

      if (rarity === 'Abyssal') {
        const pool = [UNIQUE_ITEMS.abyssal_devourer, UNIQUE_ITEMS.abyssal_observer, UNIQUE_ITEMS.abyssal_void_cloak];
        return { ...pool[Math.floor(Math.random() * pool.length)], id:'aby_' + Date.now() + Math.random(), dropSource:source };
      }
      if (rarity === 'Mythic') {
        const pool = [UNIQUE_ITEMS.mythic_thunder_blade, UNIQUE_ITEMS.mythic_blood_scythe, UNIQUE_ITEMS.mythic_sky_shield];
        return { ...pool[Math.floor(Math.random() * pool.length)], id:'myt_' + Date.now() + Math.random(), dropSource:source };
      }

      // Check unique item pool with signature archetype items
      if (rarity === 'Legendary' && Math.random() < 0.65) {
        const legPool = [
          UNIQUE_ITEMS.death_scythe,
          UNIQUE_ITEMS.abyss_armor,
          UNIQUE_ITEMS.gold_mask,
          UNIQUE_ITEMS.execution_greatsword,
          UNIQUE_ITEMS.thunder_mace,
          UNIQUE_ITEMS.blood_scythe,
          UNIQUE_ITEMS.giant_ram
        ];
        const selected = legPool[Math.floor(Math.random() * legPool.length)];
        return { ...selected, id: 'u_' + Date.now() + Math.random() };
      } else if (rarity === 'Epic' && Math.random() < 0.55) {
        const epicPool = [
          UNIQUE_ITEMS.vamp_dagger,
          UNIQUE_ITEMS.gold_blade,
          UNIQUE_ITEMS.berserk_ring,
          UNIQUE_ITEMS.thunder_mail,
          UNIQUE_ITEMS.blood_garb
        ];
        const selected = epicPool[Math.floor(Math.random() * epicPool.length)];
        return { ...selected, id: 'u_' + Date.now() + Math.random() };
      } else if (rarity === 'Rare' && Math.random() < 0.45) {
        const rarePool = [
          UNIQUE_ITEMS.thunder_ring,
          UNIQUE_ITEMS.blood_ring,
          UNIQUE_ITEMS.giant_bracer,
          UNIQUE_ITEMS.gold_mail,
          UNIQUE_ITEMS.ancient_key
        ];
        const selected = rarePool[Math.floor(Math.random() * rarePool.length)];
        return { ...selected, id: 'u_' + Date.now() + Math.random() };
      }

      // Procedural Item Generation
      const types = ['weapon', 'armor', 'accessory'];
      const type = types[Math.floor(Math.random() * types.length)];
      const names = {
        weapon: ['鋼鉄のブロードソード', '怨嗟のバトルアックス', '暗殺者のダガー', '古代の儀式槍', '戦術のショートソード'],
        armor: ['黒鉄のチェインメイル', 'ルーンの防護ローブ', '深海の鱗鎧', '名も無き騎士の甲冑', '重歩兵の板金鎧'],
        accessory: ['深紅のルビー指輪', '守護の魔導護符', '黒猫の尾チャーム', '強欲のペンダント', '翡翠の印章']
      };
      const icons = { weapon: '⚔️', armor: '🛡️', accessory: '💍' };

      const baseName = names[type][Math.floor(Math.random() * names[type].length)];
      const mult = { Common: 1, Rare: 1.35, Epic: 1.75, Legendary: 2.4, Mythic:3.0, Abyssal:3.6 }[rarity];

      const it = {
        id: 'it_' + Date.now() + Math.random(),
        name: baseName,
        icon: icons[type],
        type: type,
        rarity: rarity,
        desc: ''
      };

      if (type === 'weapon') it.baseAtk = Math.round((6 + floor * 1.5) * mult);
      if (type === 'armor') { it.baseDef = Math.round((2 + floor * 0.8) * mult); it.hp = Math.round(15 * mult); }
      if (type === 'accessory') { it.crit = Math.round(4 * mult); it.goldRate = Math.round(15 * mult); }

      // Random Curse on Legendary
      if (rarity === 'Legendary' && Math.random() < 0.25) {
        it.name = '【呪縛】' + it.name;
        it.isCurse = true;
        it.curseHpDrain = 2;
        if (it.baseAtk) it.baseAtk += 14;
        if (it.baseDef) it.baseDef += 8;
        it.desc = '驚異的性能だが毎階HP-2';
      }

      return it;
    }

    /* ==========================================================================
       EQUIPMENT COMPARISON & VISUAL FEEDBACK (演出強化)
       ========================================================================== */
    function getEquipComparison(item) {
      if (!item || !['weapon', 'armor', 'accessory'].includes(item.type)) return [];
      const current = state.equipped[equipmentSlot(item)];
      const diffs = [];

      if (item.type === 'weapon') {
        const curAtk = current?.baseAtk || 0;
        const newAtk = item.baseAtk || 0;
        const dAtk = newAtk - curAtk;
        diffs.push({
          label: '攻撃力',
          from: curAtk,
          to: newAtk,
          diff: dAtk,
          status: dAtk > 0 ? 'up' : (dAtk < 0 ? 'down' : 'eq')
        });
        if (item.crit || current?.crit) {
          const curC = current?.crit || 0;
          const newC = item.crit || 0;
          const dC = newC - curC;
          diffs.push({ label: '会心率', from: curC + '%', to: newC + '%', diff: dC, status: dC > 0 ? 'up' : (dC < 0 ? 'down' : 'eq') });
        }
      } else if (item.type === 'armor') {
        const curDef = current?.baseDef || 0;
        const newDef = item.baseDef || 0;
        const dDef = newDef - curDef;
        diffs.push({
          label: '防御力',
          from: curDef,
          to: newDef,
          diff: dDef,
          status: dDef > 0 ? 'up' : (dDef < 0 ? 'down' : 'eq')
        });
        if (item.hp || current?.hp) {
          const curH = current?.hp || 0;
          const newH = item.hp || 0;
          const dH = newH - curH;
          diffs.push({ label: '最大HP', from: '+' + curH, to: '+' + newH, diff: dH, status: dH > 0 ? 'up' : (dH < 0 ? 'down' : 'eq') });
        }
      } else if (item.type === 'accessory') {
        if (item.baseAtk || current?.baseAtk) {
          const curA = current?.baseAtk || 0;
          const newA = item.baseAtk || 0;
          const dA = newA - curA;
          diffs.push({ label: '攻撃力', from: curA, to: newA, diff: dA, status: dA > 0 ? 'up' : (dA < 0 ? 'down' : 'eq') });
        }
        if (item.crit || current?.crit) {
          const curC = current?.crit || 0;
          const newC = item.crit || 0;
          const dC = newC - curC;
          diffs.push({ label: '会心率', from: curC + '%', to: newC + '%', diff: dC, status: dC > 0 ? 'up' : (dC < 0 ? 'down' : 'eq') });
        }
        if (item.goldRate || current?.goldRate) {
          const curG = current?.goldRate || 0;
          const newG = item.goldRate || 0;
          const dG = newG - curG;
          diffs.push({ label: '獲得金', from: '+' + curG + '%', to: '+' + newG + '%', diff: dG, status: dG > 0 ? 'up' : (dG < 0 ? 'down' : 'eq') });
        }
        if (item.hp || current?.hp) {
          const curH = current?.hp || 0;
          const newH = item.hp || 0;
          const dH = newH - curH;
          diffs.push({ label: 'HP', from: '+' + curH, to: '+' + newH, diff: dH, status: dH > 0 ? 'up' : (dH < 0 ? 'down' : 'eq') });
        }
      }
      return diffs;
    }

    function getItemStatSummary(item) {
      if (!item) return '';
      const parts = [];
      if (item.baseAtk) parts.push(`攻+${item.baseAtk}`);
      if (item.baseDef) parts.push(`防+${item.baseDef}`);
      if (item.hp) parts.push(`HP+${item.hp}`);
      if (item.crit) parts.push(`会心+${item.crit}%`);
      if (item.goldRate) parts.push(`金+${item.goldRate}%`);
      if (item.desc) parts.push(item.desc);
      return parts.join(' / ') || '特殊効果';
    }

    function showItemToast(item) {
      const container = document.getElementById('item-toast-container');
      if (!container) return;

      // Audio by rarity
      if (item.rarity === 'Epic') playSound('item_epic');
      else if (item.rarity === 'Rare') playSound('item_rare');
      else playSound('item_common');

      // Stat differences
      const diffs = getEquipComparison(item);
      let diffHtml = '';
      if (diffs.length > 0) {
        diffHtml = `
          <div class="item-toast-diff">
            ${diffs.map(d => `
              <span class="diff-${d.status}">
                ${d.label}: ${d.from} → ${d.to} ${d.status === 'up' ? '↑' : (d.status === 'down' ? '↓' : '')}
              </span>
            `).join('')}
          </div>
        `;
      } else if (item.desc || item.type === 'potion') {
        const sub = item.desc || (item.heal ? `HP +${item.heal} 回復薬` : '');
        if (sub) diffHtml = `<div class="item-toast-diff" style="color:#cbd5e1;">${sub}</div>`;
      }

      const toast = document.createElement('div');
      toast.className = `item-toast r-${item.rarity}`;
      toast.innerHTML = `
        <div class="item-toast-header">
          <div class="item-toast-title">
            <span style="font-size:18px;">${item.icon}</span>
            <span>${item.name} GET！</span>
          </div>
          <span class="item-toast-badge badge-${item.rarity}">${item.rarity}</span>
        </div>
        ${diffHtml}
      `;

      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 1500);
    }

    function spawnFloatingFx(text, type = 'info', x = 50, y = null) {
      const layer = document.getElementById('floating-fx-layer');
      if (!layer) return;

      const el = document.createElement('div');
      el.className = `flying-fx flying-${type}`;
      el.textContent = text;

      const top = (y !== null) ? y : 36 + (Math.random() * 10 - 5);
      el.style.left = x + '%';
      el.style.top = top + '%';

      layer.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 950);
    }

    function giveItemToBag(item) {
      normalizeEquipment(item);
      const wasUnknown = !state.codex.items[item.name];
      if (item.rarity === 'Mythic' || item.rarity === 'Abyssal') item.locked = true;
      recordCodex('item', item);
      state.inventory.push(item);
      if (item.key === 'ancient_key') state.mystery.keyOwned = true;
      if (wasUnknown && (item.rarity === 'Mythic' || item.rarity === 'Abyssal')) {
        state.rarityProgress.upperDropHistory.unshift({
          rarity:item.rarity, itemName:item.name, date:new Date().toISOString(), floor:state.floor,
          source:item.dropSource || (state.currentEnemy?.isElite ? 'Elite' : state.currentEnemy?.isBoss ? 'Boss' : '探索'),
          greed:state.greedLevel || 0
        });
        state.rarityProgress.upperDropHistory = state.rarityProgress.upperDropHistory.slice(0, 30);
        saveState();
      }

      // Flash bag tab animation
      const bagTab = document.getElementById('tab-btn-bag');
      if (bagTab) {
        bagTab.classList.remove('tab-flash');
        void bagTab.offsetWidth;
        bagTab.classList.add('tab-flash');
      }

      if (item.rarity === 'Mythic' || item.rarity === 'Abyssal') {
        showUpperRarityDiscoveryModal(item, wasUnknown);
      } else if (item.rarity === 'Legendary') {
        showLegendaryDiscoveryModal(item);
      } else {
        showItemToast(item);
        addLog(`戦利品【${item.name}】(${item.rarity}) を獲得！`, 'gold');
      }
      updateHeader();
    }

    function getUnclaimedLootBarHtml() {

      const valuableItems = state.inventory.filter(i => ['Rare', 'Epic', 'Legendary'].includes(i.rarity));

      return `
        <div class="unclaimed-loot-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:900; color:#fff; font-size:12px; display:flex; align-items:center; gap:6px;">

    function openChestEvent(isCursed = false) {
      if (isCursed) {

        const item = generateItem(state.floor, null, 'cursed_chest');
        const hpCost = Math.round(state.maxHp * 0.15);
        state.hp = Math.max(1, state.hp - hpCost);
        state.maxHp = Math.max(20, state.maxHp - hpCost);

        playSound('player_hurt');
        spawnFloatingFx(`👁️ 呪縛！ -${hpCost} MaxHP`, 'danger');
        giveItemToBag(item);
        addLog(`呪いの宝箱を開封！ 代償として最大HP -${hpCost} (強力な武具を獲得)`, 'danger');
        state.floor++;
        setTimeout(() => generateDoorsForFloor(), 500);
        return;
      }

      // If player has Discern Eye talent (Lv >= 1), offer a choice between 2 items!

    function upgradeCampFacility(fac) {
      performFacilityUpgrade(fac);
    }

    function upgradeVault() {
      performFacilityUpgrade('vault');
    }

    function performFacilityUpgrade(type) {
      initAudio();
      const cfg = FACILITY_CONFIG[type];
      const cost = getFacilityUpgradeCost(type);
      const crystalCost = getFacilityCrystalCost(type);
      if (!cfg || cost === null) { addLog('この施設はMAXです。','info'); render(); return false; }
      if (state.vaultGold < cost || state.deepCrystals < crystalCost) {
        addLog(`強化資源不足：必要 ${cost}G${crystalCost ? ` / 深層結晶${crystalCost}` : ''}（地上保管G ${state.vaultGold}）`, 'danger');
        render(); return false;
      }
      state.vaultGold -= cost;
      state.deepCrystals -= crystalCost;
      if (type === 'vault') { state.camp.vaultLevel += 1; state.camp.vaultSize += 10; }
      else state.camp[type] += 1;
      const newLevel = type === 'vault' ? state.camp.vaultLevel : state.camp[type];
      playSound('heal');
      addLog(`${cfg.icon} ${cfg.name}をLv.${newLevel}へ強化！`, 'gold');
      saveState(); updateHeader(); render();
      showFacilityUpgradeModal(type, newLevel);
      return true;
    }

    function showFacilityUpgradeModal(type, level) {
      const cfg = FACILITY_CONFIG[type];
      const unlock = type === 'vault' ? `倉庫容量が${state.camp.vaultSize}枠になりました！` : `${cfg.unlocks[level - 1]}が解放されました！`;
      const m = document.getElementById('modal-layer'); m.style.display='flex'; m.className='legendary-modal';
      m.innerHTML=`<div class="card" style="max-width:430px;width:100%;border:2px solid #fbbf24;padding:22px;text-align:center;"><div style="font-size:36px;">🏗️</div><div style="font-size:11px;letter-spacing:2px;color:#fbbf24;">FACILITY UPGRADED</div><h2 style="color:#fff;margin:8px;">${cfg.icon} ${cfg.name} Lv.${level}</h2><p style="color:#cbd5e1;font-size:13px;">${unlock}</p><button class="btn btn-gold" style="margin-top:14px;" onclick="closeGenericModal()">確認</button></div>`;
    }

    function upgradeTalent(key) {
      initAudio();
      const cost = getTalentCost(key);
      const cfg = TALENT_CONFIG[key];
      if (cost === null) {
        addLog(`【${cfg ? cfg.name : key}】はすでに最大レベルです！`, 'info');
        render();
        return;
      }
      if (state.vaultGold < cost) {
        addLog(`ゴールド不足！ 必要: ${cost}G (所持: ${state.vaultGold}G)`, 'danger');
        render();
        return;
      }
      state.vaultGold -= cost;
      state.talents[key] = (state.talents[key] || 0) + 1;
      playSound('heal');
      addLog(`神殿の永久加護【${cfg ? cfg.name : key}】を Lv.${state.talents[key]} に強化しました！`, 'gold');
      saveState();
      updateHeader();
      render();
    }

    function refineEquippedItem(slot) {
      return refineEquipmentItem(state.equipped[slot], slot);
    }

    function refineEquipmentItem(item, slot) {
      initAudio();
      if (!item) {
        addLog('鍛え直す装備を身に着けていません！', 'danger');
        render();
        return;
      }
      const cost = getRefineCost(item);
      if ((Number(item.refineCount) || 0) >= 10) { addLog('装備強化は+10でMAXです。', 'info'); render(); return; }
      if (state.vaultGold < cost) {
        addLog(`ゴールドが不足しています！ 必要: ${cost}G (所持: ${state.vaultGold}G)`, 'danger');
        render();
        return;
      }
      state.vaultGold -= cost;
      item.refineCount = (Number(item.refineCount) || 0) + 1;
      if (slot === 'weapon') {
        item.baseAtk = (item.baseAtk || 0) + 3;
        item.name = item.name.replace(/\(\+\d+\)/, '') + `(+${item.refineCount})`;
        playSound('crit');
        spawnFloatingFx(`🔨 武器強化 +3攻！`, 'crit');
        addLog(`鍛冶屋の技により【${item.name}】を鍛え直した！ 攻撃力+3 (強化+${item.refineCount})`, 'gold');
      } else if (slot === 'armor') {
        item.baseDef = (item.baseDef || 0) + 2;
        item.hp = (item.hp || 0) + 10;

    function openAffixModal(slot) {
      if (state.camp.blacksmith < 3) return;
      const item = state.equipped[slot];
      if (!item || item.affix) return;
      const cost = 150;
      const m = document.getElementById('modal-layer');
      m.style.display = 'flex'; m.className = 'legendary-modal';
      m.innerHTML = `<div class="card" style="max-width:430px;width:100%;border:2px solid #f59e0b;padding:18px;">

        <div style="display:flex;flex-direction:column;gap:7px;margin:12px 0;">${EQUIPMENT_AFFIXES[slot].map(a => `<button class="btn btn-sub" onclick="applyEquipmentAffix('${slot}','${a.key}')"><b>${a.name}</b>：${a.desc}</button>`).join('')}</div>
        <button class="btn btn-outline" onclick="closeGenericModal()">閉じる</button>
      </div>`;
    }

    function applyEquipmentAffix(slot, affixKey) {
      const item = state.equipped[slot];
      const affix = EQUIPMENT_AFFIXES[slot]?.find(a => a.key === affixKey);
      const cost = 150;
      if (!item || item.affix || !affix || state.vaultGold < cost) {
        addLog(state.vaultGold < cost ? `ゴールド不足！ 必要: ${cost}G` : '特性を付与できません。', 'danger');
        closeGenericModal(); render(); return;
      }
      state.vaultGold -= cost;
      item.affix = affix.key; item.affixName = affix.name;
      item.desc = `${item.desc || ''} 【${affix.name}: ${affix.desc}】`.trim();
      addLog(`🔨 ${item.name}に特性【${affix.name}】を付与した！`, 'gold');
      saveState(); closeGenericModal(); render();
    }

    function rerollEquipmentAffix(slot) {
      const item=state.equipped[slot]; if(!item||!item.affix||state.camp.blacksmith<4)return;
      if(state.vaultGold<120||state.deepCrystals<1){addLog('再抽選には120Gと深層結晶1が必要','danger');render();return;}
      const pool=EQUIPMENT_AFFIXES[slot].filter(a=>a.key!==item.affix);const next=pool[Math.floor(Math.random()*pool.length)];
      state.vaultGold-=120;state.deepCrystals--;item.affix=next.key;item.affixName=next.name;item.desc=`${item.desc.split(' 【')[0]} 【${next.name}: ${next.desc}】`;
      addLog(`🎲 特性を【${next.name}】へ再抽選した`,'gold');saveState();render();
    }

    function enhanceHighRarity(slot) {
      const item=state.equipped[slot];if(!item||!['Mythic','Abyssal'].includes(item.rarity)||state.camp.blacksmith<5)return;
      if(item.highEnhanced){addLog('この高位装備は強化済み','info');return;}
      if(state.vaultGold<400||state.deepCrystals<3){addLog('高位強化には400Gと深層結晶3が必要','danger');render();return;}
      state.vaultGold-=400;state.deepCrystals-=3;item.highEnhanced=true;if(item.baseAtk)item.baseAtk+=6;if(item.baseDef)item.baseDef+=5;if(item.hp)item.hp+=20;
      item.desc+=' 【高位共鳴強化済み】';addLog(`💠 ${item.name}の固有能力が共鳴した`,'gold');saveState();render();

    function buyExpeditionSupply(type) {
      initAudio();
      if (type === 'potion') {

        if (state.vaultGold < cost) {
          addLog(`ゴールド不足！ 必要: ${cost}G`, 'danger');
          render();
          return;
        }
        state.preparedItems = state.preparedItems || [];

          return;

          heal: 40,
          rarity: 'Common',
          healPercent:10, desc: 'HP40 + 最大HP10%回復 (探索持込)'
        });

        spawnFloatingFx('🧪 傷薬を出撃準備！', 'info');
        addLog(`探索用の特製傷薬を購入！出撃準備完了 (持込: ${currentPots + 1}/${carryLimit}個)`, 'gold');
      } else if (type === 'charm') {
        const cost = 45;
        if (state.vaultGold < cost) {
          addLog(`ゴールド不足！ 必要: ${cost}G`, 'danger');
          render();
          return;
        }
        state.preparedBuffs = state.preparedBuffs || { chestRareBonus: 0, goldMult: 1.0 };

          addLog('幸運護符の効果は最大3枚分(+45%)まで重複可能です！', 'info');
          render();
          return;
        }
        state.vaultGold -= cost;
        state.preparedBuffs.chestRareBonus = (state.preparedBuffs.chestRareBonus || 0) + 15;
        playSound('gold');
        spawnFloatingFx('🍀 幸運護符 出撃準備！', 'gold');
        addLog(`幸運の護符を購入！次の探索で宝箱レア率 +${state.preparedBuffs.chestRareBonus}%`, 'gold');
      } else if (type === 'smoke' || type === 'antidote' || type === 'greater') {
        const defs={smoke:{cost:60,item:{name:'携帯煙玉',icon:'💨',type:'escape_item',rarity:'Rare',desc:'通常戦闘から即時離脱'}},antidote:{cost:40,item:{name:'万能解毒薬',icon:'💊',type:'potion',heal:10,cureAll:true,rarity:'Rare',desc:'状態異常を全解除しHP10回復'}},greater:{cost:90,item:{name:'上級傷薬',icon:'🧴',type:'potion',heal:0,healPercent:30,rarity:'Epic',desc:'最大HP30%回復'}}};
        const def=defs[type]; if(state.vaultGold<def.cost){addLog(`ゴールド不足！ 必要:${def.cost}G`,'danger');render();return;}
        state.vaultGold-=def.cost;state.preparedItems.push({...def.item,id:`prep_${type}_${Date.now()}_${Math.random()}`});addLog(`${def.item.name}を出撃準備へ追加`,'gold');
      }
      saveState();
      updateHeader();
      render();
    }

    function setExpeditionPolicy(policy) {
      initAudio();
      playSound('click');
      state.expeditionPolicy = policy;
      saveState();
      render();
    }

    function selectStarterPerk(perk) {
      state.starterPerk = perk;

    function selectStartFloor(floor) {
      if(floor>state.maxUnlockedFloor||floor>MAX_DUNGEON_FLOOR)return;state.selectedStartFloor=floor;saveState();render();
    }

    function getItemSellPrice(item) {
      if (!item) return 0;
      const basePrices = { Common: 15, Rare: 45, Epic: 120, Legendary: 320, Mythic: 1200, Abyssal: 5000 };
      let price = basePrices[item.rarity] || 15;
      if (item.refineCount) price += item.refineCount * 30;
      return price;
    }

    function toggleLockItem(index, isVault = true) {
      initAudio();
      playSound('click');
      const list = isVault ? state.storage : state.inventory;
      if (list[index]) {
        list[index].locked = !list[index].locked;
        saveState();
        renderSubPanel();
      }
    }

    function canSellStoredItem(item) {
      return !!item && !item.locked && !equipmentOwner(item);
    }

    let storageCategory = 'all';
    function setStorageCategory(category) { storageCategory = category; renderSubPanel(); }
    function getStorageRows(list, filter = 'all', rarity = null, tag = null) {
      const rows = [];
      list.forEach((it, idx) => {
        const category = ['weapon','armor','accessory'].includes(it.type) ? equipmentSlot(it) : it.type==='material'?'material':['potion','escape_item','consumable'].includes(it.type) ? 'consumable' : 'other';
        if(rarity&&it.rarity!==rarity)return;
        if(tag&&!(it.tags||[]).includes(tag))return;
        if (filter !== 'all' && category !== filter) return;
        const existing = it.type === 'material' && rows.find(r => r.it.type === 'material' && (r.it.key || r.it.name) === (it.key || it.name) && !!r.it.locked === !!it.locked);
        if (existing) existing.count++;
        else rows.push({it, idx, count:1});
      });
      return rows;
    }
    function getTavernReward() {
      return Math.round(Math.max(0, Math.min(1000, Number(state.bounty?.rewardGold) || 150)) * (state.expeditionPolicy === 'bounty' ? 1.5 : 1));
    }

    function sellItemFromStorage(index) {
      initAudio();
      const item = state.storage[index];
      if (!item) return;
      if (!canSellStoredItem(item)) {
        addLog('🔒 ロックされているアイテムは売却できません！先にロックを解除してください。', 'danger');
        render();
        return;
      }
      if (['Legendary','Mythic','Abyssal'].includes(item.rarity) && !window.confirm(`【${item.name}】を売却しますか？ この操作は取り消せません。`)) return;
      const price = getItemSellPrice(item);
      state.vaultGold += price;
      state.storage.splice(index, 1);
      playSound('gold');
      spawnFloatingFx(`+${price}G`, 'gold');
      addLog(`【${item.name}】を売却し、${price}G を獲得しました。`, 'gold');
      saveState();
      updateHeader();
      renderSubPanel();
    }

    function bulkSellStorage(maxRarity = 'Common') {
      initAudio();
      const allowedRarities = {Common:['Common'],Rare:['Common','Rare'],Epic:['Common','Rare','Epic']}[maxRarity] || [];
      let soldCount = 0;
      let totalEarned = 0;

      for (let i = state.storage.length - 1; i >= 0; i--) {
        const item = state.storage[i];
        if (allowedRarities.includes(item.rarity) && canSellStoredItem(item)) {
          const price = getItemSellPrice(item);
          totalEarned += price;
          soldCount++;
          state.storage.splice(i, 1);
        }
      }

      if (soldCount === 0) {
        addLog(`一括売却対象となる未ロックの ${maxRarity === 'Common' ? 'Common' : 'Rare以下'} アイテムはありません。`, 'info');
        render();
        return;
      }

      state.vaultGold += totalEarned;
      playSound('gold');
      spawnFloatingFx(`💰 一括売却 +${totalEarned}G`, 'gold');
      addLog(`【一括売却】${soldCount}個のアイテムを売却し、合計 ${totalEarned}G を獲得しました！`, 'gold');
      saveState();
      updateHeader();
      renderSubPanel();
    }

    function sortStorage(criteria = 'rarity') {
      initAudio();
      playSound('click');
      const rarityRank = { Abyssal: 6, Mythic: 5, Legendary: 4, Epic: 3, Rare: 2, Common: 1 };
      const typeRank = { weapon: 1, armor: 2, accessory: 3, potion: 4, relic: 5 };

      state.storage.sort((a, b) => {
        if (criteria === 'rarity') {
          const diff = (rarityRank[b.rarity] || 0) - (rarityRank[a.rarity] || 0);
          if (diff !== 0) return diff;
          return (b.baseAtk || b.baseDef || 0) - (a.baseAtk || a.baseDef || 0);
        } else if (criteria === 'atk') {
          return (b.baseAtk || 0) - (a.baseAtk || 0);
        } else if (criteria === 'def') {
          return (b.baseDef || 0) - (a.baseDef || 0);
        } else if (criteria === 'type') {
          return (typeRank[a.type] || 99) - (typeRank[b.type] || 99);
        }
        return 0;
      });

      addLog(`倉庫のアイテムを【${criteria === 'rarity' ? 'レア度順' : (criteria === 'atk' ? '攻撃力順' : (criteria === 'def' ? '防御力順' : '種別順'))}】に並べ替えました。`, 'normal');
      saveState();
      renderSubPanel();
    }

    function claimTavernBounty() {
      initAudio();
      if (state.camp.tavern < 2 || !state.bounty || !state.bounty.completed) return;
      const reward = getTavernReward();
      state.vaultGold += reward;
      playSound('gold');
      spawnFloatingFx(`💰 討伐達成 +${reward}G`, 'gold');
      addLog(`冒険者の酒場で賞金首の報酬 +${reward}G を受け取った！ 新たな依頼が張り出された。`, 'gold');

      // Setup next bounty
      const nextKills = Math.min(30, (Number(state.bounty.targetKills) || 5) + 3);
      const nextGold = Math.min(1000, Math.round(Math.min(1000, Number(state.bounty.rewardGold) || 150) * 1.35));
      state.bounty = {
        targetKills: nextKills,
        currentKills: 0,
        rewardGold: nextGold,
        completed: false
      };
      saveState();
      updateHeader();
      render();
    }

    function selectTavernContract(type) {
      if (state.camp.tavern < 4) return;
      const defs={short:{targetKills:5,rewardGold:180,label:'短期討伐'},elite:{targetKills:10,rewardGold:420,label:'Elite掃討'},boss:{targetKills:18,rewardGold:850,label:'深層賞金首'}};
      if(type==='boss'&&state.camp.tavern<5)return;
      state.bounty={...defs[type],currentKills:0,completed:false,type};
      addLog(`📜 ${defs[type].label}を受注した`,'gold');saveState();render();
    }

    function equipItem(index, fromVault = false, accessorySlot = null) {
      initAudio();
      playSound('click');
      const list = fromVault ? state.storage : state.inventory;
      const item = list[index];
      if (!item || !['weapon', 'armor', 'accessory'].includes(item.type)) return;
      if (equipmentOwner(item)) return;

      normalizeEquipment(item);
      const slot = item.type==='accessory' ? (accessorySlot==='accessory2'?'accessory2':accessorySlot==='accessory'?'accessory':!state.equipped.accessory?'accessory':!state.equipped.accessory2?'accessory2':'accessory') : equipmentSlot(item);
      const oldEquip = state.equipped[slot];

      state.equipped[slot] = item;
      list.splice(index, 1);
      if (oldEquip) list.push(oldEquip);

      saveState();
      updateHeader();
      render();
    }

    function usePotion(index) {
      initAudio();
      const item = state.inventory[index];
      if (!item || item.type !== 'potion') return;

      const stats = getPlayerStats();
      const amount=(item.heal||0)+Math.round(stats.maxHp*(item.healPercent||0)/100);
      const healed = Math.min(stats.maxHp - state.hp, amount);
      state.hp += healed;
      if(item.cureAll) clearPlayerStatuses();
      playSound('heal');
      addLog(`${item.name} を服用。HP +${healed} 回復！`, 'heal');
      state.inventory.splice(index, 1);
      updateHeader();
      render();
    }

    function setTab(tab) {
      initAudio();
      playSound('click');
      state.activeTab = tab;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tab);
      if (activeBtn) activeBtn.classList.add('active');
      renderSubPanel();

    function updateHeader() {
      const stats = getPlayerStats();
      const inDungeon = (state.floor > 0);

      document.getElementById('ui-floor-icon').textContent = inDungeon ? '🪜' : '🏕️';
      document.getElementById('ui-floor-name').textContent = inDungeon ? `B${state.floor}F` : '地上 拠点';
      
      const area = inDungeon ? getCurrentArea() : null;
      document.getElementById('ui-area-tag').textContent = inDungeon ? area.tag : '生存者の野営地';

      // HP & Low-HP Danger Visuals (HP < 30% ピンチ演出)
      const hpPct = Math.max(0, Math.min(100, (state.hp / stats.maxHp) * 100));
      const isCriticalHp = inDungeon && (hpPct <= 30);

      // Danger Vignette
      const vignette = document.getElementById('danger-vignette');
      if (vignette) {
        vignette.style.display = isCriticalHp ? 'block' : 'none';
      }

      // HP bar fill
      const hpBar = document.getElementById('ui-hp-bar');
      if (hpBar) {
        hpBar.style.width = hpPct + '%';
        if (isCriticalHp) {
          hpBar.classList.add('hp-critical');
        } else {
          hpBar.classList.remove('hp-critical');
        }
      }

      // HP Text
      const hpText = document.getElementById('ui-hp-text');
      if (hpText) {
        hpText.innerHTML = isCriticalHp
          ? `<span style="color:#ef4444; font-weight:900; animation:glowPulse 0.8s infinite;">⚠ 瀕死！ ${Math.round(state.hp)} / ${stats.maxHp}</span>`
          : `${Math.round(state.hp)} / ${stats.maxHp}`;
      }

      // Goal Nudge (短い目標の常時表示 & 次の安全帰還ポイントまでの階数)
      const nudge = document.getElementById('ui-goal-nudge');
      if (inDungeon) {
        const nextSafe = getNextSafeFloor();
        const remain = nextSafe===null?null:nextSafe-state.floor;
        if(nextSafe===null){nudge.textContent='現在の最深部：次の帰還門はありません';nudge.className='goal-nudge';}
        else if (isCriticalHp) {
          nudge.innerHTML = `🚨 瀕死！ 5F帰還門まで: <b style="color:#fff; font-size:12px;">あと${remain}階</b> 耐え抜け！`;
          nudge.className = 'goal-nudge critical-nudge';
        } else if (isBossFloor(state.floor)) {
          nudge.textContent = `💀 BOSS FLOOR: 決死の戦い！`;
          nudge.className = 'goal-nudge';
        } else if (remain === 0) {
          nudge.textContent = `🏰 帰還転移門 到達！ 完全生還可能！`;
          nudge.className = 'goal-nudge';
        } else {
          nudge.textContent = `🎯 5F安全帰還まで: あと${remain}階`;
          nudge.className = 'goal-nudge';
        }
      } else {
        const nextUpgradeCost = (state.talents.hpLv + 1) * 80;
        nudge.textContent = `🪙 強化まで: あと${Math.max(0, nextUpgradeCost - state.vaultGold)}G`;
        nudge.className = 'goal-nudge';
      }

      // Stats
      document.getElementById('ui-atk').textContent = stats.atk;
      document.getElementById('ui-def').textContent = stats.def;
      document.getElementById('ui-crit').textContent = stats.crit + '%';
      document.getElementById('ui-gold').textContent = inDungeon ? state.dungeonGold : state.vaultGold;
      document.getElementById('ui-gold-label').textContent = inDungeon ? '🪙 未保管G' : '🏦 地上保管G';
      document.getElementById('ui-core').textContent = state.abyssCores;

      // Badges
      document.getElementById('ui-bag-count').textContent = state.inventory.length;

      // Codex count
      const totalCodexKnown = Object.keys(state.codex.items).length + Object.keys(state.codex.enemies).length;
      document.getElementById('ui-codex-pct').textContent = `${totalCodexKnown}種`;
    }

        ${state.camp.lab >= 4 && state.rarityProgress.abyssalPity >= 800 ? '<div style="color:#67e8f9;">🌌 深淵の鼓動が近い…</div>' : ''}

    function render() {
      updateHeader();
      const vp = document.getElementById('viewport');

      // VIEW: TOWN / BASE CAMP

        const currentPolicy = state.expeditionPolicy || 'normal';

        const policies = [
          { key: 'normal', name: '🧭 通常', desc: '均整型 (標準探索)' },

          { key: 'bounty', name: '⚔️ 討伐', desc: 'エリート+35% / 依頼報酬+50%' },

            ${p.name}
          </button>
        `).join('');

        const selectedPolicyObj = policies.find(p => p.key === currentPolicy) || policies[0];

        vp.innerHTML = `
          ${townShortcutsHtml()}
          <div id="town-expedition" class="card" style="text-align:center; background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a);">
            <div style="font-size:36px; margin-bottom:4px;">🏕️</div>
            <h2 style="font-size:18px; font-weight:900; color:#fff;">生存者の野営キャンプ</h2>
            <div style="font-size:10px;color:#64748b;margin-bottom:3px;">Version ${GAME_VERSION}</div>
            <div style="font-size:11px;color:#cbd5e1;margin-bottom:7px;">🏆 最高到達 B${state.deepestFloorReached}F / 解放 B${state.maxUnlockedFloor}F　⚔️最多討伐 ${state.runRecords.mostKills}　🔥最高GREED ${state.runRecords.highestGreed}　💰最多未保管G ${state.runRecords.mostGold}</div>
            <p style="font-size:12px; color:#94a3b8; margin-bottom:10px;">深淵から生還した者だけがこの拠点を発展させられる。</p>
            
            <!-- Expedition Policy Selection -->
            <div style="background:rgba(0,0,0,0.4); padding:8px; border-radius:6px; margin-bottom:10px;">
              <div style="font-size:11px; color:#cbd5e1; display:flex; justify-content:space-between; margin-bottom:4px;">
                <span>🧭 探索方針の選択:</span>
                <span style="color:var(--gold); font-weight:bold;">${selectedPolicyObj.desc}</span>
              </div>
              <div style="display:flex; gap:4px;">
                ${policyButtons}
              </div>
            </div>

            <div style="background:rgba(0,0,0,0.4);padding:8px;border-radius:6px;margin-bottom:10px;">
              <div style="font-size:11px;color:#cbd5e1;margin-bottom:5px;">🎒 出撃前支援を1つ選択:</div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;">
                ${[
                  ['potion','🧪 特製薬酒','HP60回復薬'],

                  ['luck','🍀 幸運の護符','宝箱レア率+25%']

            </div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;align-items:center;font-size:10.5px;color:#94a3b8;"><span>開始地点:</span>${[1,...BOSS_FLOORS.map(f=>f+1)].filter(f=>f<=state.maxUnlockedFloor&&f<=MAX_DUNGEON_FLOOR).map(f=>`<button class="btn ${state.selectedStartFloor===f?'btn-gold':'btn-sub'} btn-xs" onclick="selectStartFloor(${f})">B${f}F</button>`).join('')}</div>

            <button class="btn btn-gold" style="font-size:16px; padding:14px; width:100%;" ${state.starterPerk ? '' : 'disabled'} onclick="startDungeonRun()">

              <span style="font-size:11px; color:var(--muted);">🏦 地上保管G: ${state.vaultGold} / 核: ${state.abyssCores} / 結晶: ${state.deepCrystals}</span>

            <div class="town-facilities">
              <!-- Blacksmith -->

                ${state.camp.blacksmith >= 2 ? `

                    <button class="btn btn-gold btn-xs" style="flex:1;" onclick="buyExpeditionSupply('charm')">🍀 幸運護符 (45G)</button>
                  </div>
                  ${state.camp.shop >= 4 ? `<div style="display:flex;gap:4px;width:100%;"><button class="btn btn-sub btn-xs" style="flex:1" onclick="buyExpeditionSupply('smoke')">💨 煙玉 60G</button><button class="btn btn-sub btn-xs" style="flex:1" onclick="buyExpeditionSupply('antidote')">💊 解毒薬 40G</button></div>`:''}
                  ${state.camp.shop >= 5 ? `<button class="btn btn-purple btn-xs" style="width:100%" onclick="buyExpeditionSupply('greater')">🧴 上級傷薬 90G</button>`:''}

                <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                  <div style="font-size:12px; font-weight:bold; color:#fff;">📦 倉庫 Lv.${state.camp.vaultLevel} (${state.camp.vaultSize}枠)</div>
                  <button class="btn btn-sub btn-xs" ${isFacilityUpgradeDisabled('vault') ? 'disabled' : ''} onclick="upgradeVault()">${getFacilityButtonText('vault')}</button>
                </div>
                <div style="font-size:10.5px; color:#94a3b8;">容量+10枠 / 未持ち帰り防止</div>
              </div>

              <!-- Tavern -->
              <div id="town-tavern" class="item-row" style="flex-direction:column; align-items:flex-start; gap:4px;">
                <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                  <div style="font-size:12px; font-weight:bold; color:#fff;">🍺 冒険者の酒場 Lv.${state.camp.tavern}</div>
                  <button class="btn btn-sub btn-xs" ${isFacilityUpgradeDisabled('tavern') ? 'disabled' : ''} onclick="upgradeCampFacility('tavern')">${getFacilityButtonText('tavern')}</button>
                </div>
                <div style="font-size:10.5px; color:#e2e8f0; width:100%;">
                  ${state.camp.tavern < 2 ? `<div style="color:#94a3b8;padding:5px;">🔒 酒場Lv2で討伐依頼を解放</div>` : state.bounty ? `
                    <div style="background:rgba(0,0,0,0.3); padding:4px 6px; border-radius:4px; margin-top:2px;">
                      <div style="display:flex; justify-content:space-between; font-size:10.5px;">
                        <span>📜 討伐依頼: 魔物${state.bounty.targetKills}体</span>
                        <b style="color:var(--gold);">${state.bounty.currentKills}/${state.bounty.targetKills}</b>
                      </div>
                      ${state.bounty.completed ? `
                        <button class="btn btn-gold btn-xs" style="width:100%; margin-top:4px; padding:3px;" onclick="claimTavernBounty()">
                          🎉 達成！ 報酬 +${getTavernReward()}G を受取
                        </button>
                      ` : `
                        <div style="font-size:10px; color:#94a3b8; margin-top:2px;">達成報酬: ${getTavernReward()}G（最大1500G）</div>
                      `}
                      ${state.camp.tavern >= 4 && !state.bounty.completed ? `<div style="display:flex;gap:3px;margin-top:4px;"><button class="btn btn-sub btn-xs" onclick="selectTavernContract('short')">短期</button><button class="btn btn-sub btn-xs" onclick="selectTavernContract('elite')">Elite</button>${state.camp.tavern>=5?`<button class="btn btn-purple btn-xs" onclick="selectTavernContract('boss')">賞金首</button>`:''}</div>`:''}
                    </div>
                  ` : ''}
                </div>
              </div>

              <!-- Laboratory -->
              <div id="town-lab" class="item-row" style="grid-column:1 / -1;flex-direction:column;align-items:flex-start;gap:4px;">
                <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
                  <div style="font-size:12px;font-weight:bold;color:#fff;">🔬 深淵研究所 Lv.${state.camp.lab}</div>
                  <button class="btn btn-sub btn-xs" ${isFacilityUpgradeDisabled('lab') ? 'disabled' : ''} onclick="upgradeCampFacility('lab')">${getFacilityButtonText('lab')}</button>
                </div>
                <div style="font-size:10.5px;color:#cbd5e1;line-height:1.5;">
                  Lv1 敵図鑑詳細${state.camp.lab >= 2 ? ' / Lv2 次ボス能力解析' : ''}${state.camp.lab >= 3 ? ' / Lv3 ボス最大HP-15%' : ''}${state.camp.lab >= 4 ? ' / Lv4 部屋危険度予測' : ''}
                </div>
                ${state.camp.lab >= 2 ? getLabBossIntelHtml() : '<div style="font-size:10px;color:#64748b;">Lv2で次ボスのHP・攻撃・特殊能力を表示</div>'}
              </div>
            </div>
          </div>

          <!-- Permanent Upgrades (神殿) -->
          <div class="card">
            <div class="card-title">⛩️ 神殿の永久加護 (死亡時も引き継がれる力)</div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              ${Object.keys(TALENT_CONFIG).map(k => {
                const cfg = TALENT_CONFIG[k];
                const cost = getTalentCost(k);
                const curLv = state.talents[k] || 0;
                const isMax = (cost === null);
                let effectDesc = '';
                if (k === 'hpLv') effectDesc = `初期HP +${curLv * 15}`;
                else if (k === 'atkLv') effectDesc = `初期攻撃力 +${curLv * 3}`;
                else if (k === 'defLv') effectDesc = `初期防御力 +${curLv * 2}`;
                else if (k === 'luckLv') effectDesc = `宝箱レア率 +${curLv * 6}%`;
                else if (k === 'keepItemLv') effectDesc = `死亡時遺品保護: ${curLv}個 (手動選択可)`;
                else if (k === 'discernEyeLv') effectDesc = curLv > 0 ? '宝箱開封時に2品から選択可能' : 'Lv1で宝箱2択鑑定が解放';
                else if (k === 'fateRerollLv') effectDesc = curLv > 0 ? '探索中1回部屋の再選択が可能' : 'Lv1で運命再選択が解放';

                return `
                  <div class="item-row">
                    <div>
                      <div style="font-size:12px; font-weight:bold;">${cfg.name} (Lv.${curLv}${cfg.maxLv ? '/' + cfg.maxLv : ''})</div>
                      <div style="font-size:10.5px; color:#94a3b8;">${effectDesc}</div>
                    </div>
                    <button class="btn ${isMax ? 'btn-sub' : 'btn-gold'} btn-xs" ${isMax ? 'disabled' : ''} onclick="upgradeTalent('${k}')">
                      ${isMax ? '最大強化' : `強化 (${cost}G)`}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // VIEW: SAFE POINT (5階ごとの安全帰還ポイント特別演出画面)
      else if (state.screen === 'safe_point') {
        const area = getCurrentArea();
        const nextBossFloor = getNextBossFloor() || MAX_DUNGEON_FLOOR;
        const bossRemain = nextBossFloor - state.floor;
        const nextAreaIdx = Math.min(AREAS.length-1, Math.floor(state.floor / 10));
        const nextArea = AREAS[nextAreaIdx];

        const lootCount = state.inventory.length;
        const lootGold = state.dungeonGold;
        const valuableItems = state.inventory.filter(i => ['Rare', 'Epic', 'Legendary'].includes(i.rarity));

        vp.innerHTML = `
          <div class="safe-point-banner">
            <div style="font-size:40px; filter:drop-shadow(0 0 16px #fbbf24);">🏰✨</div>
            <div class="safe-point-title">✨ SAFE POINT REACHED ✨</div>
            <div style="font-size:14px; font-weight:900; color:#fff;">【地下 ${state.floor} 階 古代の安全転移門】</div>
            <div style="font-size:12px; color:#cbd5e1; max-width:92%; margin:0 auto; line-height:1.4;">
              この結界空間は深淵の呪力を遮断している。<b style="color:#fbbf24;">全戦利品を完全回収できる安全な帰還地点</b>です。<br>
              ここで生還するか、更なる富と栄光を求めて深淵へ挑むか？
            </div>

            <!-- Current Loot Summary -->
            <div class="safe-point-stat-grid">
              <div class="safe-stat-box">
                <span class="safe-stat-val">🎒 ${lootCount}個</span>
                <span class="safe-stat-lbl">未保管の戦利品</span>
              </div>
              <div class="safe-stat-box">
                <span class="safe-stat-val" style="color:#fbbf24;">🪙 +${lootGold}G</span>
                <span class="safe-stat-lbl">獲得ゴールド</span>
              </div>
              <div class="safe-stat-box">
                <span class="safe-stat-val" style="color:#c084fc;">💎 ${valuableItems.length}個</span>
                <span class="safe-stat-lbl">貴重品 (Rare以上)</span>
              </div>
            </div>

            ${valuableItems.length > 0 ? `
              <div style="background:rgba(0,0,0,0.45); border-radius:6px; padding:6px 10px; font-size:11px; color:#fef08a; display:flex; flex-wrap:wrap; gap:6px; justify-content:center;">
                <span style="font-weight:bold;">所持中の貴重品:</span>
                ${valuableItems.map(v => `<span style="border-bottom:1px solid rgba(254,240,138,0.4);">${v.icon} ${v.name}</span>`).join(', ')}
              </div>
            ` : ''}

            <!-- 2 Huge Decision Buttons -->
            <div style="display:flex; flex-direction:column; gap:10px; width:100%; margin-top:6px;">
              <!-- Choice 1: Return safely -->
              <div class="choice-card-safe" onclick="returnToTown(true)">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-size:15px; font-weight:900; color:#fff;">🏰 安全に帰還する (確実な勝利)</span>
                  <span style="font-size:11px; background:#10b981; color:#fff; padding:2px 8px; border-radius:4px; font-weight:bold;">全アイテム回収</span>
                </div>
                <div style="font-size:11.5px; color:#a7f3d0; line-height:1.4; margin-top:2px;">
                  未保管の戦利品<b>${lootCount}個</b>と<b>${lootGold}G</b>を全て地上倉庫へ持ち帰り、拠点を恒久強化！
                </div>
              </div>

              <!-- Choice 2: Dive deeper (Temptation) -->
              <div class="choice-card-deep" onclick="diveDeeperFromSafePoint()">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-size:15px; font-weight:900; color:#fff;">🔻 さらに地下へ潜る (欲望と挑戦)</span>
                  <span style="font-size:11px; background:#f59e0b; color:#111; padding:2px 8px; border-radius:4px; font-weight:900;">深層ボーナス</span>
                </div>
                <div style="font-size:11.5px; color:#fde68a; line-height:1.4; margin-top:2px;">
                  ✨ <b>深層ボーナス:</b> 宝箱の激レア出現率 <b>+15% UP</b> & 獲得ゴールドUP！<br>
                  💀 <b>階層ボスまで:</b> あと<b>${bossRemain}階</b> (深層エリア: ${nextArea.name})<br>
                  <span style="color:#f87171; font-weight:bold;">⚠️ 途中で力尽きると、今ある未保管品は全て失われます。</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // VIEW: DOOR SELECT (毎階2〜3個の扉・部屋の選択肢)
      else if (state.screen === 'door_select') {
        const area = getCurrentArea();
        let doorsHtml = state.currentDoors.map((d, i) => `
          <div class="door-card danger-${d.risk}" onclick="selectDoor(${i})">
            <div class="door-icon">${d.icon}</div>
            <div class="door-info">
              <div class="door-sign">
                <span>${d.sign}</span>
                <span class="door-risk risk-${d.risk}">${d.riskText}</span>
              </div>
              <div class="door-desc">${d.desc}</div>
            </div>
            <div style="font-size:18px; color:var(--gold);">❯</div>
          </div>
        `).join('');

        vp.innerHTML = `
          ${getUnclaimedLootBarHtml()}
          <div class="scene-box">
            <div class="scene-art">🚪</div>
            <div class="scene-title">地下 ${state.floor} 階: 通路の分岐</div>
            <div class="scene-text">
              暗闇の先から異なる気配が漂っている。どの通路を進むか選択せよ。<br>
              <b style="color:var(--gold);">※安全帰還は5階ごとの転移門のみ可能です。</b>
            </div>
          </div>
          <div class="door-grid">
            ${doorsHtml}
          </div>
        `;
      }

      // VIEW: BATTLE (戦闘)
      else if (state.screen === 'battle') {
        const e = state.currentEnemy;
        const eHpPct = Math.max(0, Math.min(100, (e.hp / e.maxHp) * 100));
        const skillInfo = getEquippedSkillInfo();
        const smokeCount = state.inventory.filter(i => i.type === 'escape_item').length;
        const statusLabels={poison:'☠️ 毒',bleed:'🩸 出血',paralysis:'⚡ 麻痺',bind:'🕸️ 拘束',curse:'🔮 呪い',weakened:'⬇️ 弱体'};

          ${getUnclaimedLootBarHtml()}
          <div class="scene-box">
            <div class="scene-art">${e.icon}</div>
            <div class="scene-title">${e.name}</div>

              ${e.gimmick==='mother_tree' && state.bossAdds>0 ? `<button class="btn btn-green" style="grid-column:1/-1;" onclick="playerCombatAction('attack_roots')">🌿 守護根を破壊（残り${state.bossAdds}）</button>`:''}
              ${e.gimmick==='rising_water' ? `<button class="btn btn-blue" style="grid-column:1/-1;" onclick="playerCombatAction('drain_water')">🚰 排水する（水位${state.waterLevel}%）${state.waterLevel>=70?' 回避-20% / スキルCT+1':''}</button>`:''}

              ${e.isBoss && e.gimmick === 'shield_barrier' && state.bossBarrier ? `

    function getItemStatSummary(it) {
      if (!it) return '';
      let s = [];
      if (it.baseAtk) s.push(`攻+${it.baseAtk}`);
      if (it.baseDef) s.push(`防+${it.baseDef}`);
      if (it.hp) s.push(`HP+${it.hp}`);
      if (it.crit) s.push(`会心+${it.crit}%`);
      if (it.vamp) s.push(`吸血+${it.vamp}`);
      if (it.goldRate) s.push(`金+${it.goldRate}%`);
      if (it.rareRate) s.push(`幸運+${it.rareRate}%`);
      if (it.heal) s.push(`回復+${it.heal}`);
      if (it.affixName) s.push(`特性:${it.affixName}`);
      if (it.bossUnique) s.push('秘宝 / Boss Unique');
      return s.join(' | ') || it.desc;
    }

    function triggerShake() {
      const c = document.getElementById('game-container');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }

              ${data.items.map(i => `<div style="color:#e2e8f0; font-size:11px;">✔ ${i.icon} ${i.name} [${i.rarity}]</div>`).join('') || '<div style="color:#64748b;">なし</div>'}

        <div class="card" style="max-width:440px; width:100%; border:2px solid ${data.isDeath ? '#ef4444' : '#f59e0b'}; text-align:center; padding:18px;">
          <h2 style="font-size:18px; font-weight:900; color:#fff; margin-bottom:4px;">${data.title}</h2>
          <p style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">${data.subtitle}</p>

          <div style="background:rgba(0,0,0,0.5); padding:8px; border-radius:6px; font-size:12px; margin-bottom:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px;">
            <div>到達階層: <b style="color:#fff;">B${state.floor}F</b></div>
            <div>討伐数: <b style="color:#f87171;">${state.runKills}体</b></div>
            ${data.isDeath ? `
              <div style="color:#f87171; grid-column:1 / -1;">失ったゴールド: -${data.lostGold}G</div>
              ${data.keptGold > 0 ? `<div style="color:#4ade80; grid-column:1 / -1;">回収できたゴールド: +${data.keptGold}G</div>` : ''}
            ` : `
              <div style="color:var(--gold); grid-column:1 / -1;">獲得ゴールド: +${data.gold}G</div>
            `}
          </div>

          ${mvpHtml}
          ${itemsDetail}

          <button class="btn btn-gold" style="margin-top:12px;" onclick="closeResultModal()">
            地上拠点へ戻る
          </button>
        </div>
      `;
    }

    function closeResultModal() {
      initAudio();
      playSound('click');
      document.getElementById('modal-layer').style.display = 'none';
      render();
    }

    /* ==========================================================================
       INITIALIZE ON LOAD
       ========================================================================== */
    window.__gameDebug = {
      get state() { return state; },
      AREAS,
      get GAME_VERSION() { return GAME_VERSION; }
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      render();
      if (localStorage.getItem('lastSeenVersion') !== GAME_VERSION) showUpdateNotes(true);
      else checkTutorial();
    });

    window.addEventListener('click', () => {
      initAudio();
    }, { once: true });
  </script>
  <script src="chapter-data.js"></script>
  <script src="crafting.js"></script>
  <script src="equipment.js"></script>
  <script src="depth-rules.js"></script>
  <script src="chapter-story.js"></script>
  <script src="chapter-system.js"></script>
  <script src="companion-equipment.js"></script>
  <script src="forge-ui.js"></script>
</body>
</html>
