<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>地下探索型・持ち帰りローグライト - ABYSS DELVER</title>
  <meta name="description" content="地下100階の迷宮に挑む持ち帰り型ローグライト。生還か、更なる深層か。緊張感あふれるリスクとリターン。" />
  <style>
    /* ==========================================================================
       RESET & THEME
       ========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    :root {
      --bg: #090a0f;
      --panel: rgba(18, 21, 31, 0.95);
      --border: #2e384d;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --gold: #f59e0b;
      --core: #a855f7;
      --hp: #ef4444;
      --hp-bg: #450a0a;
      --atk: #f97316;
      --def: #38bdf8;
      --crit: #ec4899;
      --curse: #a855f7;
      
      --r-common: #94a3b8;
      --r-rare: #38bdf8;
      --r-epic: #c084fc;
      --r-legendary: #fbbf24;
      --r-mythic: #f43f9e;
      --r-abyssal: #22d3ee;
      --r-curse: #f43f5e;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 10%, #1c1524 0%, #08090d 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(12, 14, 20, 0.88);
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      position: relative;
      border-left: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    /* TOP STATUS BAR */
    header#status-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 16, 25, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .floor-badge {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .area-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
    }
    .goal-nudge {
      font-size: 11px;
      color: var(--gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 2px 8px;
      font-weight: bold;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.5; } }

    .hp-box { width: 100%; }
    .hp-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 2px; }
    .hp-bar-bg { width: 100%; height: 10px; background: var(--hp-bg); border-radius: 5px; overflow: hidden; border: 1px solid #5a1111; }
    .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444); transition: width 0.25s ease; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      font-size: 11px;
      background: rgba(0,0,0,0.4);
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .stats-bar span b { color: #fff; }

    /* VIEWPORT */
    main#viewport {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    /* CARDS & BUTTONS */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .card-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 5px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s ease;
      width: 100%;
      min-height: 42px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.8); }
    .btn-gold { background: linear-gradient(180deg, #d97706, #b45309); color: #fff; border-color: #f59e0b; }
    .btn-gold:hover { background: linear-gradient(180deg, #f59e0b, #d97706); }
    .btn-red { background: linear-gradient(180deg, #dc2626, #991b1b); color: #fff; border-color: #ef4444; }
    .btn-blue { background: linear-gradient(180deg, #0284c7, #0369a1); color: #fff; border-color: #38bdf8; }
    .btn-green { background: linear-gradient(180deg, #059669, #047857); color: #fff; border-color: #10b981; }
    .btn-purple { background: linear-gradient(180deg, #7c3aed, #5b21b6); color: #fff; border-color: #a855f7; }
    .btn-sub { background: #1e293b; color: #e2e8f0; border-color: #475569; }
    .btn-sub:hover { background: #334155; }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-xs { padding: 4px 8px; font-size: 11px; min-height: 28px; width: auto; border-radius: 5px; }

    /* DOOR CHOICE SYSTEM (1階ごとの選択) */
    .door-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .door-card {
      background: linear-gradient(135deg, rgba(30, 36, 52, 0.9), rgba(16, 19, 28, 0.95));
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .door-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .door-card.danger-high { border-color: #ef4444; background: linear-gradient(135deg, rgba(50, 20, 25, 0.9), rgba(20, 10, 12, 0.95)); }
    .door-card.danger-curse { border-color: #a855f7; background: linear-gradient(135deg, rgba(40, 15, 50, 0.9), rgba(18, 8, 24, 0.95)); }
    .door-card.safe { border-color: #10b981; }
    .door-card.gold-room { border-color: #fbbf24; }

    .door-icon { font-size: 32px; min-width: 44px; text-align: center; }
    .door-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .door-sign { font-size: 14px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
    .door-desc { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .door-risk { font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 4px; display: inline-block; width: fit-content; }
    .risk-low { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .risk-mid { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .risk-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .risk-curse { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

    /* EVENT / BATTLE SCENE */
    .scene-box {
      background: radial-gradient(circle at 50% 30%, rgba(35, 42, 60, 0.7), rgba(12, 14, 20, 0.95));
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      position: relative;
    }
    .scene-art { font-size: 52px; filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.4)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .scene-title { font-size: 18px; font-weight: 800; color: #fff; }
    .scene-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; max-width: 92%; }

    /* BATTLE */
    .enemy-card {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1.5px solid #6b1d1d;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .enemy-card.boss { border-color: #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
    .enemy-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; }
    .enemy-intent-badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }

    /* SYNERGY BADGES */
    .synergy-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0;
    }
    .synergy-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 5px;
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.25), rgba(236, 72, 153, 0.25));
      border: 1px solid #c084fc;
      color: #f5d0fe;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
    }

    /* ITEMS & RARITY */
    .item-row {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-row.r-Common { border-left: 3.5px solid var(--r-common); }
    .item-row.r-Rare { border-left: 3.5px solid var(--r-rare); }
    .item-row.r-Epic { border-left: 3.5px solid var(--r-epic); }
    .item-row.r-Legendary { border-left: 4px solid var(--r-legendary); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
    .item-row.r-Mythic { border-left:4px solid var(--r-mythic); box-shadow:0 0 16px rgba(244,63,158,.38); background:linear-gradient(90deg,rgba(88,28,135,.32),rgba(30,41,59,.7)); }
    .item-row.r-Abyssal { border-left:4px solid var(--r-abyssal); box-shadow:0 0 22px rgba(34,211,238,.45); background:linear-gradient(90deg,rgba(8,47,73,.55),rgba(49,12,74,.5)); }
    .item-row.r-Curse { border-left: 4px solid var(--r-curse); box-shadow: 0 0 10px rgba(244, 63, 94, 0.3); }

    .item-name { font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .r-Common .item-name { color: var(--r-common); }
    .r-Rare .item-name { color: var(--r-rare); }
    .r-Epic .item-name { color: var(--r-epic); }
    .r-Legendary .item-name { color: var(--r-legendary); }
    .r-Mythic .item-name { color:var(--r-mythic); text-shadow:0 0 8px rgba(244,63,158,.6); }
    .r-Abyssal .item-name { color:var(--r-abyssal); text-shadow:0 0 10px rgba(34,211,238,.8); }
    .r-Curse .item-name { color: var(--r-curse); }
    .item-stats { font-size: 10.5px; color: #94a3b8; }
    .item-curse-note { font-size: 10.5px; color: #f87171; font-weight: bold; }

    /* BOTTOM TABS */
    nav#sub-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      gap: 3px;
      margin-top: auto;
      background: rgba(10, 12, 18, 0.9);
    }
    .sub-tab-btn {
      flex: 1;
      padding: 8px 3px;
      background: rgba(0,0,0,0.3);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .sub-tab-btn.active {
      background: var(--panel);
      border-color: var(--border);
      color: #fff;
    }
    .sub-tab-btn .badge-pill {
      background: #3b82f6;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 8px;
      margin-left: 2px;
    }
    #sub-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 10px;
      min-height: 170px;
      max-height: 220px;
      overflow-y: auto;
    }

    /* LEGENDARY DISCOVERY OVERLAY */
    .legendary-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    .update-notes-card {
      max-width:460px; width:100%; max-height:85vh; max-height:85dvh;
      display:flex; flex-direction:column; min-height:0; overflow:hidden;
      border:2px solid #fbbf24; padding:clamp(8px,3vh,22px);
    }
    .update-notes-header, .update-notes-actions { flex-shrink:0; }
    .update-notes-body {
      min-height:0; overflow-y:auto; overscroll-behavior:contain;
      margin:14px 0; display:flex; flex-direction:column; gap:7px;
    }
    .update-notes-body > div { flex-shrink:0; }
    .mythic-modal { background:radial-gradient(circle,rgba(88,28,135,.88),rgba(2,6,23,.97)); animation:fadeIn .55s ease; }
    .abyssal-modal { background:radial-gradient(circle,rgba(8,47,73,.94),#02030a 72%); animation:fadeIn 1s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .legendary-box {
      background: radial-gradient(circle at 50% 30%, #352512 0%, #15101a 100%);
      border: 2.5px solid #fbbf24;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 45px rgba(251, 191, 36, 0.6);
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: popZoom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popZoom { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .legendary-tag {
      font-size: 13px;
      letter-spacing: 2px;
      color: #fbbf24;
      font-weight: 900;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    /* CODEX (図鑑) GRID */
    .codex-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .codex-item {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .codex-item.locked {
      opacity: 0.4;
      color: var(--muted);
      border-style: dashed;
    }

    /* FX ANIMATIONS */
    .shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }

    /* ==========================================================================
       FEEDBACK & JUICE ENHANCEMENTS
       ========================================================================== */
    /* 1. Low HP Vignette & Critical Pulse */
    #danger-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.6), inset 0 0 110px rgba(185, 28, 28, 0.4);
      z-index: 45;
      animation: dangerPulse 1.1s infinite ease-in-out;
      display: none;
    }
    @keyframes dangerPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
    .hp-critical {
      animation: hpCriticalGlow 0.75s infinite alternate ease-in-out !important;
    }
    @keyframes hpCriticalGlow {
      0% { filter: brightness(1); box-shadow: 0 0 6px #ef4444; }
      100% { filter: brightness(1.7); box-shadow: 0 0 18px #ef4444; }
    }
    .critical-nudge {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
      animation: pulse 1.2s infinite !important;
    }

    /* 2. Item Acquisition Toast & Comparison */
    #item-toast-container {
      position: fixed;
      top: 68px;
      right: 12px;
      left: 12px;
      max-width: 596px;
      margin: 0 auto;
      pointer-events: none;
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .item-toast {
      background: rgba(13, 17, 26, 0.96);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1), toastOut 0.3s ease 1.3s forwards;
      width: 96%;
      max-width: 440px;
      backdrop-filter: blur(10px);
    }
    @keyframes toastIn {
      from { transform: translateY(-20px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes toastOut {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-12px) scale(0.95); opacity: 0; }
    }
    .item-toast.r-Common { border-color: var(--r-common); }
    .item-toast.r-Rare {
      border-color: var(--r-rare);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }
    .item-toast.r-Epic {
      border-color: var(--r-epic);
      box-shadow: 0 0 24px rgba(192, 132, 252, 0.6);
      animation: toastInEpic 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), toastOut 0.3s ease 1.5s forwards;
    }
    @keyframes toastInEpic {
      0% { transform: translateY(-25px) scale(0.85); opacity: 0; }
      60% { transform: translateY(2px) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .item-toast-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .item-toast-title {
      font-size: 13.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }
    .item-toast-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-Common { background: rgba(148, 163, 184, 0.2); color: var(--r-common); border: 1px solid var(--r-common); }
    .badge-Rare { background: rgba(56, 189, 248, 0.2); color: var(--r-rare); border: 1px solid var(--r-rare); }
    .badge-Epic { background: rgba(192, 132, 252, 0.25); color: var(--r-epic); border: 1px solid var(--r-epic); }
    .badge-Legendary { background: rgba(251, 191, 36, 0.25); color: var(--r-legendary); border: 1px solid var(--r-legendary); }
    .badge-Mythic { background:rgba(244,63,158,.22);color:var(--r-mythic);border:1px solid var(--r-mythic); }
    .badge-Abyssal { background:rgba(34,211,238,.2);color:var(--r-abyssal);border:1px solid var(--r-abyssal); }

    .item-toast-diff {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      background: rgba(0,0,0,0.45);
      padding: 4px 8px;
      border-radius: 5px;
      margin-top: 2px;
    }
    .diff-up { color: #4ade80; font-weight: bold; }
    .diff-down { color: #f87171; font-weight: bold; }
    .diff-eq { color: #94a3b8; }

    /* 3. Tab Flash on loot */
    .tab-flash {
      animation: tabFlashAnim 0.75s ease !important;
    }
    @keyframes tabFlashAnim {
      0% { transform: scale(1); background: rgba(59, 130, 246, 0.2); }
      35% { transform: scale(1.18); background: #3b82f6; color: #fff; box-shadow: 0 0 16px #3b82f6; }
      100% { transform: scale(1); }
    }

    /* 4. Floating Text FX Layer */
    #floating-fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 120;
    }
    .flying-fx {
      position: absolute;
      font-weight: 900;
      pointer-events: none;
      animation: flyingFloat 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 10px currentColor;
      white-space: nowrap;
    }
    @keyframes flyingFloat {
      0% { opacity: 0; transform: translate(-50%, 15px) scale(0.65); }
      20% { opacity: 1; transform: translate(-50%, -8px) scale(1.25); }

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ==========================================================================
       AUDIO SYNTHESIZER (Web Audio API - Zero External Dependencies)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const b = document.getElementById('sound-btn');
      b.textContent = soundEnabled ? '🔊 音 ON' : '🔇 音 OFF';
      if (soundEnabled) { initAudio(); playSound('click'); }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.exponentialRampToValueAtTime(800, t + 0.04);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          osc.start(t); osc.stop(t + 0.04);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, t);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.1);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'crit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.setValueAtTime(880, t + 0.06);
          osc.frequency.setValueAtTime(1200, t + 0.14);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'player_hurt') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, t);
          osc.frequency.exponentialRampToValueAtTime(45, t + 0.15);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'heal') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(640, t + 0.2);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'item_common') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.exponentialRampToValueAtTime(800, t + 0.12);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'item_rare') {
          [587.33, 880.00].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, t + i * 0.08);
            g.gain.setValueAtTime(0.14, t + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.25);
            o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.25);
          });
        } else if (type === 'item_epic') {
          [523.25, 659.25, 1046.50, 1318.51].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.07);
            g.gain.setValueAtTime(0.16, t + i * 0.07);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.3);
            o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.3);
          });
        } else if (type === 'gold') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(987, t);
          osc.frequency.exponentialRampToValueAtTime(1318, t + 0.08);
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'kill') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(330, t);
          osc.frequency.setValueAtTime(440, t + 0.06);
          osc.frequency.setValueAtTime(660, t + 0.12);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'boss_kill') {
          [392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.1);
            g.gain.setValueAtTime(0.2, t + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.4);
            o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.4);
          });
        } else if (type === 'safe_point') {
          // Heroic discovery fanfare
          [440.00, 554.37, 659.25, 880.00].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, t + i * 0.1);
            g.gain.setValueAtTime(0.18, t + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.45);
            o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.45);
          });
        } else if (type === 'warning') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(90, t);
          osc.frequency.exponentialRampToValueAtTime(55, t + 0.2);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'legendary') {
          // Grand fanfare
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.09);
            g.gain.setValueAtTime(0.15, t + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.35);
            o.start(t + i * 0.09);
            o.stop(t + i * 0.09 + 0.35);
          });
        } else if (type === 'escape') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, t);
          osc.frequency.exponentialRampToValueAtTime(900, t + 0.35);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
          osc.start(t); osc.stop(t + 0.4);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.setValueAtTime(150, t + 0.2);
          osc.frequency.setValueAtTime(90, t + 0.4);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.7);
          osc.start(t); osc.stop(t + 0.7);
        } else if (type === 'heavy_attack') {
          // Low heavy impact
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(35, t + 0.22);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'weapon_skill') {
          // Arcane high sweep
          [440, 660, 880, 1320].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.05);
            g.gain.setValueAtTime(0.18, t + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.25);
            o.start(t + i * 0.05); o.stop(t + i * 0.05 + 0.25);
          });
        } else if (type === 'parry') {
          // Metallic ring ping
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1760, t);
          osc.frequency.exponentialRampToValueAtTime(440, t + 0.3);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.start(t); osc.stop(t + 0.3);
        } else if (type === 'reroll') {
          // Dice roll shuffle
          [300, 450, 600, 750].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, t + i * 0.04);
            g.gain.setValueAtTime(0.12, t + i * 0.04);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.04 + 0.1);
            o.start(t + i * 0.04); o.stop(t + i * 0.04 + 0.1);
          });
        }
      } catch (e) {}
    }

    function getFacilityUpgradeCost(type) {
      const cfg = FACILITY_CONFIG[type];
      const level = type === 'vault' ? state.camp.vaultLevel : Number(state.camp[type]);
      if (!cfg || level >= cfg.maxLevel) return null;
      return Math.round(cfg.baseCost * Math.pow(cfg.growth, Math.max(0, level - 1)) / 10) * 10;
    }

    function getFacilityCrystalCost(type) {
      const level = type === 'vault' ? state.camp.vaultLevel : Number(state.camp[type]);
      return type !== 'vault' && level >= 4 ? 3 : (type !== 'vault' && level >= 3 ? 1 : 0);
    }

    function getFacilityButtonText(type) {
      const cost = getFacilityUpgradeCost(type);
      if (cost === null) return 'MAX';
      const crystals = getFacilityCrystalCost(type);
      if (state.vaultGold < cost) return `あと${cost - state.vaultGold}G必要`;
      if (state.deepCrystals < crystals) return `深層結晶あと${crystals - state.deepCrystals}`;
      return `強化 ${cost}G${crystals ? ` +結晶${crystals}` : ''}`;
    }

    function isFacilityUpgradeDisabled(type) {
      const cost = getFacilityUpgradeCost(type);
      return cost === null || state.vaultGold < cost || state.deepCrystals < getFacilityCrystalCost(type);
    }

      if (!cfg) return 100;
      const curLv = state.talents[key] || 0;
      if (cfg.maxLv && curLv >= cfg.maxLv) return null; // MAX reached
      return cfg.baseCost + curLv * cfg.costPerLv;
    }

          ,deepestFloorReached: state.deepestFloorReached

        localStorage.setItem(SAVE_KEY, JSON.stringify(d));

    function loadState() {
      try {
        const s = localStorage.getItem(SAVE_KEY);
        if (s) {
          const p = JSON.parse(s);
          state.camp = Object.assign(state.camp, p.camp || {});
          // Ensure vaultLevel and vaultSize separation
          if (state.camp.vaultLevel === undefined || isNaN(state.camp.vaultLevel)) {
            state.camp.vaultLevel = Math.max(1, Math.round(((state.camp.vaultSize || 20) - 20) / 10) + 1);
          }
          state.camp.vaultSize = 20 + (state.camp.vaultLevel - 1) * 10;

          state.vaultGold = p.vaultGold || 0;
          state.abyssCores = p.abyssCores || 0;
          state.deepCrystals = Number(p.deepCrystals) || 0;
          state.storage = p.storage || [];
          state.equipped = p.equipped || { weapon: null, armor: null, accessory: null };
          state.talents = Object.assign(state.talents, p.talents || {});
          state.codex = Object.assign(state.codex, p.codex || { items: {}, enemies: {}, lore: {} });
          if (p.bounty) state.bounty = Object.assign(state.bounty, p.bounty);
          state.preparedItems = p.preparedItems || [];
          state.preparedBuffs = p.preparedBuffs || { chestRareBonus: 0, goldMult: 1.0 };
          state.expeditionPolicy = p.expeditionPolicy || 'normal';
          state.bossFirstKills = p.bossFirstKills || {};
          state.mystery = Object.assign(state.mystery, p.mystery || {});
          if (!p.mystery) {
            state.mystery.keyOwned = state.storage.some(i => i.key === 'ancient_key');
            state.mystery.eggHatched = state.storage.some(i => i.key === 'dragon_hatchling');
            state.mystery.crownAwakened = state.storage.some(i => i.awakened && String(i.key).includes('crown'));
          }
          state.starterPerk = p.starterPerk || null;
          state.rarityProgress = Object.assign(state.rarityProgress, p.rarityProgress || {});
          state.craftProgress = { materials: {}, recipes: {}, crafted: {}, ...(p.craftProgress || {}) };
          state.maxUnlockedFloor = Math.max(30, Number(p.maxUnlockedFloor) || 30);
          state.deepestFloorReached = Number(p.deepestFloorReached) || 0;
          state.runRecords = Object.assign(state.runRecords, p.runRecords || {});
          state.selectedStartFloor = [1,...BOSS_FLOORS.map(f=>f+1).filter(f=>f<=MAX_DUNGEON_FLOOR)].includes(Number(p.selectedStartFloor)) ? Number(p.selectedStartFloor) : 1;

          // Normalize legacy saves so string/null levels cannot break buttons or MAX checks.
          ['blacksmith','shop','tavern','lab'].forEach(key => {
            state.camp[key] = Math.max(1, Math.min(FACILITY_CONFIG[key].maxLevel, Number(state.camp[key]) || 1));
          });
          state.camp.vaultLevel = Math.max(1, Math.min(FACILITY_CONFIG.vault.maxLevel, Number(state.camp.vaultLevel) || 1));
          state.camp.vaultSize = 20 + (state.camp.vaultLevel - 1) * 10;

        }

      migrateChapter(savedChapter);

    function resetGameSave(reloadPage = true) {
      // Never use localStorage.clear(): only keys owned by this game are removed.
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem('ABYSS_TUTORIAL_SEEN');

      state = JSON.parse(JSON.stringify(INITIAL_STATE));
      initStarterItems();
      migrateChapter(null);
      saveState();

      if (reloadPage) {
        window.location.reload();
      } else {
        closeGenericModal();
        updateHeader();
        render();
      }
    }
