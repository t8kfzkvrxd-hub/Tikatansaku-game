<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>地下探索型・持ち帰りローグライト - ABYSS DELVER</title>
  <meta name="description" content="地下30階の深淵に挑む持ち帰り型ローグライト。生還か、更なる深層か。緊張感あふれるリスクとリターン。" />
  <style>
    /* ==========================================================================
       RESET & THEME
       ========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    :root {
      --bg: #090a0f;
      --panel: rgba(18, 21, 31, 0.95);
      --border: #2e384d;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --gold: #f59e0b;
      --core: #a855f7;
      --hp: #ef4444;
      --hp-bg: #450a0a;
      --atk: #f97316;
      --def: #38bdf8;
      --crit: #ec4899;
      --curse: #a855f7;
      
      --r-common: #94a3b8;
      --r-rare: #38bdf8;
      --r-epic: #c084fc;
      --r-legendary: #fbbf24;
      --r-curse: #f43f5e;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 10%, #1c1524 0%, #08090d 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(12, 14, 20, 0.88);
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      position: relative;
      border-left: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    /* TOP STATUS BAR */
    header#status-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 16, 25, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .floor-badge {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .area-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
    }
    .goal-nudge {
      font-size: 11px;
      color: var(--gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 2px 8px;
      font-weight: bold;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.5; } }

    .hp-box { width: 100%; }
    .hp-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 2px; }
    .hp-bar-bg { width: 100%; height: 10px; background: var(--hp-bg); border-radius: 5px; overflow: hidden; border: 1px solid #5a1111; }
    .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444); transition: width 0.25s ease; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      font-size: 11px;
      background: rgba(0,0,0,0.4);
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .stats-bar span b { color: #fff; }

    /* VIEWPORT */
    main#viewport {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    /* CARDS & BUTTONS */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .card-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 5px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s ease;
      width: 100%;
      min-height: 42px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.8); }
    .btn-gold { background: linear-gradient(180deg, #d97706, #b45309); color: #fff; border-color: #f59e0b; }
    .btn-gold:hover { background: linear-gradient(180deg, #f59e0b, #d97706); }
    .btn-red { background: linear-gradient(180deg, #dc2626, #991b1b); color: #fff; border-color: #ef4444; }
    .btn-blue { background: linear-gradient(180deg, #0284c7, #0369a1); color: #fff; border-color: #38bdf8; }
    .btn-green { background: linear-gradient(180deg, #059669, #047857); color: #fff; border-color: #10b981; }
    .btn-purple { background: linear-gradient(180deg, #7c3aed, #5b21b6); color: #fff; border-color: #a855f7; }
    .btn-sub { background: #1e293b; color: #e2e8f0; border-color: #475569; }
    .btn-sub:hover { background: #334155; }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-xs { padding: 4px 8px; font-size: 11px; min-height: 28px; width: auto; border-radius: 5px; }

    /* DOOR CHOICE SYSTEM (1階ごとの選択) */
    .door-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .door-card {
      background: linear-gradient(135deg, rgba(30, 36, 52, 0.9), rgba(16, 19, 28, 0.95));
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .door-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .door-card.danger-high { border-color: #ef4444; background: linear-gradient(135deg, rgba(50, 20, 25, 0.9), rgba(20, 10, 12, 0.95)); }
    .door-card.danger-curse { border-color: #a855f7; background: linear-gradient(135deg, rgba(40, 15, 50, 0.9), rgba(18, 8, 24, 0.95)); }
    .door-card.safe { border-color: #10b981; }
    .door-card.gold-room { border-color: #fbbf24; }

    .door-icon { font-size: 32px; min-width: 44px; text-align: center; }
    .door-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .door-sign { font-size: 14px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
    .door-desc { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .door-risk { font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 4px; display: inline-block; width: fit-content; }
    .risk-low { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .risk-mid { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .risk-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .risk-curse { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

    /* EVENT / BATTLE SCENE */
    .scene-box {
      background: radial-gradient(circle at 50% 30%, rgba(35, 42, 60, 0.7), rgba(12, 14, 20, 0.95));
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      position: relative;
    }
    .scene-art { font-size: 52px; filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.4)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .scene-title { font-size: 18px; font-weight: 800; color: #fff; }
    .scene-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; max-width: 92%; }

    /* BATTLE */
    .enemy-card {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1.5px solid #6b1d1d;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .enemy-card.boss { border-color: #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
    .enemy-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; }
    .enemy-intent-badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }

    /* SYNERGY BADGES */
    .synergy-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0;
    }
    .synergy-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 5px;
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.25), rgba(236, 72, 153, 0.25));
      border: 1px solid #c084fc;
      color: #f5d0fe;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
    }

    /* ITEMS & RARITY */
    .item-row {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-row.r-Common { border-left: 3.5px solid var(--r-common); }
    .item-row.r-Rare { border-left: 3.5px solid var(--r-rare); }
    .item-row.r-Epic { border-left: 3.5px solid var(--r-epic); }
    .item-row.r-Legendary { border-left: 4px solid var(--r-legendary); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
    .item-row.r-Curse { border-left: 4px solid var(--r-curse); box-shadow: 0 0 10px rgba(244, 63, 94, 0.3); }

    .item-name { font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .r-Common .item-name { color: var(--r-common); }
    .r-Rare .item-name { color: var(--r-rare); }
    .r-Epic .item-name { color: var(--r-epic); }
    .r-Legendary .item-name { color: var(--r-legendary); }
    .r-Curse .item-name { color: var(--r-curse); }
    .item-stats { font-size: 10.5px; color: #94a3b8; }
    .item-curse-note { font-size: 10.5px; color: #f87171; font-weight: bold; }

    /* BOTTOM TABS */
    nav#sub-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      gap: 3px;
      margin-top: auto;
      background: rgba(10, 12, 18, 0.9);
    }
    .sub-tab-btn {
      flex: 1;
      padding: 8px 3px;
      background: rgba(0,0,0,0.3);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .sub-tab-btn.active {
      background: var(--panel);
      border-color: var(--border);
      color: #fff;
    }
    .sub-tab-btn .badge-pill {
      background: #3b82f6;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 8px;
      margin-left: 2px;
    }
    #sub-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 10px;
      min-height: 170px;
      max-height: 220px;
      overflow-y: auto;
    }

    /* LEGENDARY DISCOVERY OVERLAY */
    .legendary-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .legendary-box {
      background: radial-gradient(circle at 50% 30%, #352512 0%, #15101a 100%);
      border: 2.5px solid #fbbf24;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 45px rgba(251, 191, 36, 0.6);
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: popZoom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popZoom { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .legendary-tag {
      font-size: 13px;
      letter-spacing: 2px;
      color: #fbbf24;
      font-weight: 900;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    /* CODEX (図鑑) GRID */
    .codex-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .codex-item {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .codex-item.locked {
      opacity: 0.4;
      color: var(--muted);
      border-style: dashed;
    }

    /* FX ANIMATIONS */
    .shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- TOP STATUS -->
    <header id="status-bar">
      <div class="status-row-1">
        <div class="floor-badge">
          <span id="ui-floor-icon">🪜</span>
          <span id="ui-floor-name">地上 拠点</span>
          <span class="area-tag" id="ui-area-tag">荒野の野営地</span>
        </div>
        <div class="goal-nudge" id="ui-goal-nudge">🎯 5F安全帰還まで: あと5階</div>
        <button id="sound-btn" class="btn btn-outline btn-xs" onclick="toggleSound()">🔊 音 ON</button>
      </div>

      <div class="hp-box">
        <div class="hp-label">
          <span>体力 (HP)</span>
          <span id="ui-hp-text">100 / 100</span>
        </div>
        <div class="hp-bar-bg">
          <div id="ui-hp-bar" class="hp-bar-fill"></div>
        </div>
      </div>

      <div class="stats-bar">
        <span>⚔️ 攻 <b id="ui-atk">12</b></span>
        <span>🛡️ 防 <b id="ui-def">3</b></span>
        <span>💥 会心 <b id="ui-crit">5%</b></span>
        <span>🪙 金 <b id="ui-gold" style="color:var(--gold);">0</b></span>
        <span>🔮 核 <b id="ui-core" style="color:var(--core);">0</b></span>
      </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main id="viewport">
      <!-- Injected by render() -->
    </main>

    <!-- BOTTOM SUB TABS -->
    <nav id="sub-tabs">
      <button class="sub-tab-btn active" id="tab-btn-equip" onclick="setTab('equip')">⚔️ 装備 & シナジー</button>
      <button class="sub-tab-btn" id="tab-btn-bag" onclick="setTab('bag')">🎒 戦利品 <span class="badge-pill" id="ui-bag-count">0</span></button>
      <button class="sub-tab-btn" id="tab-btn-codex" onclick="setTab('codex')">📖 図鑑 <span class="badge-pill" id="ui-codex-pct">0%</span></button>
      <button class="sub-tab-btn" id="tab-btn-log" onclick="setTab('log')">📜 日誌</button>
    </nav>
    <div id="sub-panel">
      <!-- Injected by renderSubPanel() -->
    </div>
  </div>

  <!-- MODAL OVERLAY -->
  <div id="modal-layer" style="display:none;"></div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ==========================================================================
       AUDIO SYNTHESIZER (Web Audio API - Zero External Dependencies)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const b = document.getElementById('sound-btn');
      b.textContent = soundEnabled ? '🔊 音 ON' : '🔇 音 OFF';
      if (soundEnabled) { initAudio(); playSound('click'); }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.exponentialRampToValueAtTime(800, t + 0.04);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          osc.start(t); osc.stop(t + 0.04);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, t);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.1);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'crit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.setValueAtTime(880, t + 0.06);
          osc.frequency.setValueAtTime(1200, t + 0.14);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'player_hurt') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, t);
          osc.frequency.exponentialRampToValueAtTime(45, t + 0.15);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'heal') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(640, t + 0.2);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'legendary') {
          // Grand fanfare
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.09);
            g.gain.setValueAtTime(0.15, t + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.35);
            o.start(t + i * 0.09);
            o.stop(t + i * 0.09 + 0.35);
          });
        } else if (type === 'escape') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, t);
          osc.frequency.exponentialRampToValueAtTime(900, t + 0.35);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
          osc.start(t); osc.stop(t + 0.4);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.setValueAtTime(150, t + 0.2);
          osc.frequency.setValueAtTime(90, t + 0.4);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.7);
          osc.start(t); osc.stop(t + 0.7);
        }
      } catch (e) {}
    }

    /* ==========================================================================
       DATA STRUCTURES (LORE, BOSSES, ITEMS, SYNERGIES, CODEX)
       ========================================================================== */
    const MAX_DUNGEON_FLOOR = 30;

    // Underground Lore & Mysteries (地下世界の真相)
    const LORE_RECORDS = [
      { id: 'lore_1', title: '坑道夫の走り書き', text: '「掘れば掘るほど金が出る。だが深層から響く鼓動は何だ？あれは大地じゃない…生きている何かの音だ。」' },
      { id: 'lore_2', title: '古代の石版断片', text: '「天の災いを逃れ、我らは地下に都市を築いた。しかし、地底に眠る原初の核に触れてはならなかったのだ。」' },

    function saveState() {
      try {
        const d = {
          camp: state.camp,
          vaultGold: state.vaultGold,
          abyssCores: state.abyssCores,
          storage: state.storage,
          equipped: state.equipped,
          talents: state.talents,
          codex: state.codex
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(d));
      } catch (e) {}
    }

    function loadState() {
      try {
        const s = localStorage.getItem(SAVE_KEY);
        if (s) {
          const p = JSON.parse(s);
          state.camp = Object.assign(state.camp, p.camp || {});
          state.vaultGold = p.vaultGold || 0;
          state.abyssCores = p.abyssCores || 0;
          state.storage = p.storage || [];
          state.equipped = p.equipped || { weapon: null, armor: null, accessory: null };
          state.talents = Object.assign(state.talents, p.talents || {});
          state.codex = Object.assign(state.codex, p.codex || { items: {}, enemies: {}, lore: {} });
        } else {
          initStarterItems();
        }
      } catch (e) {
        initStarterItems();
      }
    }

    function initStarterItems() {
      state.equipped.weapon = { key: 'starter_w', name: '錆びたショートソード', icon: '🗡️', type: 'weapon', rarity: 'Common', baseAtk: 6, desc: '初期武器' };
      state.equipped.armor = { key: 'starter_a', name: '擦り切れた革鎧', icon: '🥋', type: 'armor', rarity: 'Common', baseDef: 2, hp: 10, desc: '初期防具' };
      recordCodex('item', state.equipped.weapon);
      recordCodex('item', state.equipped.armor);
    }

    function recordCodex(type, obj) {
      if (!obj) return;
      if (type === 'item') {
        state.codex.items[obj.name] = { name: obj.name, icon: obj.icon, rarity: obj.rarity, desc: obj.desc || '装備品' };
      } else if (type === 'enemy') {
        state.codex.enemies[obj.name] = { name: obj.name, icon: obj.icon, isBoss: obj.isBoss || false };
      } else if (type === 'lore') {
        state.codex.lore[obj.id] = { title: obj.title, text: obj.text };
      }
      saveState();
    }

    /* ==========================================================================
       STATS & SYNERGIES CALCULATION
       ========================================================================== */
    function getActiveSynergies() {
      return SYNERGIES.filter(s => s.check(state.equipped));
    }

    function getPlayerStats() {
      let maxHp = 100 + (state.talents.hpLv * 15);
      let atk = 10 + (state.talents.atkLv * 3);
      let def = 2 + (state.talents.defLv * 2);
      let crit = 5;
      let vamp = 0;
      let rareRate = state.talents.luckLv * 6;
      let goldRate = 0;
      let perFloorDrain = 0;
      let demeritDamage = 0;

      // Equipment
      ['weapon', 'armor', 'accessory'].forEach(k => {
        const item = state.equipped[k];
        if (item) {
          if (item.baseAtk) atk += item.baseAtk;
          if (item.baseDef) def += item.baseDef;
          if (item.hp) maxHp += item.hp;
          if (item.crit) crit += item.crit;
          if (item.vamp) vamp += item.vamp;
          if (item.rareRate) rareRate += item.rareRate;
          if (item.goldRate) goldRate += item.goldRate;
          if (item.curseHpDrain) perFloorDrain += item.curseHpDrain;
          if (item.demeritDamageTaken) demeritDamage += item.demeritDamageTaken;
        }
      });

      // Synergy effects
      const activeSyn = getActiveSynergies();
      activeSyn.forEach(s => {
        if (s.id === 'syn_curse') { atk += 30; crit += 15; perFloorDrain += 2; }
        if (s.id === 'syn_titan') { maxHp += 50; def += 8; }
        if (s.id === 'syn_gold') { goldRate += 300; }
        if (s.id === 'syn_blood') { vamp += 4; }
      });

      // Berserk item check (狂戦士の指輪: HP50%以下で攻撃2倍)
      if (state.equipped.accessory?.isBerserk && state.hp <= (maxHp * 0.5)) {
        atk *= 2;
      }

      // Modifiers from events
      if (state.modifiers.chestRareBonus) rareRate += state.modifiers.chestRareBonus;
      if (state.modifiers.goldenStairTurns > 0) goldRate += 200;

      return { maxHp, atk, def, crit, vamp, rareRate, goldRate, perFloorDrain, demeritDamage, activeSyn };
    }

    function addLog(msg, type = 'normal') {
      state.logs.unshift({ msg, type, time: new Date().toLocaleTimeString() });
      if (state.logs.length > 40) state.logs.pop();
    }

       START RUN & TOWN FLOW
       ========================================================================== */
    function startDungeonRun() {
      initAudio();
      playSound('click');
      const stats = getPlayerStats();
      state.floor = 1;
      state.hp = stats.maxHp;
      state.maxHp = stats.maxHp;
      state.dungeonGold = 0;
      state.inventory = [];
      state.logs = [];
      state.runKills = 0;
      state.modifiers = { goldMult: 1.0, enemyAtkMult: 1.0, chestRareBonus: 0, goldenStairTurns: 0 };

      // Shop prep: Take pre-bought potion if shop Lv >= 2
      if (state.camp.shop >= 2) {
        state.inventory.push({ id: 'pot_1', name: '冒険者の傷薬', icon: '🧪', type: 'potion', heal: 40, rarity: 'Common', desc: 'HP40回復' });
      }

      addLog('深淵の地下迷宮へと足を踏み入れた。生還は5階ごとの転移門のみ！', 'gold');
      generateDoorsForFloor();
    }

    function returnToTown(safeReturn = true) {
      if (safeReturn) {
        playSound('escape');
        state.vaultGold += state.dungeonGold;
        // Move inventory into storage
        let savedCount = 0;
        state.inventory.forEach(item => {
          if (state.storage.length < state.camp.vaultSize) {
            state.storage.push(item);
            savedCount++;
          }
        });
        showResultModal({
          title: '🏰 地上への安全帰還 達成！',
          subtitle: `地下 ${state.floor} 階の転移門から無事生還しました。全ての戦利品を保管しました。`,
          gold: state.dungeonGold,
          cores: state.dungeonGold >= 200 ? 1 : 0,
          items: state.inventory,
          isDeath: false
        });
      } else {
        // Death
        playSound('gameover');
        // Calculate item retention from talents
        const retainCount = state.talents.keepItemLv; // 0, 1, 2
        const keptItems = state.inventory.slice(0, retainCount);
        const lostItems = state.inventory.slice(retainCount);

        keptItems.forEach(i => {
          if (state.storage.length < state.camp.vaultSize) state.storage.push(i);
        });

        // Lost 80% gold
        const keptGold = Math.floor(state.dungeonGold * 0.2);
        const lostGold = state.dungeonGold - keptGold;
        state.vaultGold += keptGold;

        showResultModal({
          title: '💀 探索失敗... 深淵で力尽きた',
          subtitle: `地下 ${state.floor} 階の闇に呑まれた。未保管の戦利品と大部分のゴールドを失った。`,
          lostItems: lostItems,
          keptItems: keptItems,
          lostGold: lostGold,
          keptGold: keptGold,
          isDeath: true
        });
      }

      saveState();
      state.screen = 'town';
      state.floor = 0;
      updateHeader();
      render();
    }

    function emergencyEscape() {
      // 緊急帰還ポータル: 戦利品の半分没収
      initAudio();
      playSound('escape');
      const keepCount = Math.ceil(state.inventory.length / 2);
      const keptItems = state.inventory.slice(0, keepCount);
      const lostItems = state.inventory.slice(keepCount);

      keptItems.forEach(i => {
        if (state.storage.length < state.camp.vaultSize) state.storage.push(i);
      });

      const keptGold = Math.floor(state.dungeonGold * 0.6);
      state.vaultGold += keptGold;

      showResultModal({
        title: '🌀 緊急脱出ポータルで強行生還！',
        subtitle: `不安定な歪みを通って帰還した！戦利品の半分とゴールドの一部を代償として失った。`,
        lostItems: lostItems,
        keptItems: keptItems,
        lostGold: state.dungeonGold - keptGold,
        keptGold: keptGold,
        isDeath: false
      });

      saveState();
      state.screen = 'town';
      state.floor = 0;
      updateHeader();
      render();
    }

      if (state.floor <= 20) return AREAS[1];
      return AREAS[2];
    }

      const isBossFloor = (state.floor === 10 || state.floor === 20 || state.floor === 30);

      const stats = getPlayerStats();
      if (stats.perFloorDrain > 0) {
        state.hp -= stats.perFloorDrain;
        addLog(`呪いの装備が体力を蝕む... HP -${stats.perFloorDrain}`, 'danger');
        if (state.hp <= 0) {
          state.hp = 0;
          returnToTown(false);
          return;
        }

        state.modifiers.goldenStairTurns--;

          icon: '🌀',
          sign: '不安定な緊急ポータル',
          desc: '【即時帰還】今すぐ生還可能だが、戦利品の半分を代償として失う。',
          risk: 'safe', riskText: '半分ロスト生還'
        });
      }

      // Pick 3 random distinct doors
      const shuffled = doorPool.sort(() => 0.5 - Math.random());
      state.currentDoors = shuffled.slice(0, 3);

      state.screen = 'door_select';
      updateHeader();
      render();
    }

    function selectDoor(index) {
      initAudio();
      playSound('click');
      const door = state.currentDoors[index];
      if (!door) return;

      // Advance lore check (低確率で地下の謎を拾う)
      if (Math.random() < 0.22) {
        discoverLore();
      }

      if (door.type === 'portal_safe') {
        returnToTown(true);
      } else if (door.type === 'emergency_portal') {
        emergencyEscape();
      } else if (door.type === 'door_deeper') {
        addLog('帰還門を背にして、更なる闇へと踏み込んだ！', 'danger');
        state.modifiers.chestRareBonus += 15;
        state.floor++;
        generateDoorsForFloor();
      } else if (door.type === 'battle_normal') {
        startNormalBattle(false);
      } else if (door.type === 'elite_battle') {
        startNormalBattle(true);
      } else if (door.type === 'chest_normal') {
        openChestEvent(false);
      } else if (door.type === 'cursed_chest') {
        openChestEvent(true);
      } else if (door.type === 'blood_altar') {
        startBloodAltarEvent();
      } else if (door.type === 'heal_spring') {
        startHealSpringEvent();
      } else if (door.type === 'merchant') {
        startMerchantEvent();
      } else if (door.type === 'golden_stairs') {
        startGoldenStairsEvent();
      } else if (door.type === 'mystery_wanderer') {
        startMysteryEvent();
      }
    }

    function discoverLore() {
      const unread = LORE_RECORDS.filter(l => !state.codex.lore[l.id]);
      if (unread.length > 0) {
        const picked = unread[Math.floor(Math.random() * unread.length)];
        recordCodex('lore', picked);
        addLog(`📜 古代の記録【${picked.title}】を発見した！（図鑑に登録）`, 'gold');
      }
    }

    /* ==========================================================================
       BATTLE ENGINE & BOSS GIMMICKS
       ========================================================================== */
    function startNormalBattle(isElite = false) {
      const area = getCurrentArea();
      let enemyTemplate = isElite ? area.elite : area.enemies[Math.floor(Math.random() * area.enemies.length)];
      
      const scale = 1 + (state.floor * 0.08);
      state.currentEnemy = {
        name: enemyTemplate.name,
        icon: enemyTemplate.icon,
        maxHp: Math.round(enemyTemplate.hp * scale),
        hp: Math.round(enemyTemplate.hp * scale),
        atk: Math.round(enemyTemplate.atk * scale * (state.modifiers.enemyAtkMult || 1.0)),
        def: Math.round(enemyTemplate.def * scale),
        isBoss: false,
        isElite: isElite
      };

      recordCodex('enemy', state.currentEnemy);
      state.screen = 'battle';
      decideEnemyIntent();
      addLog(`${state.currentEnemy.name} が立ちはだかった！`, isElite ? 'danger' : 'normal');
      updateHeader();
      render();
    }

    function startBossBattle(bossTemplate) {
      playSound('hit');
      state.currentEnemy = {
        name: bossTemplate.name,
        icon: bossTemplate.icon,
        maxHp: bossTemplate.hp,
        hp: bossTemplate.hp,
        atk: bossTemplate.atk,
        def: bossTemplate.def,
        isBoss: true,
        gimmick: bossTemplate.gimmick
      };
      state.bossTurnCount = 0;
      state.bossBarrier = (bossTemplate.gimmick === 'shield_barrier');
      state.bossMutated = false;

      recordCodex('enemy', state.currentEnemy);
      state.screen = 'battle';
      decideEnemyIntent();
      addLog(`階層の守護ボス【${state.currentEnemy.name}】が降臨した！`, 'danger');
      updateHeader();
      render();
    }

    function decideEnemyIntent() {
      if (!state.currentEnemy) return;
      const e = state.currentEnemy;

      if (e.isBoss) {
        state.bossTurnCount++;
        if (e.gimmick === 'heavy_charge') {
          // 10F 坑道の巨人: 3ターンごとに「地響き大粉砕」
          if (state.bossTurnCount % 3 === 0) {
            e.pendingAction = '⚠️【地響き大粉砕】次ターン壊滅的打撃！(防御必須)';
            e.nextMult = 2.4;
          } else {
            e.pendingAction = '通常打撃の構え';
            e.nextMult = 1.0;
          }
        } else if (e.gimmick === 'shield_barrier') {
          // 20F 古代の守護者: バリア中は防御超UP
          if (state.bossBarrier) {
            e.pendingAction = '🛡️【古代障壁】防御力超上昇中！';
            e.nextMult = 1.0;
          } else {
            e.pendingAction = '⚡【雷撃の矢】激しい攻撃！';
            e.nextMult = 1.4;
          }
        } else if (e.gimmick === 'mutate_form') {
          // 30F 失敗作EX-03: HP50%以下で変異
          if (!state.bossMutated && e.hp <= (e.maxHp * 0.5)) {
            state.bossMutated = true;
            e.name = '【暴走被験体EX-03: 完全体】';
            e.atk = Math.round(e.atk * 1.4);
            e.icon = '🐉';
            addLog('EX-03の細胞が激しく変異！完全体へと形態変化した！', 'danger');
          }
          e.pendingAction = state.bossMutated ? '☣️【変異暴走連撃】苛烈な連続攻撃！' : '触手なぎ払い';
          e.nextMult = state.bossMutated ? 1.6 : 1.1;
        }
      } else {
        const r = Math.random();
        if (r < 0.6) { e.pendingAction = '攻撃の構え'; e.nextMult = 1.0; }
        else if (r < 0.85) { e.pendingAction = '鋭い刺突の気配！'; e.nextMult = 1.3; }
        else { e.pendingAction = '様子を窺っている'; e.nextMult = 0.8; }
      }
    }

    function playerCombatAction(action) {
      if (!state.currentEnemy || state.hp <= 0) return;
      initAudio();

      const stats = getPlayerStats();
      const enemy = state.currentEnemy;

      if (action === 'attack') {
        const isCrit = Math.random() * 100 < stats.crit;
        let baseDmg = stats.atk * (isCrit ? 1.8 : 1.0);
        let targetDef = (enemy.isBoss && state.bossBarrier) ? enemy.def * 3 : enemy.def;
        let dmg = Math.max(1, Math.round(baseDmg - targetDef + (Math.random() * 4 - 2)));

        enemy.hp -= dmg;
        if (isCrit) {
          playSound('crit');
          addLog(`会心の一撃！ ${enemy.name} に ${dmg} の痛撃！`, 'gold');
        } else {
          playSound('hit');
          addLog(`${enemy.name} に ${dmg} のダメージ！`, 'normal');
        }

        // Vampirism
        if (stats.vamp > 0) {
          const healed = Math.min(stats.maxHp - state.hp, stats.vamp);
          if (healed > 0) {
            state.hp += healed;
            addLog(`吸血により HPが ${healed} 回復した。`, 'heal');
          }
        }

        if (enemy.hp <= 0) {
          enemy.hp = 0;
          onEnemyKilled();
          return;
        }

        setTimeout(() => enemyTurn(false), 250);
      } else if (action === 'defend') {
        playSound('click');
        addLog('盾を構えて防御！被ダメージを大きく低減する。', 'normal');
        setTimeout(() => enemyTurn(true), 250);
      } else if (action === 'disrupt_barrier') {
        // Special Boss button for 20F
        if (enemy.isBoss && state.bossBarrier) {
          state.bossBarrier = false;
          playSound('crit');
          addLog('ルーン障壁を破壊した！古代の守護者が隙を晒した！', 'gold');
          setTimeout(() => enemyTurn(false), 300);
        }
      }
      render();
    }

    function enemyTurn(isPlayerDefending = false) {
      if (!state.currentEnemy || state.hp <= 0) return;
      const stats = getPlayerStats();
      const enemy = state.currentEnemy;

      let enemyAtk = enemy.atk * (enemy.nextMult || 1.0);
      let playerDef = isPlayerDefending ? (stats.def * 2.5 + 6) : stats.def;
      let dmg = Math.max(1, Math.round(enemyAtk - playerDef));

      // Apply demerit damages (e.g. Gold mask)
      if (stats.demeritDamage > 0) {
        dmg = Math.round(dmg * (1 + stats.demeritDamage / 100));
      }

      state.hp -= dmg;
      playSound('player_hurt');
      triggerShake();
      addLog(`${enemy.name} の反撃！ ${dmg} のダメージを受けた！`, 'danger');

      if (state.hp <= 0) {
        state.hp = 0;
        updateHeader();
        setTimeout(() => returnToTown(false), 500);
        return;
      }

      decideEnemyIntent();
      updateHeader();
      render();
    }

    function onEnemyKilled() {
      const enemy = state.currentEnemy;
      playSound('heal');
      state.runKills++;

      const stats = getPlayerStats();
      const baseGold = 12 + state.floor * 6;
      const earnedGold = Math.round(baseGold * (1 + stats.goldRate / 100));
      state.dungeonGold += earnedGold;

      addLog(`討伐成功！ ${enemy.name} を撃破！ 金貨 +${earnedGold}G`, 'gold');

      if (enemy.isBoss) {
        state.abyssCores++;
        addLog(`希少素材【深淵の核】を獲得した！`, 'gold');
        // Boss Guaranteed Legendary
        const legItem = generateItem(state.floor, 'Legendary');
        giveItemToBag(legItem);
      } else if (enemy.isElite || Math.random() < 0.45) {
        // Drop item check
        const item = generateItem(state.floor);
        giveItemToBag(item);
      }

      state.currentEnemy = null;
      // Advance to next floor
      state.floor++;
      setTimeout(() => generateDoorsForFloor(), 400);
    }

    /* ==========================================================================
       ITEM GENERATION & LEGENDARY CELEBRATION (レア発見演出)
       ========================================================================== */
    function generateItem(floor, forcedRarity = null) {
      let rarity = forcedRarity;
      if (!rarity) {
        const stats = getPlayerStats();
        const roll = Math.random() * 100;
        if (roll < 5 + stats.rareRate * 0.4) rarity = 'Legendary';
        else if (roll < 22 + stats.rareRate * 0.6) rarity = 'Epic';
        else if (roll < 55 + stats.rareRate) rarity = 'Rare';
        else rarity = 'Common';
      }

      // Check unique item pool
      if (rarity === 'Legendary' && Math.random() < 0.6) {
        const legPool = [UNIQUE_ITEMS.death_scythe, UNIQUE_ITEMS.abyss_armor, UNIQUE_ITEMS.gold_mask];
        return { ...legPool[Math.floor(Math.random() * legPool.length)], id: 'u_' + Date.now() + Math.random() };
      } else if (rarity === 'Epic' && Math.random() < 0.5) {
        const epicPool = [UNIQUE_ITEMS.vamp_dagger, UNIQUE_ITEMS.gold_blade, UNIQUE_ITEMS.berserk_ring];
        return { ...epicPool[Math.floor(Math.random() * epicPool.length)], id: 'u_' + Date.now() + Math.random() };
      }

      // Procedural Item
      const types = ['weapon', 'armor', 'accessory'];
      const type = types[Math.floor(Math.random() * types.length)];
      const names = {
        weapon: ['鋼鉄のブロードソード', '怨嗟のバトルアックス', '暗殺者のダガー', '古代の儀式槍'],
        armor: ['黒鉄のチェインメイル', 'ルーンの防護ローブ', '深海の鱗鎧', '名も無き騎士の甲冑'],
        accessory: ['深紅のルビー指輪', '守護の魔導護符', '黒猫の尾チャーム', '強欲のペンダント']
      };
      const icons = { weapon: '⚔️', armor: '🛡️', accessory: '💍' };

      const baseName = names[type][Math.floor(Math.random() * names[type].length)];
      const mult = { Common: 1, Rare: 1.4, Epic: 1.8, Legendary: 2.5 }[rarity];

      const it = {
        id: 'it_' + Date.now() + Math.random(),
        name: baseName,
        icon: icons[type],
        type: type,
        rarity: rarity,
        desc: ''
      };

      if (type === 'weapon') it.baseAtk = Math.round((6 + floor * 1.5) * mult);
      if (type === 'armor') { it.baseDef = Math.round((2 + floor * 0.8) * mult); it.hp = Math.round(15 * mult); }
      if (type === 'accessory') { it.crit = Math.round(4 * mult); it.goldRate = Math.round(15 * mult); }

      // Random Curse or Bonus
      if (rarity === 'Legendary' && Math.random() < 0.3) {
        it.name = '【呪縛】' + it.name;
        it.isCurse = true;
        it.curseHpDrain = 2;
        if (it.baseAtk) it.baseAtk += 15;
        if (it.baseDef) it.baseDef += 10;
        it.desc = '驚異的性能だが毎階HP-2';
      }

      return it;
    }

    function giveItemToBag(item) {
      recordCodex('item', item);
      state.inventory.push(item);

      if (item.rarity === 'Legendary') {
        showLegendaryDiscoveryModal(item);
      } else {
        addLog(`戦利品【${item.name}】(${item.rarity}) を獲得！`, 'gold');
      }
    }

    function showLegendaryDiscoveryModal(item) {
      playSound('legendary');
      const m = document.getElementById('modal-layer');
      m.style.display = 'flex';
      m.className = 'legendary-modal';
      m.innerHTML = `
        <div class="legendary-box">
          <div class="legendary-tag">★ LEGENDARY ITEM DISCOVERED ★</div>
          <div style="font-size:56px; filter:drop-shadow(0 0 20px #fbbf24);">${item.icon}</div>
          <div style="font-size:22px; font-weight:900; color:#fbbf24;">${item.name}</div>
          <div style="font-size:13px; color:#fef08a;">${item.desc || '深淵の伝説的遺物'}</div>
          <div style="font-size:12px; color:#cbd5e1; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:6px; width:100%;">
            ${getItemStatSummary(item)}

    }

    /* ==========================================================================
       ROOM EVENTS (RISK & REWARD)
       ========================================================================== */
    function openChestEvent(isCursed = false) {
      if (isCursed) {
        // Cursed Chest: Epic or Legendary guaranteed, but drains 15% Max HP
        const item = generateItem(state.floor, Math.random() < 0.5 ? 'Epic' : 'Legendary');
        const hpCost = Math.round(state.maxHp * 0.15);
        state.hp = Math.max(1, state.hp - hpCost);
        state.maxHp = Math.max(20, state.maxHp - hpCost);

        playSound('hit');
        giveItemToBag(item);
        addLog(`呪いの宝箱を開封！ 代償として最大HP -${hpCost}`, 'danger');
      } else {
        const item = generateItem(state.floor);
        giveItemToBag(item);
        const goldBonus = 15 + state.floor * 8;
        state.dungeonGold += goldBonus;
        addLog(`宝箱から金貨 +${goldBonus}G を入手！`, 'gold');
      }

      state.floor++;
      setTimeout(() => generateDoorsForFloor(), 500);
    }

    /* ==========================================================================
       TOWN & CAMP GROWTH (拠点の成長)
       ========================================================================== */
    function upgradeCampFacility(fac) {
      initAudio();
      const cost = state.camp[fac] * 120;
      if (state.vaultGold < cost) {
        addLog(`ゴールドが足りません！ 必要: ${cost}G`, 'danger');
        render();
        return;
      }
      state.vaultGold -= cost;
      state.camp[fac]++;
      if (fac === 'vaultSize') state.camp.vaultSize += 10;
      playSound('heal');
      addLog(`拠点施設をレベルアップ！ 現在 Lv.${state.camp[fac]}`, 'gold');
      saveState();
      updateHeader();
      render();
    }

    function upgradeTalent(key) {
      initAudio();
      const cost = (state.talents[key] + 1) * 80;
      if (state.vaultGold < cost) {
        addLog(`ゴールド不足！ 必要: ${cost}G`, 'danger');
        render();
        return;
      }
      state.vaultGold -= cost;
      state.talents[key]++;
      playSound('heal');
      addLog(`神殿の永久加護を強化しました！`, 'gold');
      saveState();
      updateHeader();
      render();
    }

    function equipItem(index, fromVault = false) {
      initAudio();
      playSound('click');
      const list = fromVault ? state.storage : state.inventory;
      const item = list[index];
      if (!item || !['weapon', 'armor', 'accessory'].includes(item.type)) return;

      const slot = item.type;
      const oldEquip = state.equipped[slot];

      state.equipped[slot] = item;
      list.splice(index, 1);
      if (oldEquip) list.push(oldEquip);

      saveState();
      updateHeader();
      render();
    }

    function usePotion(index) {
      initAudio();
      const item = state.inventory[index];
      if (!item || item.type !== 'potion') return;

      const stats = getPlayerStats();
      const healed = Math.min(stats.maxHp - state.hp, item.heal);
      state.hp += healed;
      playSound('heal');
      addLog(`${item.name} を服用。HP +${healed} 回復！`, 'heal');
      state.inventory.splice(index, 1);
      updateHeader();
      render();
    }

    /* ==========================================================================
       UI RENDERING
       ========================================================================== */
    function setTab(tab) {
      initAudio();
      playSound('click');
      state.activeTab = tab;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tab);
      if (activeBtn) activeBtn.classList.add('active');
      renderSubPanel();
    }

    function updateHeader() {
      const stats = getPlayerStats();
      const inDungeon = (state.floor > 0);

      document.getElementById('ui-floor-icon').textContent = inDungeon ? '🪜' : '🏕️';
      document.getElementById('ui-floor-name').textContent = inDungeon ? `B${state.floor}F` : '地上 拠点';
      
      const area = inDungeon ? getCurrentArea() : null;
      document.getElementById('ui-area-tag').textContent = inDungeon ? area.tag : '生存者の野営地';

      // Goal Nudge (短い目標の常時表示)
      const nudge = document.getElementById('ui-goal-nudge');
      if (inDungeon) {
        const nextSafe = Math.ceil(state.floor / 5) * 5;
        const remain = nextSafe - state.floor;
        if (state.floor === 10 || state.floor === 20 || state.floor === 30) {
          nudge.textContent = `💀 BOSS FLOOR: 決死の戦い！`;
        } else if (remain === 0) {
          nudge.textContent = `🏰 帰還転移門 到達！ 生還可能！`;
        } else {
          nudge.textContent = `🎯 安全帰還まで: あと${remain}階`;
        }
      } else {
        const nextUpgradeCost = (state.talents.hpLv + 1) * 80;
        nudge.textContent = `🪙 強化まで: あと${Math.max(0, nextUpgradeCost - state.vaultGold)}G`;
      }

      // HP
      const hpPct = Math.max(0, Math.min(100, (state.hp / stats.maxHp) * 100));
      document.getElementById('ui-hp-bar').style.width = hpPct + '%';
      document.getElementById('ui-hp-text').textContent = `${Math.round(state.hp)} / ${stats.maxHp}`;

      // Stats
      document.getElementById('ui-atk').textContent = stats.atk;
      document.getElementById('ui-def').textContent = stats.def;
      document.getElementById('ui-crit').textContent = stats.crit + '%';
      document.getElementById('ui-gold').textContent = inDungeon ? state.dungeonGold : state.vaultGold;
      document.getElementById('ui-core').textContent = state.abyssCores;

      // Badges
      document.getElementById('ui-bag-count').textContent = state.inventory.length;

      // Codex count
      const totalCodexKnown = Object.keys(state.codex.items).length + Object.keys(state.codex.enemies).length;
      document.getElementById('ui-codex-pct').textContent = `${totalCodexKnown}種`;
    }

    function renderSubPanel() {
      const panel = document.getElementById('sub-panel');
      const stats = getPlayerStats();

      if (state.activeTab === 'equip') {
        // Equipment slots & Synergies
        const slots = [
          { k: 'weapon', label: '武器', icon: '🗡️' },
          { k: 'armor', label: '防具', icon: '🥋' },
          { k: 'accessory', label: '装飾品', icon: '💍' }
        ];

        let synHtml = stats.activeSyn.length > 0
          ? stats.activeSyn.map(s => `<div class="synergy-tag">${s.name}: ${s.desc}</div>`).join('')
          : '<div style="font-size:11px; color:#94a3b8;">発動中のシナジーなし（特定の装備組み合わせで発動）</div>';

        let equipHtml = slots.map(s => {
          const item = state.equipped[s.k];
          return `
            <div class="item-row ${item ? 'r-' + item.rarity : ''}">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:18px;">${item ? item.icon : s.icon}</span>
                <div>
                  <div class="item-name">${item ? item.name : '（未装備）'}</div>
                  <div class="item-stats">${item ? getItemStatSummary(item) : s.label}</div>
                  ${item && item.isCurse ? `<div class="item-curse-note">⚠️ 呪詛: ${item.desc}</div>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');

        panel.innerHTML = `
          <div style="font-size:12px; font-weight:bold; color:var(--gold); margin-bottom:4px;">発動中装備シナジー:</div>
          <div class="synergy-list">${synHtml}</div>
          <div style="font-size:12px; font-weight:bold; color:#fff; margin:8px 0 4px;">現在の装備品:</div>
          <div style="display:flex; flex-direction:column; gap:4px;">${equipHtml}</div>
        `;
      } else if (state.activeTab === 'bag') {
        const list = (state.screen === 'town') ? state.storage : state.inventory;
        const title = (state.screen === 'town') ? `地上倉庫 (${list.length}/${state.camp.vaultSize})` : `探索バッグ (${list.length}個)`;

        let listHtml = list.length === 0
          ? '<div style="font-size:11px; color:#94a3b8; text-align:center; padding:20px;">アイテムはありません</div>'
          : list.map((it, idx) => `
            <div class="item-row r-${it.rarity}">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:16px;">${it.icon}</span>
                <div>
                  <div class="item-name">${it.name} <span style="font-size:9px; opacity:0.8;">[${it.rarity}]</span></div>

                </div>

              <div style="display:flex; gap:4px;">
                ${['weapon', 'armor', 'accessory'].includes(it.type) ? `
                  <button class="btn btn-sub btn-xs" onclick="equipItem(${idx}, ${state.screen === 'town'})">装備</button>
                ` : ''}
                ${it.type === 'potion' ? `
                  <button class="btn btn-green btn-xs" onclick="usePotion(${idx})">使う</button>
                ` : ''}
              </div>
            </div>

              <div>
                <b style="color:${unlocked ? '#fbbf24' : '#64748b'};">${unlocked ? l.title : '？？？ (未解読の記録)'}</b>

    function getItemStatSummary(it) {
      if (!it) return '';
      let s = [];
      if (it.baseAtk) s.push(`攻+${it.baseAtk}`);
      if (it.baseDef) s.push(`防+${it.baseDef}`);
      if (it.hp) s.push(`HP+${it.hp}`);
      if (it.crit) s.push(`会心+${it.crit}%`);
      if (it.vamp) s.push(`吸血+${it.vamp}`);
      if (it.goldRate) s.push(`金+${it.goldRate}%`);
      if (it.rareRate) s.push(`幸運+${it.rareRate}%`);
      if (it.heal) s.push(`回復+${it.heal}`);
      return s.join(' | ') || it.desc;
    }

    function triggerShake() {
      const c = document.getElementById('game-container');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }

          <h2 style="font-size:18px; font-weight:900; color:#fff; margin-bottom:4px;">${data.title}</h2>
          <p style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">${data.subtitle}</p>

          <div style="background:rgba(0,0,0,0.5); padding:8px; border-radius:6px; font-size:12px; margin-bottom:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px;">
            <div>到達階層: <b style="color:#fff;">B${state.floor}F</b></div>
            <div>討伐数: <b style="color:#f87171;">${state.runKills}体</b></div>
            ${data.isDeath ? `
              <div style="color:#f87171; grid-column:1 / -1;">失ったゴールド: -${data.lostGold}G</div>
              ${data.keptGold > 0 ? `<div style="color:#4ade80; grid-column:1 / -1;">回収できたゴールド: +${data.keptGold}G</div>` : ''}
            ` : `
              <div style="color:var(--gold); grid-column:1 / -1;">獲得ゴールド: +${data.gold}G</div>
            `}
          </div>

          ${itemsDetail}

          <button class="btn btn-gold" style="margin-top:12px;" onclick="closeResultModal()">
            地上拠点へ戻る
          </button>
        </div>
      `;
    }

    function closeResultModal() {
      initAudio();
      playSound('click');
      document.getElementById('modal-layer').style.display = 'none';
      render();
    }

    /* ==========================================================================
       INITIALIZE ON LOAD
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      render();
    });

    window.addEventListener('click', () => {
      initAudio();
    }, { once: true });
  </script>
</body>
</html>
