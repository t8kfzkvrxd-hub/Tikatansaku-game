<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>地下探索型・持ち帰りローグライト - ABYSS DELVER</title>
  <meta name="description" content="地下100階の迷宮に挑む持ち帰り型ローグライト。生還か、更なる深層か。緊張感あふれるリスクとリターン。" />
  <style>
    /* ==========================================================================
       RESET & THEME
       ========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    :root {
      --bg: #090a0f;
      --panel: rgba(18, 21, 31, 0.95);
      --border: #2e384d;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --gold: #f59e0b;
      --core: #a855f7;
      --hp: #ef4444;
      --hp-bg: #450a0a;
      --atk: #f97316;
      --def: #38bdf8;
      --crit: #ec4899;
      --curse: #a855f7;
      
      --r-common: #94a3b8;
      --r-rare: #38bdf8;
      --r-epic: #c084fc;
      --r-legendary: #fbbf24;
      --r-mythic: #f43f9e;
      --r-abyssal: #22d3ee;
      --r-curse: #f43f5e;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 10%, #1c1524 0%, #08090d 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(12, 14, 20, 0.88);
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      position: relative;
      border-left: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    /* TOP STATUS BAR */
    header#status-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 16, 25, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .floor-badge {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .area-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
    }
    .goal-nudge {
      font-size: 11px;
      color: var(--gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 2px 8px;
      font-weight: bold;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.5; } }

    .hp-box { width: 100%; }
    .hp-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 2px; }
    .hp-bar-bg { width: 100%; height: 10px; background: var(--hp-bg); border-radius: 5px; overflow: hidden; border: 1px solid #5a1111; }
    .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #b91c1c, #ef4444); transition: width 0.25s ease; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      font-size: 11px;
      background: rgba(0,0,0,0.4);
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .stats-bar span b { color: #fff; }

    /* VIEWPORT */
    main#viewport {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    /* CARDS & BUTTONS */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .card-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 5px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s ease;
      width: 100%;
      min-height: 42px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.8); }
    .btn-gold { background: linear-gradient(180deg, #d97706, #b45309); color: #fff; border-color: #f59e0b; }
    .btn-gold:hover { background: linear-gradient(180deg, #f59e0b, #d97706); }
    .btn-red { background: linear-gradient(180deg, #dc2626, #991b1b); color: #fff; border-color: #ef4444; }
    .btn-blue { background: linear-gradient(180deg, #0284c7, #0369a1); color: #fff; border-color: #38bdf8; }
    .btn-green { background: linear-gradient(180deg, #059669, #047857); color: #fff; border-color: #10b981; }
    .btn-purple { background: linear-gradient(180deg, #7c3aed, #5b21b6); color: #fff; border-color: #a855f7; }
    .btn-sub { background: #1e293b; color: #e2e8f0; border-color: #475569; }
    .btn-sub:hover { background: #334155; }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-xs { padding: 4px 8px; font-size: 11px; min-height: 28px; width: auto; border-radius: 5px; }

    /* DOOR CHOICE SYSTEM (1階ごとの選択) */
    .door-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .door-card {
      background: linear-gradient(135deg, rgba(30, 36, 52, 0.9), rgba(16, 19, 28, 0.95));
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .door-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .door-card.danger-high { border-color: #ef4444; background: linear-gradient(135deg, rgba(50, 20, 25, 0.9), rgba(20, 10, 12, 0.95)); }
    .door-card.danger-curse { border-color: #a855f7; background: linear-gradient(135deg, rgba(40, 15, 50, 0.9), rgba(18, 8, 24, 0.95)); }
    .door-card.safe { border-color: #10b981; }
    .door-card.gold-room { border-color: #fbbf24; }

    .door-icon { font-size: 32px; min-width: 44px; text-align: center; }
    .door-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .door-sign { font-size: 14px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
    .door-desc { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .door-risk { font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 4px; display: inline-block; width: fit-content; }
    .risk-low { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .risk-mid { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .risk-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .risk-curse { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

    /* EVENT / BATTLE SCENE */
    .scene-box {
      background: radial-gradient(circle at 50% 30%, rgba(35, 42, 60, 0.7), rgba(12, 14, 20, 0.95));
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      position: relative;
    }
    .scene-art { font-size: 52px; filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.4)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .scene-title { font-size: 18px; font-weight: 800; color: #fff; }
    .scene-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; max-width: 92%; }

    /* BATTLE */
    .enemy-card {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1.5px solid #6b1d1d;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .enemy-card.boss { border-color: #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
    .enemy-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; }
    .enemy-intent-badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }

    /* SYNERGY BADGES */
    .synergy-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0;
    }
    .synergy-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 5px;
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.25), rgba(236, 72, 153, 0.25));
      border: 1px solid #c084fc;
      color: #f5d0fe;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
    }

    /* ITEMS & RARITY */
    .item-row {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-row.r-Common { border-left: 3.5px solid var(--r-common); }
    .item-row.r-Rare { border-left: 3.5px solid var(--r-rare); }
    .item-row.r-Epic { border-left: 3.5px solid var(--r-epic); }
    .item-row.r-Legendary { border-left: 4px solid var(--r-legendary); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
    .item-row.r-Mythic { border-left:4px solid var(--r-mythic); box-shadow:0 0 16px rgba(244,63,158,.38); background:linear-gradient(90deg,rgba(88,28,135,.32),rgba(30,41,59,.7)); }
    .item-row.r-Abyssal { border-left:4px solid var(--r-abyssal); box-shadow:0 0 22px rgba(34,211,238,.45); background:linear-gradient(90deg,rgba(8,47,73,.55),rgba(49,12,74,.5)); }
    .item-row.r-Curse { border-left: 4px solid var(--r-curse); box-shadow: 0 0 10px rgba(244, 63, 94, 0.3); }

    .item-name { font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .r-Common .item-name { color: var(--r-common); }
    .r-Rare .item-name { color: var(--r-rare); }
    .r-Epic .item-name { color: var(--r-epic); }
    .r-Legendary .item-name { color: var(--r-legendary); }
    .r-Mythic .item-name { color:var(--r-mythic); text-shadow:0 0 8px rgba(244,63,158,.6); }
    .r-Abyssal .item-name { color:var(--r-abyssal); text-shadow:0 0 10px rgba(34,211,238,.8); }
    .r-Curse .item-name { color: var(--r-curse); }
    .item-stats { font-size: 10.5px; color: #94a3b8; }
    .item-curse-note { font-size: 10.5px; color: #f87171; font-weight: bold; }

    /* BOTTOM TABS */
    nav#sub-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      gap: 3px;
      margin-top: auto;
      background: rgba(10, 12, 18, 0.9);
    }
    .sub-tab-btn {
      flex: 1;
      padding: 8px 3px;
      background: rgba(0,0,0,0.3);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .sub-tab-btn.active {
      background: var(--panel);
      border-color: var(--border);
      color: #fff;
    }
    .sub-tab-btn .badge-pill {
      background: #3b82f6;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 8px;
      margin-left: 2px;
    }
    #sub-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 10px;
      min-height: 170px;
      max-height: 220px;
      overflow-y: auto;
    }

    /* LEGENDARY DISCOVERY OVERLAY */
    .legendary-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    .update-notes-card {
      max-width:460px; width:100%; max-height:85vh; max-height:85dvh;
      display:flex; flex-direction:column; min-height:0; overflow:hidden;
      border:2px solid #fbbf24; padding:clamp(8px,3vh,22px);
    }
    .update-notes-header, .update-notes-actions { flex-shrink:0; }
    .update-notes-body {
      min-height:0; overflow-y:auto; overscroll-behavior:contain;
      margin:14px 0; display:flex; flex-direction:column; gap:7px;
    }
    .update-notes-body > div { flex-shrink:0; }
    .mythic-modal { background:radial-gradient(circle,rgba(88,28,135,.88),rgba(2,6,23,.97)); animation:fadeIn .55s ease; }
    .abyssal-modal { background:radial-gradient(circle,rgba(8,47,73,.94),#02030a 72%); animation:fadeIn 1s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .legendary-box {
      background: radial-gradient(circle at 50% 30%, #352512 0%, #15101a 100%);
      border: 2.5px solid #fbbf24;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 45px rgba(251, 191, 36, 0.6);
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: popZoom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popZoom { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .legendary-tag {
      font-size: 13px;
      letter-spacing: 2px;
      color: #fbbf24;
      font-weight: 900;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    /* CODEX (図鑑) GRID */
    .codex-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .codex-item {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .codex-item.locked {
      opacity: 0.4;
      color: var(--muted);
      border-style: dashed;
    }

    /* FX ANIMATIONS */
    .shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }

    /* ==========================================================================
       FEEDBACK & JUICE ENHANCEMENTS
       ========================================================================== */
    /* 1. Low HP Vignette & Critical Pulse */
    #danger-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.6), inset 0 0 110px rgba(185, 28, 28, 0.4);
      z-index: 45;
      animation: dangerPulse 1.1s infinite ease-in-out;
      display: none;
    }
    @keyframes dangerPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
    .hp-critical {
      animation: hpCriticalGlow 0.75s infinite alternate ease-in-out !important;
    }
    @keyframes hpCriticalGlow {
      0% { filter: brightness(1); box-shadow: 0 0 6px #ef4444; }
      100% { filter: brightness(1.7); box-shadow: 0 0 18px #ef4444; }
    }
    .critical-nudge {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
      animation: pulse 1.2s infinite !important;
    }

    /* 2. Item Acquisition Toast & Comparison */
    #item-toast-container {
      position: fixed;
      top: 68px;
      right: 12px;
      left: 12px;
      max-width: 596px;
      margin: 0 auto;
      pointer-events: none;
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .item-toast {
      background: rgba(13, 17, 26, 0.96);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1), toastOut 0.3s ease 1.3s forwards;
      width: 96%;
      max-width: 440px;
      backdrop-filter: blur(10px);
    }
    @keyframes toastIn {
      from { transform: translateY(-20px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes toastOut {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-12px) scale(0.95); opacity: 0; }
    }
    .item-toast.r-Common { border-color: var(--r-common); }
    .item-toast.r-Rare {
      border-color: var(--r-rare);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }
    .item-toast.r-Epic {
      border-color: var(--r-epic);
      box-shadow: 0 0 24px rgba(192, 132, 252, 0.6);
      animation: toastInEpic 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), toastOut 0.3s ease 1.5s forwards;
    }
    @keyframes toastInEpic {
      0% { transform: translateY(-25px) scale(0.85); opacity: 0; }
      60% { transform: translateY(2px) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .item-toast-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .item-toast-title {
      font-size: 13.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }
    .item-toast-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-Common { background: rgba(148, 163, 184, 0.2); color: var(--r-common); border: 1px solid var(--r-common); }
    .badge-Rare { background: rgba(56, 189, 248, 0.2); color: var(--r-rare); border: 1px solid var(--r-rare); }
    .badge-Epic { background: rgba(192, 132, 252, 0.25); color: var(--r-epic); border: 1px solid var(--r-epic); }
    .badge-Legendary { background: rgba(251, 191, 36, 0.25); color: var(--r-legendary); border: 1px solid var(--r-legendary); }
    .badge-Mythic { background:rgba(244,63,158,.22);color:var(--r-mythic);border:1px solid var(--r-mythic); }
    .badge-Abyssal { background:rgba(34,211,238,.2);color:var(--r-abyssal);border:1px solid var(--r-abyssal); }

    .item-toast-diff {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      background: rgba(0,0,0,0.45);
      padding: 4px 8px;
      border-radius: 5px;
      margin-top: 2px;
    }
    .diff-up { color: #4ade80; font-weight: bold; }
    .diff-down { color: #f87171; font-weight: bold; }
    .diff-eq { color: #94a3b8; }

    /* 3. Tab Flash on loot */
    .tab-flash {
      animation: tabFlashAnim 0.75s ease !important;
    }
    @keyframes tabFlashAnim {
      0% { transform: scale(1); background: rgba(59, 130, 246, 0.2); }
      35% { transform: scale(1.18); background: #3b82f6; color: #fff; box-shadow: 0 0 16px #3b82f6; }
      100% { transform: scale(1); }
    }

    /* 4. Floating Text FX Layer */
    #floating-fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 120;
    }
    .flying-fx {
      position: absolute;
      font-weight: 900;
      pointer-events: none;
      animation: flyingFloat 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 10px currentColor;
      white-space: nowrap;
    }
    @keyframes flyingFloat {
      0% { opacity: 0; transform: translate(-50%, 15px) scale(0.65); }
      20% { opacity: 1; transform: translate(-50%, -8px) scale(1.25); }

  <script>
    /* ==========================================================================
       AUDIO SYNTHESIZER (Web Audio API - Zero External Dependencies)
       ========================================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const b = document.getElementById('sound-btn');
      b.textContent = soundEnabled ? '🔊 音 ON' : '🔇 音 OFF';
      if (soundEnabled) { initAudio(); playSound('click'); }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.exponentialRampToValueAtTime(800, t + 0.04);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          osc.start(t); osc.stop(t + 0.04);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, t);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.1);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'crit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.setValueAtTime(880, t + 0.06);
          osc.frequency.setValueAtTime(1200, t + 0.14);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'player_hurt') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, t);
          osc.frequency.exponentialRampToValueAtTime(45, t + 0.15);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'heal') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(640, t + 0.2);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'item_common') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.exponentialRampToValueAtTime(800, t + 0.12);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'item_rare') {
          [587.33, 880.00].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, t + i * 0.08);
            g.gain.setValueAtTime(0.14, t + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.25);
            o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.25);
          });
        } else if (type === 'item_epic') {
          [523.25, 659.25, 1046.50, 1318.51].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.07);
            g.gain.setValueAtTime(0.16, t + i * 0.07);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.3);
            o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.3);
          });
        } else if (type === 'gold') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(987, t);
          osc.frequency.exponentialRampToValueAtTime(1318, t + 0.08);
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'kill') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(330, t);
          osc.frequency.setValueAtTime(440, t + 0.06);
          osc.frequency.setValueAtTime(660, t + 0.12);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'boss_kill') {
          [392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.1);
            g.gain.setValueAtTime(0.2, t + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.4);
            o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.4);
          });
        } else if (type === 'safe_point') {
          // Heroic discovery fanfare
          [440.00, 554.37, 659.25, 880.00].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, t + i * 0.1);
            g.gain.setValueAtTime(0.18, t + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.45);
            o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.45);
          });
        } else if (type === 'warning') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(90, t);
          osc.frequency.exponentialRampToValueAtTime(55, t + 0.2);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'legendary') {
          // Grand fanfare
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.09);
            g.gain.setValueAtTime(0.15, t + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.35);
            o.start(t + i * 0.09);
            o.stop(t + i * 0.09 + 0.35);
          });
        } else if (type === 'escape') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, t);
          osc.frequency.exponentialRampToValueAtTime(900, t + 0.35);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
          osc.start(t); osc.stop(t + 0.4);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.setValueAtTime(150, t + 0.2);
          osc.frequency.setValueAtTime(90, t + 0.4);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.7);
          osc.start(t); osc.stop(t + 0.7);
        } else if (type === 'heavy_attack') {
          // Low heavy impact
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(35, t + 0.22);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else if (type === 'weapon_skill') {
          // Arcane high sweep
          [440, 660, 880, 1320].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + i * 0.05);
            g.gain.setValueAtTime(0.18, t + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.25);
            o.start(t + i * 0.05); o.stop(t + i * 0.05 + 0.25);
          });
        } else if (type === 'parry') {
          // Metallic ring ping
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1760, t);
          osc.frequency.exponentialRampToValueAtTime(440, t + 0.3);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.start(t); osc.stop(t + 0.3);
        } else if (type === 'reroll') {
          // Dice roll shuffle
          [300, 450, 600, 750].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, t + i * 0.04);
            g.gain.setValueAtTime(0.12, t + i * 0.04);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.04 + 0.1);
            o.start(t + i * 0.04); o.stop(t + i * 0.04 + 0.1);
          });
        }
      } catch (e) {}
    }

    /* ==========================================================================
       DATA STRUCTURES (LORE, BOSSES, ITEMS, SYNERGIES, CODEX)
       ========================================================================== */
    function getFacilityUpgradeCost(type) {
      const cfg = FACILITY_CONFIG[type];
      const level = type === 'vault' ? state.camp.vaultLevel : Number(state.camp[type]);
      if (!cfg || level >= cfg.maxLevel) return null;
      return Math.round(cfg.baseCost * Math.pow(cfg.growth, Math.max(0, level - 1)) / 10) * 10;
    }

    function getFacilityCrystalCost(type) {
      const level = type === 'vault' ? state.camp.vaultLevel : Number(state.camp[type]);
      return type !== 'vault' && level >= 4 ? 3 : (type !== 'vault' && level >= 3 ? 1 : 0);
    }

    function getFacilityButtonText(type) {
      const cost = getFacilityUpgradeCost(type);
      if (cost === null) return 'MAX';
      const crystals = getFacilityCrystalCost(type);
      if (state.vaultGold < cost) return `あと${cost - state.vaultGold}G必要`;
      if (state.deepCrystals < crystals) return `深層結晶あと${crystals - state.deepCrystals}`;
      return `強化 ${cost}G${crystals ? ` +結晶${crystals}` : ''}`;
    }

    function isFacilityUpgradeDisabled(type) {
      const cost = getFacilityUpgradeCost(type);
      return cost === null || state.vaultGold < cost || state.deepCrystals < getFacilityCrystalCost(type);
    }

    function isBossFloor(floor) { return BOSS_FLOORS.includes(Number(floor)); }
    function isSafeReturnFloor(floor) { return SAFE_RETURN_FLOORS.includes(Number(floor)); }

    function getTalentUpgradeCost(key) {
      const cfg = TALENT_CONFIG[key];
      if (!cfg) return 100;
      const curLv = state.talents[key] || 0;
      if (cfg.maxLv && curLv >= cfg.maxLv) return null; // MAX reached
      return cfg.baseCost + curLv * cfg.costPerLv;
    }

    // Backward-compatible alias for older inline handlers/saves.
    const getTalentCost = getTalentUpgradeCost;

    function getRefineCost(item) {
      return 75 + ((item && item.refineCount) || 0) * 40;
    }

    function getVaultUpgradeCost() { return getFacilityUpgradeCost('vault'); }

    function initStarterItems() {

      state.equipped.armor = { key: 'starter_a', name: '擦り切れた革鎧', icon: '🥋', type: 'armor', rarity: 'Common', baseDef: 2, hp: 10, desc: '初期防具' };

    function recordCodex(type, obj) {
      if (!obj) return;
      if (type === 'item') {
        state.codex.items[obj.name] = { name: obj.name, icon: obj.icon, rarity: obj.rarity, desc: obj.desc || '装備品' };
      } else if (type === 'enemy') {

          name: obj.name, icon: obj.icon, isBoss: obj.isBoss || false,
          maxHp: obj.maxHp, atk: obj.atk, def: obj.def,
          traitName: obj.traitName, hint: obj.hint
        };
      } else if (type === 'lore') {
        state.codex.lore[obj.id] = { title: obj.title, text: obj.text };
      }

    /* ==========================================================================
       STATS & SYNERGIES CALCULATION
       ========================================================================== */
    function getSynergyBreakdown() {
      const pieces = { blood: 0, gold: 0, curse: 0, titan: 0 };
      Object.keys(state.equipped).forEach(slot => {
        const it = state.equipped[slot];
        if (it) {
          if (it.setTag && pieces[it.setTag] !== undefined) pieces[it.setTag]++;
          if (it.isCurse) pieces.curse++;
        }
      });

      return SYNERGIES.map(syn => {
        const count = pieces[syn.setTag] || 0;
        const activeLevel = syn.reqLevels.filter(req => count >= req).length;
        const nextReq = syn.reqLevels.find(req => count < req);
        const needed = nextReq ? (nextReq - count) : 0;
        return {
          ...syn,
          count,
          activeLevel,
          isActive: activeLevel > 0,
          needed,
          nextReq
        };
      });
    }

    function getActiveSynergies() {
      return getSynergyBreakdown().filter(s => s.isActive);
    }

    function getPlayerStats() {
      let maxHp = 100 + (state.talents.hpLv * 15);
      let atk = 10 + (state.talents.atkLv * 3);
      let def = 2 + (state.talents.defLv * 2);
      let crit = 5;
      let vamp = 0;
      let rareRate = state.talents.luckLv * 6;
      let goldRate = 0;
      let perFloorDrain = 0;
      let demeritDamage = 0;

      // Equipment stats
      Object.keys(state.equipped).forEach(k => {
        const item = state.equipped[k];
        if (item) {
          if (item.baseAtk) atk += item.baseAtk;
          if (item.baseDef) def += item.baseDef;
          if (item.hp) maxHp += item.hp;
          if (item.crit) crit += item.crit;
          if (item.vamp) vamp += item.vamp;
          if (item.rareRate) rareRate += item.rareRate;
          if (item.goldRate) goldRate += item.goldRate;
          if (item.curseHpDrain) perFloorDrain += item.curseHpDrain;
          if (item.demeritDamageTaken) demeritDamage += item.demeritDamageTaken;
          if (item.affix === 'critical') crit += 8;
          if (item.affix === 'lifesteal') vamp += 3;
          if (item.affix === 'max_hp') maxHp += 25;
          if (item.affix === 'damage_reduction') demeritDamage -= 10;
          if (item.affix === 'low_hp_def' && state.hp <= maxHp * 0.4) def += 8;
        }
      });

      // Synergy effects
      const synList = getSynergyBreakdown();
      synList.forEach(s => {
        if (s.id === 'syn_curse' && s.count >= 2) {
          atk += 25; crit += 15; perFloorDrain += 2;
          if (s.count >= 3) { atk += 35; crit += 15; maxHp = Math.floor(maxHp * 0.85); }
        }
        if (s.id === 'syn_titan' && s.count >= 2) {
          def += 8; maxHp += 40;
          if (s.count >= 3) { def += 14; maxHp += 60; }
        }
        if (s.id === 'syn_gold' && s.count >= 2) {
          goldRate += 100;
          if (s.count >= 3) { goldRate += 150; }
        }
        if (s.id === 'syn_blood' && s.count >= 2) {
          vamp += 4;
          if (s.count >= 3) { vamp += 6; }
        }
      });

      // Extreme Archetype Scaling (尖ったビルドの特化効果)
      // 1. 🩸 血鬼ビルド: 低HP時に圧倒的な火力と吸収
      const bloodCount = synList.find(s => s.id === 'syn_blood')?.count || 0;
      if (bloodCount >= 1 && state.hp <= (maxHp * 0.5)) {
        atk = Math.round(atk * 1.35);
        vamp += 4;
        if (state.hp <= (maxHp * 0.25)) {
          atk = Math.round(atk * 1.35); // Compounding up to ~1.8x
          vamp += 8;
        }
      }

      // 2. 👑 強欲王ビルド: 所持ゴールドが力になる
      const goldCount = synList.find(s => s.id === 'syn_gold')?.count || 0;
      if (goldCount >= 1 && state.floor > 0) {
        const goldStacks = Math.floor(state.dungeonGold / 100);
        atk += goldStacks * 2;
        def += goldStacks;
      }

      // 3. 👁️ 呪王ビルド: 呪い装備1つごとに超攻撃補正
      let curseCount = 0;
      Object.keys(state.equipped).forEach(k => {
        if (state.equipped[k]?.isCurse) curseCount++;
      });
      if (curseCount > 0) {
        atk += curseCount * 14;
        crit += curseCount * 8;
      }

      // Berserk item check (狂戦士の指輪: HP50%以下で攻撃2倍)
      if (equippedAccessories().some(i=>i.isBerserk) && state.hp <= (maxHp * 0.5)) {
        atk *= 2;
      }
      if (state.equipped.weapon?.key === 'abyssal_devourer' || equippedAccessories().some(i=>i.key==='living_core_relic')) atk += (state.abyssGrowth || 0);
      if(state.statusEffects.weakened>0)atk=Math.round(atk*.8);

      // GREED Modifiers (リスク＆リターン)
      if (state.greedLevel > 0) {
        const mults = {
          1: { gold: 50, rare: 20 },
          2: { gold: 110, rare: 45 },
          3: { gold: 220, rare: 80 }
        };
        const gInfo = mults[state.greedLevel] || mults[3];
        goldRate += gInfo.gold;
        rareRate += gInfo.rare;
      }

      // Modifiers from events
      if (state.modifiers.chestRareBonus) rareRate += state.modifiers.chestRareBonus;
      if (state.modifiers.nextChestDebuff) rareRate -= state.modifiers.nextChestDebuff;
      if (state.modifiers.goldenStairTurns > 0) goldRate += 200;
      if (state.usedVoidCloak) maxHp = Math.max(1, Math.floor(maxHp / 2));

      const activeSyn = synList.filter(s => s.isActive);
      return { maxHp, atk, def, crit, vamp, rareRate: Math.max(0, rareRate), goldRate, perFloorDrain, demeritDamage: Math.max(-40, demeritDamage), synList, activeSyn };
    }

    function addLog(msg, type = 'normal') {
      state.logs.unshift({ msg, type, time: new Date().toLocaleTimeString() });
      if (state.logs.length > 40) state.logs.pop();
    }

    /* ==========================================================================
       START RUN & TOWN FLOW
       ========================================================================== */
    function startDungeonRun() {
      initAudio();
      playSound('click');
      const stats = getPlayerStats();
      state.floor = Math.min(state.selectedStartFloor || 1, state.maxUnlockedFloor || 30);
      state.hp = stats.maxHp;
      state.maxHp = stats.maxHp;
      state.dungeonGold = 0;
      state.logs = [];
      state.runKills = 0;
      state.greedLevel = 0;
      state.rerollUsed = false;
      state.playerExposed = false;
      state.playerAttackBuff = 1.0;
      state.skillCooldown = 0;
      state.usedSecondChance = false;
      state.usedVoidCloak = false;
      state.thunderCharges = 0;
      state.abyssGrowth = 0;
      state.statusEffects = { poison:0, bleed:0, paralysis:0, bind:0, weakened:0 };
      state.lastPlayerAction = null;
      state.pendingEnemyPulse=0;clearPlayerStatuses();
      state.effectSeal=null;state.lastDefeatedEnemy=null;
      state.guardFatigue = 0;
      state.guardStamina = 100;
      state.guardBroken = false;
      state.modifiers = { goldMult: 1.0, enemyAtkMult: 1.0, chestRareBonus: 0, nextChestDebuff: 0, goldenStairTurns: 0 };

      // Prepared items brought from town
      if (state.preparedItems && state.preparedItems.length > 0) {
        state.inventory = [...state.preparedItems];
        state.preparedItems = [];
      } else {
        state.inventory = [];
      }

      // Prepared buffs
      if (state.preparedBuffs) {
        state.modifiers.chestRareBonus += (state.preparedBuffs.chestRareBonus || 0);
        state.modifiers.goldMult *= (state.preparedBuffs.goldMult || 1.0);
        state.preparedBuffs = { chestRareBonus: 0, goldMult: 1.0 };
      }

      // Expedition policy application
      const policy = state.expeditionPolicy || 'normal';
      if (policy === 'mining') {
        state.modifiers.goldMult *= 1.4;
        state.modifiers.dropPenalty = 0.15;
        addLog('⛏️ 採掘方針発動: 獲得ゴールド+40%！(アイテム出現率微減)', 'gold');
      } else if (policy === 'bounty') {
        state.modifiers.eliteRateBonus = 0.35;
        state.modifiers.bountyBonus = 1.5;
        addLog('⚔️ 討伐方針発動: エリート魔物出現率+35% / 討伐依頼報酬+50%！', 'danger');
      } else if (policy === 'excavate') {
        state.modifiers.eventRateBonus = 0.45;
        state.modifiers.chestRareBonus += 15;
        addLog('📜 発掘方針発動: 祭壇・謎イベント率+45% / 宝箱レア率+15%！', 'gold');
      } else {
        addLog('🧭 通常方針: 均整の取れた探索を開始します。', 'normal');
      }

      // Check Nameless Portrait for Second Chance
      const hasPortrait = state.storage.some(i => i.key === 'nameless_portrait') || Object.values(state.equipped).some(i => i?.key === 'nameless_portrait');
      state.mystery.hasSecondChance = hasPortrait;

      // Leon's soup requires both the upgraded tavern and an actual rescue.
      if (state.camp.tavern >= 3 && state.camp.rescuedAdventurer === true) {
        state.hp += 20;
        state.maxHp += 20;
        addLog('🧝 救助した冒険者レオンの特製スープを飲み干した！ 最大HP+20', 'heal');
      }

      // Starter Perk if chosen
      if (state.starterPerk === 'potion') {
        state.inventory.push({ id: 'pot_sp', name: '特製薬酒', icon: '🧪', type: 'potion', heal: 60, rarity: 'Rare', desc: 'HP60回復' });
      } else if (state.starterPerk === 'smoke') {
        state.inventory.push({ id: 'smoke_sp', name: '忍びの煙玉', icon: '💨', type: 'escape_item', rarity: 'Rare', desc: '戦闘から1回即離脱' });
      } else if (state.starterPerk === 'luck') {
        state.modifiers.chestRareBonus += 25;
      }

      state.starterPerk = null;

      saveState();
      addLog('深淵の地下迷宮へと足を踏み入れた。生還は5階ごとの転移門のみ！', 'gold');
      generateDoorsForFloor();
    }

    function returnToTown(safeReturn = true) {
      if (safeReturn) {
        const freeSlots = state.camp.vaultSize - state.storage.length;
        if (state.inventory.length > freeSlots && freeSlots >= 0) {
          // Warehouse overflow! Prevent item loss by letting player manage items
          openWarehouseOverflowModal(freeSlots);
          return;
        }

        finalizeSafeReturn();
      } else {
        // Death occurred
        if (state.talents.keepItemLv > 0 && state.inventory.length > 0) {
          openDeathProtectModal();
          return;
        }

        finalizeDeath();
      }
    }

    function finalizeSafeReturn() {
      playSound('escape');
      state.vaultGold += state.dungeonGold;
      
      // Move inventory into storage
      const savedItems = [...state.inventory];
      state.inventory.forEach(item => {
        if (state.storage.length < state.camp.vaultSize) {
          state.storage.push(item);
        }
      });
      state.inventory = [];

      // Check Black Egg Incubation (深淵の黒卵の孵化進捗)
      let eggHatched = false;
      state.storage.forEach(item => {
        if (item && item.key === 'black_egg') {
          item.progress = (item.progress || 0) + 1;
          state.mystery.eggReturns = Math.max(state.mystery.eggReturns || 0, item.progress);
          item.desc = `生還3回で孵化する謎の卵 (進捗: ${item.progress}/3)`;
          if (item.progress >= 3 && !eggHatched) {
            eggHatched = true;
            state.mystery.eggHatched = true;
            item.key = 'dragon_hatchling';
            item.name = '🐉 深淵の幼竜';
            item.icon = '🐉';
            item.rarity = 'Legendary';
            item.type = 'relic';
            item.desc = '【孵化した幼竜】毎ターンHP+3自動回復 ＆ 攻撃時火炎追撃(+8ダメージ)';
            playSound('legendary');
            spawnFloatingFx('🐉 黒卵が孵化した！', 'crit');
            addLog('🥚 深淵の黒卵に亀裂が走り、【深淵の幼竜】が誕生した！', 'gold');
          }
        }
      });
      if (eggHatched) state.mystery.eggReturns = Math.max(3, state.mystery.eggReturns || 0);

      // Update Tavern Quests
      state.camp.questKills = (state.camp.questKills || 0) + (state.runKills || 0);

      showResultModal({
        title: '🏰 地上への安全帰還 達成！',
        subtitle: `地下 ${state.floor} 階の転移門から無事生還しました。全ての戦利品を安全に保管しました。`,
        gold: state.dungeonGold,
        cores: state.dungeonGold >= 200 ? 1 : 0,
        items: savedItems,
        isDeath: false
      });

      state.greedLevel = 0;
      saveState();
      state.screen = 'town';
      state.floor = 0;
      if(state.chapter?.pending?.kind==='return'){state.chapter.pending=null;state.chapter.checkpoint=null;saveState();}
      updateHeader();
      render();
    }

    function finalizeDeath(customKeptItems = null, customLostItems = null) {
      playSound('gameover');
      let keptItems = customKeptItems;
      let lostItems = customLostItems;

      if (!keptItems) {
        const retainCount = state.talents.keepItemLv || 0;
        keptItems = state.inventory.slice(0, retainCount);
        lostItems = state.inventory.slice(retainCount);
      }

      keptItems.forEach(i => {
        if (state.storage.length < state.camp.vaultSize) state.storage.push(i);
      });
      state.inventory = [];

      // Lost 80% gold
      const keptGold = Math.floor(state.dungeonGold * 0.2);
      const lostGold = state.dungeonGold - keptGold;
      state.vaultGold += keptGold;

      showResultModal({
        title: '💀 探索失敗... 深淵で力尽きた',
        subtitle: `地下 ${state.floor} 階の闇に呑まれた。未保管の戦利品と大部分のゴールドを失った。`,
        lostItems: lostItems,
        keptItems: keptItems,
        lostGold: lostGold,
        keptGold: keptGold,
        items: keptItems,
        isDeath: true
      });

      state.greedLevel = 0;
      saveState();
      state.screen = 'town';
      state.floor = 0;
      updateHeader();
      render();
    }

    /* ==========================================================================
       ITEM GENERATION & LEGENDARY CELEBRATION (レア発見演出)
       ========================================================================== */
    function rollItemRarity({ floor = 1, source = 'normal', greed = 0, luck = 0, trackPity = true, rng = Math.random } = {}) {
      const progress = state.rarityProgress;
      if (trackPity) {
        progress.mythicPity++;
        progress.abyssalPity++;
      }

      if (source === 'boss_repeat') {
        const r = rng();
        if (floor >= 11 && ((trackPity && progress.abyssalPity >= 1500) || r < 0.0005)) return registerUpperRarity('Abyssal', trackPity);
        if ((trackPity && progress.mythicPity >= 250) || r < 0.0045) return registerUpperRarity('Mythic', trackPity);
        if (r < 0.0745) return 'Legendary';
        return 'Epic';
      }

      let abyssal = floor < 11 ? 0 : (floor < 21 ? 0.0002 : (floor < 51 ? 0.0006 : 0.0008));
      let mythic = floor < 11 ? 0.0015 : (floor < 21 ? 0.0040 : (floor < 31 ? 0.0050 : 0.0055));
      let legendary = 0.006 + (floor >= 21 ? 0.002 : (floor >= 11 ? 0.001 : 0));
      abyssal += Math.min(0.00015, luck * 0.000001) + greed * 0.00004;
      mythic += Math.min(0.0010, luck * 0.00001) + greed * 0.00012;
      legendary += Math.min(0.004, luck * 0.00004) + greed * 0.0008;
      if (floor < 11) abyssal = 0;

      if (source === 'elite') legendary = 0.04 + greed * 0.002;
      if (source === 'sealed_vault') legendary = 0.025;
      if (source === 'cursed_chest') legendary = 0.018;

      if (trackPity && progress.abyssalPity >= 800) abyssal += Math.min(0.0014, (progress.abyssalPity - 800) * 0.000002);
      if (trackPity && progress.mythicPity >= 100) mythic += Math.min(0.0045, (progress.mythicPity - 100) * 0.00003);

      const r = rng();
      if (floor >= 11 && ((trackPity && progress.abyssalPity >= 1500) || r < abyssal)) return registerUpperRarity('Abyssal', trackPity);
      if ((trackPity && progress.mythicPity >= 250) || r < abyssal + mythic) return registerUpperRarity('Mythic', trackPity);
      if (r < abyssal + mythic + legendary) return 'Legendary';

      if (source === 'elite') return r < abyssal + mythic + legendary + 0.28 ? 'Epic' : 'Rare';
      if (source === 'sealed_vault' || source === 'cursed_chest') return 'Epic';

      const epic = 0.075 + Math.min(0.13, luck * 0.0010) + greed * 0.018 + (floor>=31?Math.min(.04,Math.floor((floor-21)/10)*.01):0);
      const rare = 0.27 + Math.min(0.24, luck * 0.0020) + greed * 0.035;
      if (r < abyssal + mythic + legendary + epic) return 'Epic';
      if (r < abyssal + mythic + legendary + epic + rare) return 'Rare';
      return 'Common';
    }

    function registerUpperRarity(rarity, trackPity) {
      if (!trackPity) return rarity;
      if (rarity === 'Mythic') {
        state.rarityProgress.mythicPity = 0;
        state.rarityProgress.mythicTotalDrops++;
      } else {
        state.rarityProgress.abyssalPity = 0;
        state.rarityProgress.abyssalTotalDrops++;
      }
      saveState();
      return rarity;
    }

    function generateItem(floor, forcedRarity = null, source = 'normal') {
      const stats = getPlayerStats();
      let rarity = forcedRarity || rollItemRarity({ floor, source, greed: state.greedLevel, luck: stats.rareRate });

      if (rarity === 'Abyssal') {
        const pool = [UNIQUE_ITEMS.abyssal_devourer, UNIQUE_ITEMS.abyssal_observer, UNIQUE_ITEMS.abyssal_void_cloak];
        return { ...pool[Math.floor(Math.random() * pool.length)], id:'aby_' + Date.now() + Math.random(), dropSource:source };
      }
      if (rarity === 'Mythic') {
        const pool = [UNIQUE_ITEMS.mythic_thunder_blade, UNIQUE_ITEMS.mythic_blood_scythe, UNIQUE_ITEMS.mythic_sky_shield];
        return { ...pool[Math.floor(Math.random() * pool.length)], id:'myt_' + Date.now() + Math.random(), dropSource:source };
      }

      // Check unique item pool with signature archetype items
      if (rarity === 'Legendary' && Math.random() < 0.65) {
        const legPool = [
          UNIQUE_ITEMS.death_scythe,
          UNIQUE_ITEMS.abyss_armor,
          UNIQUE_ITEMS.gold_mask,
          UNIQUE_ITEMS.execution_greatsword,
          UNIQUE_ITEMS.thunder_mace,
          UNIQUE_ITEMS.blood_scythe,
          UNIQUE_ITEMS.giant_ram
        ];
        const selected = legPool[Math.floor(Math.random() * legPool.length)];
        return { ...selected, id: 'u_' + Date.now() + Math.random() };
      } else if (rarity === 'Epic' && Math.random() < 0.55) {
        const epicPool = [
          UNIQUE_ITEMS.vamp_dagger,
          UNIQUE_ITEMS.gold_blade,
          UNIQUE_ITEMS.berserk_ring,
          UNIQUE_ITEMS.thunder_mail,
          UNIQUE_ITEMS.blood_garb
        ];
        const selected = epicPool[Math.floor(Math.random() * epicPool.length)];
        return { ...selected, id: 'u_' + Date.now() + Math.random() };
      } else if (rarity === 'Rare' && Math.random() < 0.45) {
        const rarePool = [
          UNIQUE_ITEMS.thunder_ring,
          UNIQUE_ITEMS.blood_ring,
          UNIQUE_ITEMS.giant_bracer,
          UNIQUE_ITEMS.gold_mail,
          UNIQUE_ITEMS.ancient_key
        ];
        const selected = rarePool[Math.floor(Math.random() * rarePool.length)];
        return { ...selected, id: 'u_' + Date.now() + Math.random() };
      }

      // Procedural Item Generation
      const types = ['weapon', 'armor', 'accessory'];
      const type = types[Math.floor(Math.random() * types.length)];
      const names = {
        weapon: ['鋼鉄のブロードソード', '怨嗟のバトルアックス', '暗殺者のダガー', '古代の儀式槍', '戦術のショートソード'],
        armor: ['黒鉄のチェインメイル', 'ルーンの防護ローブ', '深海の鱗鎧', '名も無き騎士の甲冑', '重歩兵の板金鎧'],
        accessory: ['深紅のルビー指輪', '守護の魔導護符', '黒猫の尾チャーム', '強欲のペンダント', '翡翠の印章']
      };
      const icons = { weapon: '⚔️', armor: '🛡️', accessory: '💍' };

      const baseName = names[type][Math.floor(Math.random() * names[type].length)];
      const mult = { Common: 1, Rare: 1.35, Epic: 1.75, Legendary: 2.4, Mythic:3.0, Abyssal:3.6 }[rarity];

      const it = {
        id: 'it_' + Date.now() + Math.random(),
        name: baseName,
        icon: icons[type],
        type: type,
        rarity: rarity,
        desc: ''
      };

      if (type === 'weapon') it.baseAtk = Math.round((6 + floor * 1.5) * mult);
      if (type === 'armor') { it.baseDef = Math.round((2 + floor * 0.8) * mult); it.hp = Math.round(15 * mult); }
      if (type === 'accessory') { it.crit = Math.round(4 * mult); it.goldRate = Math.round(15 * mult); }

      // Random Curse on Legendary
      if (rarity === 'Legendary' && Math.random() < 0.25) {
        it.name = '【呪縛】' + it.name;
        it.isCurse = true;
        it.curseHpDrain = 2;
        if (it.baseAtk) it.baseAtk += 14;
        if (it.baseDef) it.baseDef += 8;
        it.desc = '驚異的性能だが毎階HP-2';
      }

      return it;
    }

    /* ==========================================================================
       EQUIPMENT COMPARISON & VISUAL FEEDBACK (演出強化)
       ========================================================================== */
    function getEquipComparison(item) {
      if (!item || !['weapon', 'armor', 'accessory'].includes(item.type)) return [];
      const current = state.equipped[equipmentSlot(item)];
      const diffs = [];

      if (item.type === 'weapon') {
        const curAtk = current?.baseAtk || 0;
        const newAtk = item.baseAtk || 0;
        const dAtk = newAtk - curAtk;
        diffs.push({
          label: '攻撃力',
          from: curAtk,
          to: newAtk,
          diff: dAtk,
          status: dAtk > 0 ? 'up' : (dAtk < 0 ? 'down' : 'eq')
        });
        if (item.crit || current?.crit) {
          const curC = current?.crit || 0;
          const newC = item.crit || 0;
          const dC = newC - curC;
          diffs.push({ label: '会心率', from: curC + '%', to: newC + '%', diff: dC, status: dC > 0 ? 'up' : (dC < 0 ? 'down' : 'eq') });
        }
      } else if (item.type === 'armor') {
        const curDef = current?.baseDef || 0;
        const newDef = item.baseDef || 0;
        const dDef = newDef - curDef;
        diffs.push({
          label: '防御力',
          from: curDef,
          to: newDef,
          diff: dDef,
          status: dDef > 0 ? 'up' : (dDef < 0 ? 'down' : 'eq')
        });
        if (item.hp || current?.hp) {
          const curH = current?.hp || 0;
          const newH = item.hp || 0;
          const dH = newH - curH;
          diffs.push({ label: '最大HP', from: '+' + curH, to: '+' + newH, diff: dH, status: dH > 0 ? 'up' : (dH < 0 ? 'down' : 'eq') });
        }
      } else if (item.type === 'accessory') {
        if (item.baseAtk || current?.baseAtk) {
          const curA = current?.baseAtk || 0;
          const newA = item.baseAtk || 0;
          const dA = newA - curA;
          diffs.push({ label: '攻撃力', from: curA, to: newA, diff: dA, status: dA > 0 ? 'up' : (dA < 0 ? 'down' : 'eq') });
        }
        if (item.crit || current?.crit) {
          const curC = current?.crit || 0;
          const newC = item.crit || 0;
          const dC = newC - curC;
          diffs.push({ label: '会心率', from: curC + '%', to: newC + '%', diff: dC, status: dC > 0 ? 'up' : (dC < 0 ? 'down' : 'eq') });
        }
        if (item.goldRate || current?.goldRate) {
          const curG = current?.goldRate || 0;
          const newG = item.goldRate || 0;
          const dG = newG - curG;
          diffs.push({ label: '獲得金', from: '+' + curG + '%', to: '+' + newG + '%', diff: dG, status: dG > 0 ? 'up' : (dG < 0 ? 'down' : 'eq') });
        }
        if (item.hp || current?.hp) {
          const curH = current?.hp || 0;
          const newH = item.hp || 0;
          const dH = newH - curH;
          diffs.push({ label: 'HP', from: '+' + curH, to: '+' + newH, diff: dH, status: dH > 0 ? 'up' : (dH < 0 ? 'down' : 'eq') });
        }
      }
      return diffs;
    }

    function showItemToast(item) {
      const container = document.getElementById('item-toast-container');
      if (!container) return;

      // Audio by rarity
      if (item.rarity === 'Epic') playSound('item_epic');
      else if (item.rarity === 'Rare') playSound('item_rare');
      else playSound('item_common');

      // Stat differences
      const diffs = getEquipComparison(item);
      let diffHtml = '';
      if (diffs.length > 0) {
        diffHtml = `
          <div class="item-toast-diff">
            ${diffs.map(d => `
              <span class="diff-${d.status}">
                ${d.label}: ${d.from} → ${d.to} ${d.status === 'up' ? '↑' : (d.status === 'down' ? '↓' : '')}
              </span>
            `).join('')}
          </div>
        `;
      } else if (item.desc || item.type === 'potion') {
        const sub = item.desc || (item.heal ? `HP +${item.heal} 回復薬` : '');
        if (sub) diffHtml = `<div class="item-toast-diff" style="color:#cbd5e1;">${sub}</div>`;
      }

      const toast = document.createElement('div');
      toast.className = `item-toast r-${item.rarity}`;
      toast.innerHTML = `
        <div class="item-toast-header">
          <div class="item-toast-title">
            <span style="font-size:18px;">${item.icon}</span>
            <span>${item.name} GET！</span>
          </div>
          <span class="item-toast-badge badge-${item.rarity}">${item.rarity}</span>
        </div>
        ${diffHtml}
      `;

      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 1500);
    }

    function spawnFloatingFx(text, type = 'info', x = 50, y = null) {
      const layer = document.getElementById('floating-fx-layer');
      if (!layer) return;

      const el = document.createElement('div');
      el.className = `flying-fx flying-${type}`;
      el.textContent = text;

      const top = (y !== null) ? y : 36 + (Math.random() * 10 - 5);
      el.style.left = x + '%';
      el.style.top = top + '%';

      layer.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 950);
    }

    function giveItemToBag(item) {
      normalizeEquipment(item);
      const wasUnknown = !state.codex.items[item.name];
      if (item.rarity === 'Mythic' || item.rarity === 'Abyssal') item.locked = true;
      recordCodex('item', item);
      state.inventory.push(item);
      if (item.key === 'ancient_key') state.mystery.keyOwned = true;
      if (wasUnknown && (item.rarity === 'Mythic' || item.rarity === 'Abyssal')) {
        state.rarityProgress.upperDropHistory.unshift({
          rarity:item.rarity, itemName:item.name, date:new Date().toISOString(), floor:state.floor,
          source:item.dropSource || (state.currentEnemy?.isElite ? 'Elite' : state.currentEnemy?.isBoss ? 'Boss' : '探索'),
          greed:state.greedLevel || 0
        });
        state.rarityProgress.upperDropHistory = state.rarityProgress.upperDropHistory.slice(0, 30);
        saveState();
      }

      // Flash bag tab animation
      const bagTab = document.getElementById('tab-btn-bag');
      if (bagTab) {
        bagTab.classList.remove('tab-flash');
        void bagTab.offsetWidth;
        bagTab.classList.add('tab-flash');
      }

      if (item.rarity === 'Mythic' || item.rarity === 'Abyssal') {
        showUpperRarityDiscoveryModal(item, wasUnknown);
      } else if (item.rarity === 'Legendary') {
        showLegendaryDiscoveryModal(item);
      } else {
        showItemToast(item);
        addLog(`戦利品【${item.name}】(${item.rarity}) を獲得！`, 'gold');
      }
      updateHeader();
    }

    /* ==========================================================================
       ROOM EVENTS (RISK & REWARD / DILEMMAS)
       ========================================================================== */
    function openChestEvent(isCursed = false) {
      if (isCursed) {
        // Cursed Chest: Guaranteed Epic or Legendary, but permanently reduces Max HP
        const item = generateItem(state.floor, null, 'cursed_chest');
        const hpCost = Math.round(state.maxHp * 0.15);
        state.hp = Math.max(1, state.hp - hpCost);
        state.maxHp = Math.max(20, state.maxHp - hpCost);

        playSound('player_hurt');
        spawnFloatingFx(`👁️ 呪縛！ -${hpCost} MaxHP`, 'danger');
        giveItemToBag(item);
        addLog(`呪いの宝箱を開封！ 代償として最大HP -${hpCost} (強力な武具を獲得)`, 'danger');
        state.floor++;
        setTimeout(() => generateDoorsForFloor(), 500);
        return;
      }

      // If player has Discern Eye talent (Lv >= 1), offer a choice between 2 items!
      if (state.talents.discernEyeLv > 0) {
        state.screen = 'event';
        const itemA = generateItem(state.floor);
        const itemB = generateItem(state.floor);

        state.currentEvent = {
          title: '🎁 宝箱の鑑定 (鑑定眼)',
          icon: '👁️',
          text: `神殿の加護【鑑定眼】が発動した！宝箱の中に2つの輝きが見える。どちらか1つを選択せよ。`,
          choices: [
            {
              text: `${itemA.icon} ${itemA.name} [${itemA.rarity}] を選ぶ (${getItemStatSummary(itemA)})`,
              action: () => {
                giveItemToBag(itemA);
                endEvent();
              }
            },
            {
              text: `${itemB.icon} ${itemB.name} [${itemB.rarity}] を選ぶ (${getItemStatSummary(itemB)})`,
              action: () => {
                giveItemToBag(itemB);
                endEvent();
              }
            }
          ]
        };
        render();
        return;
      }

      // Normal Chest with opening dilemma
      state.screen = 'event';
      state.currentEvent = {
        title: '🎁 頑丈な宝箱',
        icon: '📦',
        text: '頑丈な鉄の宝箱を見つけた。かすかに仕掛けの気配がする…どうやって開ける？',
        choices: [
          {
            text: '慎重に解除して開ける (安全 / 金貨15G消費)',
            action: () => {
              if (state.dungeonGold >= 15) {
                state.dungeonGold -= 15;
              }
              const item = generateItem(state.floor);
              giveItemToBag(item);
              const goldBonus = 20 + state.floor * 8;
              state.dungeonGold += goldBonus;
              playSound('gold');
              spawnFloatingFx(`🎁 宝箱！ +${goldBonus}G`, 'gold');
              addLog(`慎重に罠を解除し宝箱を開けた！ 金貨 +${goldBonus}G`, 'gold');
              endEvent();
            }
          },
          {
            text: '力任せにこじ開ける (無料 / 35%で警報トラップ)',
            action: () => {
              const trapped = Math.random() < 0.35;
              if (trapped) {
                playSound('player_hurt');
                state.modifiers.enemyAtkMult = 1.25;
                state.hp = Math.max(1, state.hp - 12);
                spawnFloatingFx('🚨 毒矢トラップ！ HP-12', 'danger');
                addLog('宝箱の毒矢罠が作動した！ HP -12 ＆ 次の敵攻撃力+25%', 'danger');
              }
              const item = generateItem(state.floor);
              giveItemToBag(item);
              const goldBonus = 15 + state.floor * 6;
              state.dungeonGold += goldBonus;
              playSound('gold');
              addLog(`宝箱を開放！ 金貨 +${goldBonus}G`, 'gold');
              endEvent();
            }
          }
        ]
      };
      render();
    }

    function startBloodAltarEvent() {
      state.screen = 'event';
      state.currentEvent = {
        title: '🩸 血の祭壇',
        icon: '🩸',
        text: '暗闇に浮かぶ不気味な邪神の祭壇。新鮮な生血を求めている…',
        choices: [
          {
            text: 'HP30を捧げて攻撃力+8の祝福を得る',
            action: () => {

    function upgradeCampFacility(fac) {

    function performFacilityUpgrade(type) {
      initAudio();
      const cfg = FACILITY_CONFIG[type];
      const cost = getFacilityUpgradeCost(type);
      const crystalCost = getFacilityCrystalCost(type);
      if (!cfg || cost === null) { addLog('この施設はMAXです。','info'); render(); return false; }
      if (state.vaultGold < cost || state.deepCrystals < crystalCost) {
        addLog(`強化資源不足：必要 ${cost}G${crystalCost ? ` / 深層結晶${crystalCost}` : ''}（地上保管G ${state.vaultGold}）`, 'danger');
        render(); return false;
      }
      state.vaultGold -= cost;
      state.deepCrystals -= crystalCost;
      if (type === 'vault') { state.camp.vaultLevel += 1; state.camp.vaultSize += 10; }
      else state.camp[type] += 1;
      const newLevel = type === 'vault' ? state.camp.vaultLevel : state.camp[type];
      playSound('heal');
      addLog(`${cfg.icon} ${cfg.name}をLv.${newLevel}へ強化！`, 'gold');
      saveState(); updateHeader(); render();
      showFacilityUpgradeModal(type, newLevel);
      return true;
    }

    function showFacilityUpgradeModal(type, level) {
      const cfg = FACILITY_CONFIG[type];
      const unlock = type === 'vault' ? `倉庫容量が${state.camp.vaultSize}枠になりました！` : `${cfg.unlocks[level - 1]}が解放されました！`;
      const m = document.getElementById('modal-layer'); m.style.display='flex'; m.className='legendary-modal';
      m.innerHTML=`<div class="card" style="max-width:430px;width:100%;border:2px solid #fbbf24;padding:22px;text-align:center;"><div style="font-size:36px;">🏗️</div><div style="font-size:11px;letter-spacing:2px;color:#fbbf24;">FACILITY UPGRADED</div><h2 style="color:#fff;margin:8px;">${cfg.icon} ${cfg.name} Lv.${level}</h2><p style="color:#cbd5e1;font-size:13px;">${unlock}</p><button class="btn btn-gold" style="margin-top:14px;" onclick="closeGenericModal()">確認</button></div>`;
    }

    function refineEquippedItem(slot) {
      return refineEquipmentItem(state.equipped[slot], slot);

    function refineEquipmentItem(item, slot) {
      initAudio();
      if (!item) {
        addLog('鍛え直す装備を身に着けていません！', 'danger');
        render();
        return;
      }
      const cost = getRefineCost(item);
      if ((Number(item.refineCount) || 0) >= 10) { addLog('装備強化は+10でMAXです。', 'info'); render(); return; }
      if (state.vaultGold < cost) {
        addLog(`ゴールドが不足しています！ 必要: ${cost}G (所持: ${state.vaultGold}G)`, 'danger');
        render();
        return;
      }
      state.vaultGold -= cost;
      item.refineCount = (Number(item.refineCount) || 0) + 1;
      if (slot === 'weapon') {
        item.baseAtk = (item.baseAtk || 0) + 3;
        item.name = item.name.replace(/\(\+\d+\)/, '') + `(+${item.refineCount})`;
        playSound('crit');
        spawnFloatingFx(`🔨 武器強化 +3攻！`, 'crit');
        addLog(`鍛冶屋の技により【${item.name}】を鍛え直した！ 攻撃力+3 (強化+${item.refineCount})`, 'gold');
      } else if (slot === 'armor') {
        item.baseDef = (item.baseDef || 0) + 2;
        item.hp = (item.hp || 0) + 10;
        item.name = item.name.replace(/\(\+\d+\)/, '') + `(+${item.refineCount})`;
        playSound('heal');
        spawnFloatingFx(`🛡️ 防具強化 +2防 / +10HP！`, 'heal');
        addLog(`防具の装甲を鍛錬した！ 防御力+2 / 最大HP+10 (強化+${item.refineCount})`, 'gold');
      } else {
        item.baseDef=(item.baseDef||0)+1;item.hp=(item.hp||0)+3;
        item.name=item.name.replace(/\(\+\d+\)/,'')+`(+${item.refineCount})`;
        addLog('鍛錬：防御+1 / HP+3','gold');
      }
      saveState();
      updateHeader();
      render();
    }

    function applyEquipmentAffix(slot, affixKey) {
      const item = state.equipped[slot];
      const affix = EQUIPMENT_AFFIXES[slot]?.find(a => a.key === affixKey);
      const cost = 150;
      if (!item || item.affix || !affix || state.vaultGold < cost) {
        addLog(state.vaultGold < cost ? `ゴールド不足！ 必要: ${cost}G` : '特性を付与できません。', 'danger');
        closeGenericModal(); render(); return;
      }
      state.vaultGold -= cost;
      item.affix = affix.key; item.affixName = affix.name;
      item.desc = `${item.desc || ''} 【${affix.name}: ${affix.desc}】`.trim();
      addLog(`🔨 ${item.name}に特性【${affix.name}】を付与した！`, 'gold');
      saveState(); closeGenericModal(); render();
    }

    function rerollEquipmentAffix(slot) {
      const item=state.equipped[slot]; if(!item||!item.affix||state.camp.blacksmith<4)return;
      if(state.vaultGold<120||state.deepCrystals<1){addLog('再抽選には120Gと深層結晶1が必要','danger');render();return;}
      const pool=EQUIPMENT_AFFIXES[slot].filter(a=>a.key!==item.affix);const next=pool[Math.floor(Math.random()*pool.length)];
      state.vaultGold-=120;state.deepCrystals--;item.affix=next.key;item.affixName=next.name;item.desc=`${item.desc.split(' 【')[0]} 【${next.name}: ${next.desc}】`;
      addLog(`🎲 特性を【${next.name}】へ再抽選した`,'gold');saveState();render();
    }

      if(state.vaultGold<400||state.deepCrystals<3){addLog('高位強化には400Gと深層結晶3が必要','danger');render();return;}
      state.vaultGold-=400;state.deepCrystals-=3;item.highEnhanced=true;if(item.baseAtk)item.baseAtk+=6;if(item.baseDef)item.baseDef+=5;if(item.hp)item.hp+=20;
      item.desc+=' 【高位共鳴強化済み】';addLog(`💠 ${item.name}の固有能力が共鳴した`,'gold');saveState();render();
