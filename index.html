    function buyExpeditionSupply(type) {
      initAudio();
      if (type === 'potion') {
        const cost = 30;
        if (state.vaultGold < cost) {
          addLog(`ゴールド不足！ 必要: ${cost}G`, 'danger');
          render();
          return;
        }
        state.preparedItems = state.preparedItems || [];
        const currentPots = state.preparedItems.filter(i => i.type === 'potion').length;
        const carryLimit = state.camp.shop >= 3 ? 5 : 3;
        if (currentPots >= carryLimit) {
          addLog(`出撃持込の補給品は最大${carryLimit}個までです！`, 'danger');
          render();
          return;
        }
        state.vaultGold -= cost;
        state.preparedItems.push({
          id: 'p_prep_' + Date.now() + Math.random(),
          name: '特製携帯傷薬',
          icon: '🧪',
          type: 'potion',
          heal: 40,
          rarity: 'Common',
          healPercent:10, desc: 'HP40 + 最大HP10%回復 (探索持込)'
        });
        playSound('click');
        spawnFloatingFx('🧪 傷薬を出撃準備！', 'info');
        addLog(`探索用の特製傷薬を購入！出撃準備完了 (持込: ${currentPots + 1}/${carryLimit}個)`, 'gold');
      } else if (type === 'charm') {
        const cost = 45;
        if (state.vaultGold < cost) {
          addLog(`ゴールド不足！ 必要: ${cost}G`, 'danger');
          render();
          return;
        }
        state.preparedBuffs = state.preparedBuffs || { chestRareBonus: 0, goldMult: 1.0 };
        if ((state.preparedBuffs.chestRareBonus || 0) >= 45) {
          addLog('幸運護符の効果は最大3枚分(+45%)まで重複可能です！', 'info');
          render();
          return;
        }
        state.vaultGold -= cost;
        state.preparedBuffs.chestRareBonus = (state.preparedBuffs.chestRareBonus || 0) + 15;
        playSound('gold');
        spawnFloatingFx('🍀 幸運護符 出撃準備！', 'gold');
        addLog(`幸運の護符を購入！次の探索で宝箱レア率 +${state.preparedBuffs.chestRareBonus}%`, 'gold');
      } else if (type === 'smoke' || type === 'antidote' || type === 'greater') {
        const defs={smoke:{cost:60,item:{name:'携帯煙玉',icon:'💨',type:'escape_item',rarity:'Rare',desc:'通常戦闘から即時離脱'}},antidote:{cost:40,item:{name:'万能解毒薬',icon:'💊',type:'potion',heal:10,cureAll:true,rarity:'Rare',desc:'状態異常を全解除しHP10回復'}},greater:{cost:90,item:{name:'上級傷薬',icon:'🧴',type:'potion',heal:0,healPercent:30,rarity:'Epic',desc:'最大HP30%回復'}}};
        const def=defs[type]; if(state.vaultGold<def.cost){addLog(`ゴールド不足！ 必要:${def.cost}G`,'danger');render();return;}
        state.vaultGold-=def.cost;state.preparedItems.push({...def.item,id:`prep_${type}_${Date.now()}_${Math.random()}`});addLog(`${def.item.name}を出撃準備へ追加`,'gold');
      }
      saveState();
      updateHeader();
      render();
    }

    function setExpeditionPolicy(policy) {
      initAudio();
      playSound('click');
      state.expeditionPolicy = policy;
      saveState();
      render();
    }

    function selectStarterPerk(perk) {
      state.starterPerk = perk;
      saveState();
      playSound('click');
      render();
    }

    function selectStartFloor(floor) {
      if(floor>state.maxUnlockedFloor||floor>MAX_DUNGEON_FLOOR)return;state.selectedStartFloor=floor;saveState();render();
    }

    function getItemSellPrice(item) {
      if (!item) return 0;
      const basePrices = { Common: 15, Rare: 45, Epic: 120, Legendary: 320, Mythic: 1200, Abyssal: 5000 };
      let price = basePrices[item.rarity] || 15;
      if (item.refineCount) price += item.refineCount * 30;
      return price;
    }

    function toggleLockItem(index, isVault = true) {
      initAudio();
      playSound('click');
      const list = isVault ? state.storage : state.inventory;
      if (list[index]) {
        list[index].locked = !list[index].locked;
        saveState();
        renderSubPanel();
      }
    }

    function canSellStoredItem(item) {
      return !!item && !item.locked && !equipmentOwner(item);
    }

    let storageCategory = 'all';
    function setStorageCategory(category) { storageCategory = category; renderSubPanel(); }
    function getStorageRows(list, filter = 'all', rarity = null, tag = null) {
      const rows = [];
      list.forEach((it, idx) => {
        const category = ['weapon','armor','accessory'].includes(it.type) ? equipmentSlot(it) : it.type==='material'?'material':['potion','escape_item','consumable'].includes(it.type) ? 'consumable' : 'other';
        if(rarity&&it.rarity!==rarity)return;
        if(tag&&!(it.tags||[]).includes(tag))return;
        if (filter !== 'all' && category !== filter) return;
        const existing = it.type === 'material' && rows.find(r => r.it.type === 'material' && (r.it.key || r.it.name) === (it.key || it.name) && !!r.it.locked === !!it.locked);
        if (existing) existing.count++;
        else rows.push({it, idx, count:1});
      });
      return rows;
    }
    function getTavernReward() {
      return Math.round(Math.max(0, Math.min(1000, Number(state.bounty?.rewardGold) || 150)) * (state.expeditionPolicy === 'bounty' ? 1.5 : 1));
    }

    function sellItemFromStorage(index) {
      initAudio();
      const item = state.storage[index];
      if (!item) return;
      if (!canSellStoredItem(item)) {
        addLog('🔒 ロックされているアイテムは売却できません！先にロックを解除してください。', 'danger');
        render();
        return;
      }
      if (['Legendary','Mythic','Abyssal'].includes(item.rarity) && !window.confirm(`【${item.name}】を売却しますか？ この操作は取り消せません。`)) return;
      const price = getItemSellPrice(item);
      state.vaultGold += price;
      state.storage.splice(index, 1);
      playSound('gold');
      spawnFloatingFx(`+${price}G`, 'gold');
      addLog(`【${item.name}】を売却し、${price}G を獲得しました。`, 'gold');
      saveState();
      updateHeader();
      renderSubPanel();
    }

    function bulkSellStorage(maxRarity = 'Common') {
      initAudio();
      const allowedRarities = {Common:['Common'],Rare:['Common','Rare'],Epic:['Common','Rare','Epic']}[maxRarity] || [];
      let soldCount = 0;
      let totalEarned = 0;

      for (let i = state.storage.length - 1; i >= 0; i--) {
        const item = state.storage[i];
        if (allowedRarities.includes(item.rarity) && canSellStoredItem(item)) {
          const price = getItemSellPrice(item);
          totalEarned += price;
          soldCount++;
          state.storage.splice(i, 1);
        }
      }

      if (soldCount === 0) {
        addLog(`一括売却対象となる未ロックの ${maxRarity === 'Common' ? 'Common' : 'Rare以下'} アイテムはありません。`, 'info');
        render();
        return;
      }

      state.vaultGold += totalEarned;
      playSound('gold');
      spawnFloatingFx(`💰 一括売却 +${totalEarned}G`, 'gold');
      addLog(`【一括売却】${soldCount}個のアイテムを売却し、合計 ${totalEarned}G を獲得しました！`, 'gold');
      saveState();
      updateHeader();
      renderSubPanel();
    }

    function sortStorage(criteria = 'rarity') {
      initAudio();
      playSound('click');
      const rarityRank = { Abyssal: 6, Mythic: 5, Legendary: 4, Epic: 3, Rare: 2, Common: 1 };
      const typeRank = { weapon: 1, armor: 2, accessory: 3, potion: 4, relic: 5 };

      state.storage.sort((a, b) => {
        if (criteria === 'rarity') {
          const diff = (rarityRank[b.rarity] || 0) - (rarityRank[a.rarity] || 0);
          if (diff !== 0) return diff;
          return (b.baseAtk || b.baseDef || 0) - (a.baseAtk || a.baseDef || 0);
        } else if (criteria === 'atk') {
          return (b.baseAtk || 0) - (a.baseAtk || 0);
        } else if (criteria === 'def') {
          return (b.baseDef || 0) - (a.baseDef || 0);
        } else if (criteria === 'type') {
          return (typeRank[a.type] || 99) - (typeRank[b.type] || 99);
        }
        return 0;
      });

      addLog(`倉庫のアイテムを【${criteria === 'rarity' ? 'レア度順' : (criteria === 'atk' ? '攻撃力順' : (criteria === 'def' ? '防御力順' : '種別順'))}】に並べ替えました。`, 'normal');
      saveState();
      renderSubPanel();
    }

    function claimTavernBounty() {
      initAudio();
      if (state.camp.tavern < 2 || !state.bounty || !state.bounty.completed) return;
      const reward = getTavernReward();
      state.vaultGold += reward;
      playSound('gold');
      spawnFloatingFx(`💰 討伐達成 +${reward}G`, 'gold');
      addLog(`冒険者の酒場で賞金首の報酬 +${reward}G を受け取った！ 新たな依頼が張り出された。`, 'gold');

      // Setup next bounty
      const nextKills = Math.min(30, (Number(state.bounty.targetKills) || 5) + 3);
      const nextGold = Math.min(1000, Math.round(Math.min(1000, Number(state.bounty.rewardGold) || 150) * 1.35));
      state.bounty = {
        targetKills: nextKills,
        currentKills: 0,
        rewardGold: nextGold,
        completed: false
      };
      saveState();
      updateHeader();
      render();
    }

    function selectTavernContract(type) {
      if (state.camp.tavern < 4) return;
      const defs={short:{targetKills:5,rewardGold:180,label:'短期討伐'},elite:{targetKills:10,rewardGold:420,label:'Elite掃討'},boss:{targetKills:18,rewardGold:850,label:'深層賞金首'}};
      if(type==='boss'&&state.camp.tavern<5)return;
      state.bounty={...defs[type],currentKills:0,completed:false,type};
      addLog(`📜 ${defs[type].label}を受注した`,'gold');saveState();render();
    }

    function equipItem(index, fromVault = false, accessorySlot = null) {
      initAudio();
      playSound('click');
      const list = fromVault ? state.storage : state.inventory;
      const item = list[index];
      if (!item || !['weapon', 'armor', 'accessory'].includes(item.type)) return;
      if (equipmentOwner(item)) return;

      normalizeEquipment(item);
      const slot = item.type==='accessory' ? (accessorySlot==='accessory2'?'accessory2':accessorySlot==='accessory'?'accessory':!state.equipped.accessory?'accessory':!state.equipped.accessory2?'accessory2':'accessory') : equipmentSlot(item);
      const oldEquip = state.equipped[slot];

      state.equipped[slot] = item;
      list.splice(index, 1);
      if (oldEquip) list.push(oldEquip);

      saveState();
      updateHeader();
      render();
    }

    function usePotion(index) {
      initAudio();
      const item = state.inventory[index];
      if (!item || item.type !== 'potion') return;

      const stats = getPlayerStats();
      const amount=(item.heal||0)+Math.round(stats.maxHp*(item.healPercent||0)/100);
      const healed = Math.min(stats.maxHp - state.hp, amount);
      state.hp += healed;
      if(item.cureAll) clearPlayerStatuses();
      playSound('heal');
      addLog(`${item.name} を服用。HP +${healed} 回復！`, 'heal');
      state.inventory.splice(index, 1);
      updateHeader();
      render();
    }

    /* ==========================================================================
       UI RENDERING
       ========================================================================== */
    function setTab(tab) {
      initAudio();
      playSound('click');
      state.activeTab = tab;
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tab);
      if (activeBtn) activeBtn.classList.add('active');
      renderSubPanel();
    }

    function triggerShake() {
      const c = document.getElementById('game-container');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }

    /* ==========================================================================
       RESULT MODAL (帰還 / 死亡結果画面)
       ========================================================================== */
    function showResultModal(data) {
      const m = document.getElementById('modal-layer');
      m.style.display = 'flex';
      m.className = 'legendary-modal';

      let itemsDetail = '';
      let mvpHtml = '';

      if (data.isDeath) {
        itemsDetail = `
          <div style="text-align:left; font-size:11.5px; width:100%;">
            <div style="color:#f87171; font-weight:bold;">失った未保管アイテム (${data.lostItems.length}個):</div>
            <div style="max-height:90px; overflow-y:auto; margin:4px 0; display:flex; flex-direction:column; gap:2px;">
              ${data.lostItems.map(i => `<div style="color:#94a3b8; font-size:11px;">✕ ${i.icon} ${i.name} [${i.rarity}]</div>`).join('') || '<div style="color:#64748b;">なし</div>'}
            </div>
            ${data.keptItems.length > 0 ? `
              <div style="color:#4ade80; font-weight:bold; margin-top:4px;">遺品守護符で持ち帰れたアイテム (${data.keptItems.length}個):</div>
              <div style="color:#e2e8f0;">${data.keptItems.map(i => `${i.icon} ${i.name}`).join(', ')}</div>
            ` : ''}
          </div>
        `;
      } else {
        if (data.items && data.items.length > 0) {
          const rarityScore = { Abyssal: 6, Mythic: 5, Legendary: 4, Epic: 3, Rare: 2, Common: 1 };
          const sorted = [...data.items].sort((a, b) => {
            const rDiff = (rarityScore[b.rarity] || 0) - (rarityScore[a.rarity] || 0);
            if (rDiff !== 0) return rDiff;
            return (getItemSellPrice(b) || 0) - (getItemSellPrice(a) || 0);
          });
          const mvp = sorted[0];
          mvpHtml = `
            <div style="background:rgba(251,191,36,0.12); border:1.5px solid rgba(251,191,36,0.5); border-radius:8px; padding:8px 10px; margin:8px 0; text-align:left;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <span style="font-size:11px; font-weight:900; color:#fbbf24;">🌟 本探索のMVP戦利品</span>
                <span class="item-toast-badge badge-${mvp.rarity}" style="font-size:9.5px;">${mvp.rarity}</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:24px; filter:drop-shadow(0 0 6px rgba(251,191,36,0.4));">${mvp.icon}</span>
                <div style="flex:1;">
                  <div style="font-size:13px; font-weight:bold; color:#fff;">${mvp.name}</div>
                  <div style="font-size:10.5px; color:#cbd5e1;">${getItemStatSummary(mvp)}</div>
                </div>
              </div>
            </div>
          `;
        }

        itemsDetail = `
          <div style="text-align:left; font-size:11.5px; width:100%;">
            <div style="color:var(--gold); font-weight:bold;">倉庫に保管された戦利品 (${data.items.length}個):</div>
            <div style="max-height:100px; overflow-y:auto; margin:4px 0; display:flex; flex-direction:column; gap:2px;">
              ${data.items.map(i => `<div style="color:#e2e8f0; font-size:11px;">✔ ${i.icon} ${i.name} [${i.rarity}]</div>`).join('') || '<div style="color:#64748b;">なし</div>'}
            </div>
          </div>
        `;
      }

      m.innerHTML = `
        <div class="card" style="max-width:440px; width:100%; border:2px solid ${data.isDeath ? '#ef4444' : '#f59e0b'}; text-align:center; padding:18px;">
          <h2 style="font-size:18px; font-weight:900; color:#fff; margin-bottom:4px;">${data.title}</h2>
          <p style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">${data.subtitle}</p>

          <div style="background:rgba(0,0,0,0.5); padding:8px; border-radius:6px; font-size:12px; margin-bottom:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px;">
            <div>到達階層: <b style="color:#fff;">B${state.floor}F</b></div>
            <div>討伐数: <b style="color:#f87171;">${state.runKills}体</b></div>
            ${data.isDeath ? `
              <div style="color:#f87171; grid-column:1 / -1;">失ったゴールド: -${data.lostGold}G</div>
              ${data.keptGold > 0 ? `<div style="color:#4ade80; grid-column:1 / -1;">回収できたゴールド: +${data.keptGold}G</div>` : ''}
            ` : `
              <div style="color:var(--gold); grid-column:1 / -1;">獲得ゴールド: +${data.gold}G</div>
            `}
          </div>

          ${mvpHtml}
          ${itemsDetail}

          <button class="btn btn-gold" style="margin-top:12px;" onclick="closeResultModal()">
            地上拠点へ戻る
          </button>
        </div>
      `;
    }

    function closeResultModal() {
      initAudio();
      playSound('click');
      document.getElementById('modal-layer').style.display = 'none';
      render();
    }

    /* ==========================================================================
       INITIALIZE ON LOAD
       ========================================================================== */
    window.__gameDebug = {
      get state() { return state; },
      AREAS,
      get GAME_VERSION() { return GAME_VERSION; }
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      render();
      if (localStorage.getItem('lastSeenVersion') !== GAME_VERSION) showUpdateNotes(true);
      else checkTutorial();
    });

    window.addEventListener('click', () => {
      initAudio();
    }, { once: true });
  </script>
  <script src="chapter-data.js"></script>
  <script src="js/data/craftingCatalog.js"></script>
  <script src="crafting.js"></script>
  <script src="equipment.js"></script>
  <script src="depth-rules.js"></script>
  <script src="chapter-story.js"></script>
  <script src="chapter-system.js"></script>
  <script src="companion-equipment.js"></script>
  <script src="forge-ui.js"></script>
</body>
